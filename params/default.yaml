# fate — 默认参数集
#
# 本文件是**文档表述**，默认值的真源是 packages/core/src/params/defaults.ts。
# 二者由 test/params.spec.ts 断言逐键一致（weights / structure / propagation 三段全覆盖），
# 任一处漂移即构建失败。理由见 docs/03-weights.md §8.5。
#
# core 中不得出现任何硬编码的命理系数。
# 运行时校验见 params/load.ts：区间与枚举、结构不变量两类，一次报出全部错误。
#
# 标记说明：
#   [流派]  人工决策项，不进入自动校准（见 docs/11-validation.md §4.3）
#   [校准]  数据驱动项，由金标准集拟合
#   [硬约束] 不得修改，改则构建失败

version: 1
schema: fate-params/v1

# ═══════════════════════════════════════════════════════════
# L0 · 排盘
# ═══════════════════════════════════════════════════════════
chart:
  ziHourRule: lateZiNextDay        # [流派] lateZiNextDay | earlyZiSameDay | split
  mingGongBoundary: jie            # [流派] jie | zhongqi        ⚠️ 待校准 #1
  hiddenStemVariant: standard      # [流派] standard | alt        ⚠️ 待校准 #5

  trueSolarTime: true
  equationOfTime: true
  handleDst: true
  southernHemisphereFlip: false    # [硬约束] 传统不反转季节

  includeShenGong: false
  includeTaiXi: false

# ═══════════════════════════════════════════════════════════
# L1 · 配重
# ═══════════════════════════════════════════════════════════
weights:
  pillarBase: 100
  stemShare: 0.40                  # 天干占比
  branchShare: 0.60                # 地支占比   (stemShare + branchShare == 1)

  # 地支分数 → 藏干，按藏干个数取用
  hiddenSplit:
    1: [1.00]
    2: [0.70, 0.30]
    3: [0.65, 0.25, 0.10]

  monthCommand:
    branchMultiplier: 2.00         # [校准] 月支放大 → 60 × 2.00 = 120
    stemMultiplier: 1.20           # [校准] 月干放大 → 40 × 1.20 = 48
    silingBoost: 1.50              # [校准] 司令藏干加成，组内重归一
    useSilingTable: true
    silingResolution: sameElement  # exact | sameElement | none
    silingPolarityOverride: false  # 司令期内是否用司令干的阴阳

  luck:                            # 大运
    total: 130                     # [校准]
    mode: linear                   # linear | step
    stemShareStart: 0.70           # 交运时（elapsed=0）天干占比
    stemShareEnd: 0.30             # 换运前（elapsed=10）天干占比
    stepFirstHalf: 0.65            # 仅 mode=step
    stepSecondHalf: 0.35           # 仅 mode=step
    # 交叉点：stemShare(elapsed=5) == 0.50，恰在第 5 年末

  year:                            # 流年
    total: 110                     # [校准]
    stem: 40
    branch: 70                     # 注意：40:70，非本命的 40:60
    stemBranchSwing: false         # 上下半年干支主次切换（实验）

  kongwang:
    enabled: true
    factor: 0.80                   # [校准]
    releasedByChong: true
    releasedByHe: true
    applyToLuckAnnual: false

  revealedResonance: 1.00          # 刻意置 1.00 —— 透干效应由 L3 距离模型承担
  includeTaiyuan: false
  taiyuanTotal: 40

# ═══════════════════════════════════════════════════════════
# L2 · 结构（会合冲刑害破）
# ═══════════════════════════════════════════════════════════
structure:
  precedence: [sanhui, sanhe, banhe, liuhe, ganhe, chong, ganchong, xing, hai, po]

  sanhui:
    gain: 1.40                     # [校准] 化神五行的藏干
    decay: 0.50                    # [校准] 非化神五行的藏干
  sanhe:
    gain: 1.30
    decay: 0.60
  banhe:
    shengWang: { gain: 1.20, decay: 0.75 }
    wangMu:    { gain: 1.15, decay: 0.80 }
    gong:      { gain: 1.05, decay: 0.95 }   # 缺旺神，仅作标记

  heDistance:                      # 合局的距离系数
    adjacent: 1.00
    gap1: 0.80
    gap2: 0.60
  externalHeFactor: 0.90           # 含大运/流年的合

  transform:                       # 合化判定（六合与天干五合共用）
    requireMonthSupport: true      # C1
    requireCatalyst: true          # C2
    catalystThreshold: 30
    blockOnContention: true        # C3 争合妒合
    blockOnChong: true             # C4
    gainOnSuccess: 1.20
    bindFactorOnFailure: 0.70      # 合绊：activity ×= 此值
    contentionFactor: 0.85         # 争合：activity ×= 此值
    ganheRequireAdjacent: true     # 天干五合须相邻才可能化

  chong:
    uprootThreshold: 2.50          # [校准] 强弱比 ≥ 此值判为拔根
    strongLoss: 0.20
    weakLoss: 0.50
    weakLossUproot: 0.75
    equalLoss: 0.35
    equalBandRatio: 1.20           # r < 此值视为势均
    distance:
      adjacent: 1.00
      gap1: 0.60
      gap2: 0.30
      luckToNatal: 0.90
      annualToNatal: 0.85
      luckToAnnual: 1.00

  ganchong:
    factor: 0.50                   # 天干为虚，整体折半
    requireAdjacent: true

  arbitration:                     # 冲合互解裁决
    heTypeCoef: { sanhui: 1.00, sanhe: 0.85, banhe: 0.65, liuhe: 0.55 }
    chongCoef: 2.00
    decisiveMargin: 1.20           # 胜者需超出 20% 才判定，否则两败
    mutualDamageFactor: 0.60       # 两败时冲的损耗折扣

  tomb:
    sealedFactor: 0.60             # 闭库时中气/余气的折扣
    openOnChong: true
    openOnXing: true
    releaseGain: 1.30

  xing:
    fullFactor: 0.80               # 三支全见
    ziMaoFactor: 0.85              # 子卯二支即成
    selfFactor: 0.90               # 自刑
    partialFactor: 0.93            # 三刑只见两支

  hai: { factor: 0.93 }
  po:  { enabled: true, factor: 0.97 }

# ═══════════════════════════════════════════════════════════
# L3 · 生克传导
# ═══════════════════════════════════════════════════════════
propagation:
  mode: syncIterative              # [硬约束] 同步迭代，保证顺序无关
  damping: 0.50                    # [校准] λ，与 maxRounds 共同决定交互深度
  maxRounds: 3                     # [校准] **交互深度**，不是收敛控制 —— 见下
  epsilon: 0.002                   # 提前停止的安全阀，非主控制
  outflowCap: 0.35                 # 单轮任一载体的流出上限（占其权重）
  inflowDamageCap: 0.40            # 单轮任一载体的受克上限（占其权重）
  floor: 0.0

  kernel:
    sheng: 0.30                    # [校准]
    ke:    0.40                    # [校准] 克重于生

  shengEfficiency: 0.85            # η，生的传输效率；(1−η) 为损耗
  keCost: 0.30                     # 克者自耗，占其造成伤害的比例

  polarity:
    shengCross: 1.00               # 异性相生（正印/伤官）力大
    shengSame:  0.70               # 同性相生（偏印/食神）力小
    keSame:     1.00               # 同性相克（七杀）无情力猛
    keCross:    0.70               # 异性相克（正官/正财）有情力缓

  tongdang:
    mode: resistance               # [硬约束建议] resistance | additive
    beta: 0.60                     # [校准] 抗性强度
    additiveKernel: 0.20           # 仅 mode=additive；已知会引入正反馈

  distance:
    samePillar:       1.00         # 天干 ↔ 本柱地支藏干
    sameBranchHidden: 0.60         # 同一地支内的藏干之间
    adjacent:         0.80
    gap1:             0.40
    gap2:             0.20         # 年 ↔ 时
    crossLayerFactor: 0.70         # 附加：天干 ↔ 异柱地支

  external:                        # 刻意不对称：环境作用于命强，命作用于环境弱
    luckToNatal:   0.80
    annualToNatal: 0.70
    luckToAnnual:  1.00
    natalToLuck:   0.60
    natalToAnnual: 0.50
    annualToDayMasterBonus: 1.15

# ═══════════════════════════════════════════════════════════
# L4 · 断论
# ═══════════════════════════════════════════════════════════
conclusion:
  changshengSchool: yangForwardYinReverse   # [流派] | sameBirthDeath   ⚠️ #3
  earthChangsheng: fireEarthSame            # [流派] | waterEarthSame   ⚠️ #4

  strengthBands:
    veryStrong:  0.70
    strong:      0.55
    balancedLow: 0.45
    weak:        0.30

  confidence:
    bandMargin: 0.05               # 距阈值多远算高置信
    floor: 0.30

  rootCoef:
    luRen:      1.00               # 禄 / 羊刃
    changsheng: 0.70
    ku:         0.50               # 库根
    yuqi:       0.30               # 中气 / 余气

  congge:
    ratioThreshold: 0.30
    requireRootless: true
    yinThreshold: 25               # 印星权重超此值则不从

  specialGe:
    zhuanwangThreshold: 0.78
    suppressThreshold: 40
    enableHuaqi: true
    huaqiConfidenceCap: 0.60       # ⚠️ #11 化气格实务争议大

  yongshen:
    # 求值次序，非并列清单。前三者短路，病药是后置精修 ——
    # 若按「调候→扶抑→通关→病药」实现，通关与病药都是死代码。见 conclude/yongshen.ts 模块头。
    priority: [tiaohou, tongguan, fuyi, bingyao]
    tiaohou:
      source: heuristic            # heuristic | table   ⚠️ #2 待转录《穷通宝鉴》
      fireFloor:  0.08             # 冬月火占比低于此值 → 极寒
      waterFloor: 0.08             # 夏月水占比低于此值 → 极燥
    weakYongshenThreshold: 15      # 用神权重低于此值 → needsLuckSupport
    tongguan:
      balanceBand: 0.20            # 两方权重差异比例
      dominanceFloor: 0.45         # 两方合计占总权重的下限
    bingyao:
      damageShare: 0.42            # [校准] 折损比 damage/(W用神+damage) 超此值方成病
      damageFloor: 8               # 绝对下限，挡住用神本就不存在的盘

  femaleChildStarVariant: standard # [流派] | reversed   ⚠️ #7

# ═══════════════════════════════════════════════════════════
# 神煞
# ═══════════════════════════════════════════════════════════
shensha:
  primaryBase: day                 # day | year
  alsoComputeYearBase: true
  scanTargets: [year, month, day, hour, luck, annual, taiyuan, mingGong]

  includeDisputed: false           # ⚠️ #9 福星/天厨/词馆
  yinYangRen: false                # ⚠️ #10 阴干羊刃
  yuanchen: false                  # ⚠️ #8 元辰起例待定
  tianluodiwang:
    enabled: true
    applyNayinFilter: true

  modifiers:
    zuowangThreshold: 1.30         # 宿主支权重 ≥ 场均 × 此值 → 坐旺
    zuoshuaiThreshold: 0.50        # ≤ 场均 × 此值 → 坐衰

# ═══════════════════════════════════════════════════════════
# L5 · 时间层
# ═══════════════════════════════════════════════════════════
temporal:
  qiyun:
    mode: continuous               # continuous | traditionalDiscrete
    daysPerYear: 3
    reportBothModes: true
  luckPillarCount: 12
  includeXiaoyun: false
  yearRangeYears: 120
  sampleLuckAt: [start, mid, end]

  monthLayer:
    recomputeWeights: false        # [硬约束] 月是引动的扳机，不是力量的来源
    maxInteractionsShown: 3

  dayLayer:
    recomputeWeights: false        # [硬约束]
    severityLevels: 2

  index:
    # [校准] 顺逆指数 = 50 + 50·tanh(a·结构项 + b·事件项)
    # 原取 4.00 / 0.35，实测 240 个盘年中 32% 落在 <5 或 >95 —— 三分之一的年份
    # 被 tanh 压到两端，指数退化成近乎二值的信号。降到下列取值后饱和率 1%，
    # 落在 25–75 中段的年份由 21% 升至 45%。见 docs/08-temporal.md §5.2。
    a: 2.00                        # 权重结构变化的贡献
    b: 0.20                        # 应期事件的贡献

# ═══════════════════════════════════════════════════════════
# L4p · 人格层
# ═══════════════════════════════════════════════════════════
persona:
  source: conventional             # [流派] 十神特质表底本，可替换
  excessShare: 0.35                # [校准] 占同侧分布比例超此值判「过旺」
  deficientShare: 0.05             # [校准] 低于此值判「过弱」；为 0 即「缺」
  # [校准] 主导十神并列的判据。置信度公式 0.45 + 0.15×gap/dominantMargin
  # 与它由构造对齐：gap 等于本值时恰得 0.60，即模板的 confidenceFloor。
  # 于是「判为并列」与「改用留有余地的措辞」永远同进同出。
  dominantMargin: 0.05

  # ── 形体与脏腑（《内经》五行配属）──
  neijingSource: conventional      # [流派] 配属表底本，可替换   ⚠️ 待校准 #15
  # [流派] 五窍配属。内经内部两篇不一致，非转录疏漏：
  #   《素问·阴阳应象大论》 心在窍为舌、肾在窍为耳   ← 默认，亦即后世主流
  #   《素问·金匮真言论》   心开窍于耳、肾开窍于二阴
  wuqiaoSource: yinyangYingxiang   # ⚠️ 待校准 #16
  bodyCorrespondence: true         # subject=other 时强制关闭
  excessBand: 0.30                 # [校准] 相对五行均分的偏离超此值判「实」
  deficientBand: 0.30              # [校准] 低于负此值判「虚」
  attackedBand: 0.25               # [校准] 受克/自身权重 超此值判「受制」「被伐」
  seasonAdjust: 0.15               # [校准] 月令对寒热轴的修正幅度
  axisBand: 0.12                   # [校准] 寒热、燥湿判「偏」的门槛

# ═══════════════════════════════════════════════════════════
# L5c · 生命曲线
# ═══════════════════════════════════════════════════════════
series:
  spanYears: 60                    # 统计基准窗，自起运起算
  drawYears: 60                    # 曲线绘制跨度（不得小于 spanYears）
  # [硬约束] 月度采样。曲线本来就连续：流年是阶跃、大运是斜坡，
  # 而结构的结局也在运内变化 —— 实测 528 步运里 191 次出现
  # 「冲而拔根 ⇄ 相冲」「合解冲 ⇄ 相冲」这类翻转。年度采样会把它们整个抹掉。
  samplesPerYear: 12
  # [硬约束] 流月不参与权重。月度上之所以有变化，是大运份额在推移，不是流月加了分。
  fleetingMonthInWeights: false
  agitation:                       # [校准] 扰动序列的系数
    chong: 1.00
    sanheSanhui: 0.85
    liuhe: 0.70
    xing: 0.60
    hai: 0.40
    po: 0.25
    layerLuck: 1.00
    layerAnnual: 0.85
    layerMonth: 0.45

# ═══════════════════════════════════════════════════════════
# L6 · 报告
# ═══════════════════════════════════════════════════════════
report:
  locale: zh-Hans                  # zh-Hans | zh-Hant | en
                                   # ⚠️ zh-Hant 的模板尚未撰写，取此值会抛错，不回落简体
  showConvergenceHistory: false
  showParamsSnapshot: true

  # 原有两项已删除，理由记在此处，免得日后被当成疏漏补回来：
  #
  # hedgeBelowConfidence —— 被模板自带的 confidenceFloor 取代。
  #   单一全局阈值无法表达「格局判定天然比旺衰判定更不确定」：
  #   geju 取 0.55、strength 取 0.60 是刻意的分档，一个全局值会把它抹平。
  #
  # showGoldSetScore —— 金标准集尚不存在（见 11-validation §4.1）。
  #   为一个不存在的功能留开关，是在参数文件里写谎话。

  guard:
    enforceBannedTerms: true       # [硬约束] 不可关闭
    scanExportBeforeWrite: true
    neutralPalette: true           # [硬约束] 禁止红绿吉凶配色

# ═══════════════════════════════════════════════════════════
# 以下为 P11–P15 的规划参数，尚未实现。
# 完整算法见 docs/12-persona-curves-nodes.md。
# 此处先行登记，是为了让「哪些系数还没进来」一目了然 ——
# 但**不写进 defaults.ts**：参数校验会拒绝未知键，
# 未实现的参数出现在真源里，等于承诺了一个不存在的开关。
# ═══════════════════════════════════════════════════════════
#
# persona:
#   source: conventional           # [流派] 十神特质表底本，可替换
#   neijingSource: conventional    # [流派] 《内经》五行配属表底本，可替换
#   wuqiaoSource: yinyangYingxiang # [流派] 五窍：阴阳应象大论 | 金匮真言论
#   excessShare: 0.35              # [校准] 十神/五行过旺门槛
#   deficientShare: 0.05           # [校准] 过弱门槛
#   dominantMargin: 0.05           # [校准] 前二并列的判据
#   excessBand: 0.30               # [校准] 虚实：相对偏离超此值判「实」
#   deficientBand: 0.30            # [校准] 低于此值判「虚」
#   attackedBand: 0.25             # [校准] 受克流量/自身权重 超此值判「受制」
#   seasonAdjust: 0.15             # [校准] 月令对寒热轴的修正幅度
#   bodyCorrespondence: true       # subject=other 时强制关闭
#
# series:
#   spanYears: 60                  # 统计基准窗
#   drawYears: 120                 # 曲线绘制跨度
#   samplesPerYear: 12             # [硬约束] 月度采样
#   fleetingMonthInWeights: false  # [硬约束] 流月不参与权重
#   agitation:                     # [校准] 扰动系数
#     chong: 1.00
#     sanheSanhui: 0.85
#     liuhe: 0.70
#     xing: 0.60
#     hai: 0.40
#     po: 0.25
#     layerLuck: 1.00
#     layerAnnual: 0.85
#     layerMonth: 0.45
#
# nodes:
#   threshold: 2.0                 # [校准] 主门槛
#   noticeThreshold: 1.5           # [校准] 次级
#   mediumEstimator: robustMAD     # [硬约束] 中节点须用稳健估计
#   interpolateTo: month           # [硬约束] 插值只到月，不到日
#   maxShown: 12
