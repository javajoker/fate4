<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六爻指事 · Six Lines</title>
<meta name="description" content="起一卦，按传统取法读《周易》里「这一卦说的是什么事」。简体、繁體、English。">
<!--
  由 scripts/build-zhishi.mjs 生成，勿手改 liuyao-zhishi.html —— 改 tools/zhishi/ 下的 page.html、main.ts、i18n.ts。
  单文件、无外部资源：断网、直接双击打开都能用。起卦、取辞、措辞检查都是内核的同一份代码。
-->
<style>
  /*
   * 色板沿用站点（packages/web/app/globals.css）：中性色，无红绿吉凶色。
   * 唯一的强调色（石板蓝）只用在两处：在动的格，和这次读的那一格 —— 卦画上看得见读的是哪里。
   */
  :root {
    --bg: #f5f5f2; --surface: #ffffff; --surface-2: #efefeb;
    --line: #dcdcd6; --line-strong: #b9b9b1;
    --ink: #22252a; --ink-2: #565b63; --ink-3: #868c94;
    --accent: #2f4858; --accent-2: #4a6a7e; --accent-soft: #e2e8ec;
    --read: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
      "Songti TC", "Songti SC", "Noto Serif CJK TC", "Noto Serif CJK SC", "Source Han Serif TC", "Source Han Serif SC", serif;
    --sans: -apple-system, "SF Pro Text", "PingFang TC", "PingFang SC", "Hiragino Sans", "Noto Sans CJK TC",
      "Noto Sans CJK SC", "Microsoft JhengHei", "Microsoft YaHei", sans-serif;
    --r: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141618; --surface: #1c1f22; --surface-2: #23272b;
      --line: #30353a; --line-strong: #4a5158;
      --ink: #e7e9eb; --ink-2: #a9b0b7; --ink-3: #7c848c;
      --accent: #a3c2d4; --accent-2: #8aaabd; --accent-soft: #233039;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141618; --surface: #1c1f22; --surface-2: #23272b;
    --line: #30353a; --line-strong: #4a5158;
    --ink: #e7e9eb; --ink-2: #a9b0b7; --ink-3: #7c848c;
    --accent: #a3c2d4; --accent-2: #8aaabd; --accent-soft: #233039;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.7; -webkit-text-size-adjust: 100%; }
  a { color: var(--accent); text-underline-offset: 3px; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ── 顶栏 ── */
  .bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.2) blur(10px); -webkit-backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink);
    font-family: var(--read); font-weight: 600; font-size: 16px; letter-spacing: 0.04em; margin-right: auto; white-space: nowrap; }
  .mark { display: inline-grid; gap: 2.5px; width: 16px; }
  .mark i { display: block; height: 3px; background: var(--ink); border-radius: 1px; }
  .mark i.half { background: linear-gradient(90deg, var(--ink) 42%, transparent 42% 58%, var(--ink) 58%); }
  .nav { display: flex; gap: 16px; }
  .nav a { font-size: 13.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .nav a:hover { color: var(--ink); }
  .lang select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }

  /* ── 版面 ── */
  .wrap { max-width: 720px; margin: 0 auto; padding: 36px 16px 56px; display: flex; flex-direction: column; gap: 34px; }

  .hero h1 { font-family: var(--read); font-weight: 600; font-size: clamp(30px, 7vw, 40px); line-height: 1.2;
    letter-spacing: 0.06em; text-wrap: balance; }
  :lang(en) .hero h1 { letter-spacing: 0; }
  .tagline { margin-top: 10px; font-size: 16px; color: var(--ink-2); text-wrap: pretty; }
  .first { margin-top: 14px; font-size: 13.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── 起卦：三步 ── */
  .steps { display: flex; flex-direction: column; gap: 14px; }
  .step { display: grid; grid-template-columns: 30px 1fr; gap: 14px; align-items: start;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 18px 14px; }
  .step-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--read); font-size: 15px; color: var(--accent); border: 1px solid var(--line-strong); }
  .step-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .step h2 { font-size: 15.5px; font-weight: 600; line-height: 30px; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice { text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s; }
  .choice:hover { border-color: var(--line-strong); }
  .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  .choice-t { font-weight: 600; font-size: 14.5px; }
  .choice-d { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--ink-2); }
  .field-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select#place { font: inherit; font-size: 15px; padding: 8px 10px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; min-width: 9em; }
  .hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.65; }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 3px; align-self: flex-start; }
  .seg button { cursor: pointer; border: none; background: none; padding: 6px 14px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

  /* 铜钱：圆钱方孔。实心为正，空心为反，虚线为未记 */
  .coin-grid { display: flex; flex-direction: column; gap: 2px; }
  .coin-row { display: grid; grid-template-columns: 5.2em auto 60px 1fr; align-items: center; gap: 12px;
    padding: 7px 8px; border-radius: 9px; }
  .coin-row.next { background: var(--surface-2); }
  .ord { font-size: 13px; color: var(--ink-2); line-height: 1.25; }
  .ord small { display: block; font-size: 11px; color: var(--ink-3); }
  .coins { display: inline-flex; gap: 7px; }
  .coin { position: relative; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 11px; font-weight: 600; color: var(--ink-2);
    display: grid; place-items: center; }
  .coin::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1.5px solid currentColor; opacity: .55; }
  .coin span { position: absolute; bottom: -1px; right: -3px; font-size: 10px; line-height: 1; padding: 1px 2px;
    border-radius: 3px; background: var(--surface); color: var(--ink-2); }
  .coin.head { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .coin.head::after { opacity: .9; }
  .coin.tail { background: var(--surface); color: var(--ink-2); }
  .coin.blank { border-style: dashed; color: var(--ink-3); }
  .coin.blank::after { opacity: .25; }
  .coin:disabled { cursor: default; }
  .rowline { display: inline-flex; gap: 8px; align-items: center; }
  .rowline i { display: block; height: 7px; width: 60px; border-radius: 1.5px; background: var(--ink-2); }
  .rowline i.half { width: 26px; }
  .rowline i.pending { background: none; border-top: 1.5px dashed var(--line-strong); height: 0; }
  .mv { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .mv.on { color: var(--accent); font-weight: 600; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { cursor: pointer; font-size: 13px; padding: 6px 13px; border-radius: 999px; background: var(--surface);
    color: var(--ink-2); border: 1px solid var(--line); }
  .chip:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
  .chip:disabled { opacity: 0.45; cursor: default; }
  .count { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }

  .primary { cursor: pointer; width: 100%; padding: 13px; font-size: 16px; font-weight: 600; letter-spacing: 0.04em;
    background: var(--accent); color: var(--bg); border: none; border-radius: 10px; transition: opacity .15s; }
  .primary:hover:not(:disabled) { opacity: .92; }
  .primary:disabled { opacity: 0.4; cursor: default; }

  /* ── 结果 ── */
  #result { display: flex; flex-direction: column; gap: 20px; }
  .sec { font-family: var(--read); font-size: 22px; font-weight: 600; letter-spacing: 0.04em;
    display: flex; align-items: baseline; gap: 12px; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--line); transform: translateY(-6px); }
  .meta { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: -10px; }

  /* 卦画：自上而下排（上爻在上），动画自下而上 —— 与起卦的次序一致 */
  .figure { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vw, 28px);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 12px 18px; }
  .hex { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 10px 4px; border-radius: 10px; }
  .hex.whole { background: var(--accent-soft); outline: 1.5px solid var(--accent); }
  .hex-lines { display: flex; flex-direction: column; gap: 9px; }
  .hl { display: grid; grid-template-columns: 18px clamp(84px, 24vw, 124px) 3.6em; align-items: center; gap: 8px; }
  .hl .mk { font-size: 14px; line-height: 1; color: var(--accent); text-align: center; font-family: var(--read); }
  .hl .bar { display: flex; gap: 14%; height: 11px; }
  .hl .bar i { flex: 1; background: var(--ink); border-radius: 2px; }
  .hl.picked .bar i { background: var(--accent); }
  .hl .tag { font-size: 11.5px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  :lang(en) .hl .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
  .hex figcaption { text-align: center; line-height: 1.35; }
  .hex-role { display: block; font-size: 11.5px; color: var(--ink-3); letter-spacing: .1em; }
  :lang(en) .hex-role { text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; }
  .hex-name { font-family: var(--read); font-size: 17px; font-weight: 600; }
  .hex-badge { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 11px; font-weight: 600; color: var(--surface); background: var(--accent); padding: 2px 9px; border-radius: 999px; }
  .arrow { font-family: var(--read); font-size: 22px; color: var(--ink-3); }
  .nobian { font-size: 13px; color: var(--ink-3); max-width: 9em; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; font-size: 12px; color: var(--ink-3); margin-top: -8px; }
  .legend b { color: var(--accent); font-weight: 600; margin-right: 4px; }

  .rule { font-size: 14px; color: var(--ink-2); padding: 12px 14px; border-left: 3px solid var(--line-strong);
    background: var(--surface-2); border-radius: 0 8px 8px 0; }
  .rule .en { display: block; margin-top: 4px; font-size: 13px; color: var(--ink-3); }

  .reading { display: flex; flex-direction: column; gap: 26px; }
  .para { display: flex; flex-direction: column; gap: 10px; }
  .para-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .role { font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 1px 9px; }
  :lang(en) .role { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; padding: 2px 9px; }
  .src { font-size: 12.5px; color: var(--ink-3); }
  .text { font-family: var(--read); font-size: 17.5px; line-height: 2; text-wrap: pretty; }
  :lang(en) .text { font-size: 17px; line-height: 1.75; }
  .text-en { font-family: var(--read); font-size: 15.5px; line-height: 1.75; color: var(--ink-2);
    padding-left: 14px; border-left: 2px solid var(--line); }
  .src-en { font-size: 12px; color: var(--ink-3); padding-left: 16px; }
  .note { font-size: 12.5px; color: var(--ink-3); }
  .again { align-self: flex-start; font-size: 14px; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px; }

  @keyframes draw { from { opacity: 0; transform: scaleX(0.4); } to { opacity: 1; transform: none; } }
  .animate .hl .bar, .animate .hl .mk, .animate .hl .tag { animation: draw .38s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 70ms); }
  @media (prefers-reduced-motion: reduce) { .animate .hl .bar, .animate .hl .mk, .animate .hl .tag { animation: none; } }

  /* ── 说明：默认折叠 ── */
  .guide-box > summary { cursor: pointer; list-style: none; }
  .guide-box > summary::-webkit-details-marker { display: none; }
  .guide-box > summary::before { content: "▸"; font-size: 15px; color: var(--ink-3); transition: transform .15s; }
  .guide-box[open] > summary::before { transform: rotate(90deg); }
  .guide-box[open] > summary { margin-bottom: 18px; }
  .guide { display: flex; flex-direction: column; gap: 22px; }
  .guide h3 { font-size: 15.5px; font-weight: 600; margin-bottom: 6px; }
  .guide p { color: var(--ink-2); max-width: 64ch; text-wrap: pretty; }
  .guide p + p { margin-top: 8px; }
  .table-wrap { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  th { font-size: 12px; font-weight: 600; color: var(--ink-3); background: var(--surface-2); }
  td:first-child { font-family: var(--read); font-size: 16px; color: var(--accent); width: 5.5em; font-variant-numeric: tabular-nums; }
  .guide .small { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }

  footer { font-size: 12px; line-height: 1.75; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 16px; }

  @media (max-width: 520px) {
    .wrap { padding-top: 26px; gap: 28px; }
    .choices { grid-template-columns: 1fr; }
    .step { grid-template-columns: 26px 1fr; gap: 11px; padding: 15px 14px 15px 12px; }
    .step-n { width: 26px; height: 26px; font-size: 14px; }
    .step h2 { line-height: 26px; }
    .coin-row { grid-template-columns: 4.6em auto 46px 1fr; gap: 9px; padding: 6px 4px; }
    .coin { width: 29px; height: 29px; }
    .rowline i { width: 46px; } .rowline i.half { width: 19px; }
    .nav { gap: 12px; }
    .hl { grid-template-columns: 14px clamp(64px, 20vw, 96px) 3em; gap: 5px; }
    .figure { padding: 20px 6px 16px; }
    .text { font-size: 17px; }
  }
  @media (max-width: 420px) {
    .brand-t { display: none; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#top">
      <span class="mark" aria-hidden="true"><i></i><i class="half"></i><i></i></span>
      <span class="brand-t" data-t="brand"></span>
    </a>
    <nav class="nav">
      <a href="#cast" data-t="navCast"></a>
      <a href="#result" id="navResult" data-t="navResult" hidden></a>
      <a href="#guide" data-t="navGuide"></a>
    </nav>
    <label class="lang">
      <span class="sr" data-t="langLabel"></span>
      <select id="lang">
        <option value="zh-Hans">简体</option>
        <option value="zh-Hant">繁體</option>
        <option value="en">English</option>
        <option value="bi">繁體＋EN</option>
      </select>
    </label>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <h1 data-t="title"></h1>
    <p class="tagline" data-t="tagline"></p>
    <p class="first"><span data-t="firstTime"></span><a href="#guide" data-t="firstTimeLink"></a></p>
  </section>

  <section class="steps" id="cast">
    <div class="step">
      <div class="step-n">1</div>
      <div class="step-body">
        <h2 data-t="step1"></h2>
        <div class="choices" id="how">
          <button type="button" class="choice" data-how="time" aria-pressed="true">
            <span class="choice-t" data-t="howTime"></span>
            <span class="choice-d" data-t="howTimeHint"></span>
          </button>
          <button type="button" class="choice" data-how="coin" aria-pressed="false">
            <span class="choice-t" data-t="howCoin"></span>
            <span class="choice-d" data-t="howCoinHint"></span>
          </button>
        </div>
        <div class="field">
          <label for="place" data-t="placeLabel"></label>
          <div class="field-row">
            <select id="place"></select>
            <span class="hint" data-t="placeHint"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="step" id="coins" hidden>
      <div class="step-n">2</div>
      <div class="step-body">
        <h2 data-t="step2"></h2>
        <div class="seg" id="hand">
          <button type="button" data-hand="1" data-t="handSelf"></button>
          <button type="button" data-hand="0" data-t="handMachine"></button>
        </div>
        <p class="hint" id="helpSelf" data-t="helpSelf"></p>
        <p class="hint" id="helpMachine" data-t="helpMachine" hidden></p>
        <div class="coin-grid" id="coinGrid"></div>
        <div class="tools">
          <button type="button" class="chip" id="tossNext"></button>
          <button type="button" class="chip" id="tossAll" data-t="tossAll"></button>
          <button type="button" class="chip" id="reset" data-t="reset"></button>
          <span class="count" id="coinCount"></span>
        </div>
      </div>
    </div>

    <div class="step">
      <div class="step-n" id="goN">2</div>
      <div class="step-body">
        <button type="button" class="primary" id="go"></button>
      </div>
    </div>
  </section>

  <section id="result" hidden aria-live="polite">
    <h2 class="sec" data-t="resultTitle"></h2>
    <p class="meta" id="meta"></p>
    <div class="figure" id="figure"></div>
    <p class="legend" id="legend"></p>
    <p class="rule" id="rule"></p>
    <div class="reading" id="paras"></div>
    <p class="note" id="withheld" hidden></p>
    <a class="again" href="#cast" data-t="again"></a>
  </section>

  <details class="guide-box" id="guide">
    <summary class="sec"><span data-t="guideTitle"></span></summary>
    <div id="guideBody" class="guide"></div>
  </details>

万物的品质。你会兼收并蓄，无所不包；在这样的状态下，你无需额外整改，因为已经没有解决不了的问题。","当你面对外部竞争对手时，你会胸怀锦绣却不轻易显露，脚踏实地地积蓄力量。只有这样才能保证自己在真正壮大之前不被吞噬；否则一旦过早暴露，你就会被卷入竞争，此时你要把稳脚下，脚踏实地地始终做到有始有终，而不是单纯追求个人成功。","当你脚踏实地、行事中规中矩、滴水不漏时，你不会奢求额外回报，就像一个扎紧的口袋。这样你不会被过多赞誉，但同样也不会招来灾祸。","当你量力而行，专注完成自己分内的事务时，你的谦逊会让你功成不居，却能营造出繁荣局面。你已完全适应环境，并进一步成为环境的基石，得到群众的认同和习惯。这样的状态非常美好。","当你包容万物包容到极致时，你可能会面临失去继续支撑的内部动力。你需要时刻警惕，防止满足现状而停滞不前。","当你像树木发芽一样，需要深扎根基才能茁壮成长时，你就融入了一个完整、自给自足的体系。你领悟到知行合一，使你的内外保持一致、和谐通达。你用这种状态指导自己，反应迅速、洞察明晰，能快速斩断纷乱。你知道什么值得做、什么该放弃，行事端方正直。如果雨水过多而你随波逐流，你反而会像毁坏根基的树木，根烂木枯。因此，你不能盲从大流，而是要先明确目标、有的放矢；如果暂未找到目标，就老老实实地在已有领域耕耘、建功立业。","当你像在坚硬山石上打洞立表柱一样艰难地生发时，你需要找到最正确的位置并提前设定目标，这样才能实现事半功倍。","当你白手起家时，你的发展会时好时坏，就像拉车的马步调不一致，难以顺利前行。开始阶段因为经验不足，你的决策和执行都需要不断调整，此时你还要保持团队团结，不被困难击倒。这样的情况下，你很容易动摇，甚至丧失前进动力，转而寻求外部资源合作。但这样一来，你就把主动权交出去，将来的发展将不再由自己掌控，也许要很长时间才能实现你的规划。","当外部世界的繁华吸引你，而你仍处在初创阶段的艰苦之中时，你就要更清楚地认识自己，量力而为，不要被貌似美好的目标所迷惑。你应该先做自己能够完成的事情，就像没有向导独自进入山林打猎一样：即使你多次差点抓到猎物，却都让它溜走，越深入愈容易迷失。此时，与其深陷歧途，不如放弃这个目标，重新评估自己的方向。","虽然起步阶段充满磕磕绊绊，但你已经成长为可以自给自足的个体。因为你是新的生机，蕴含着无限潜力。这时你可以寻求合作，实现双赢：你与他人各取所需，互补优势。只要你坚持下去，就会收获良好结果。","在起步阶段，你要以积累资源、聚集力量为主。现有的力量足以实现一些小目标，但尚不足以完成大目标；如果你强行去做力不从心的事，结果往往会适得其反，将自己推入危险境地。","当你察觉发展已到瓶颈时，你必须寻求转变，但新的方向太多，令你难以抉择；当意见分歧，就像拉车的马步调不一致，你会在进退之间动摇；最终你可能因为无声痛哭而各奔东西，各自追寻理想。","当你决定去启蒙他人时，你就像草木在光秃的泥土上生长，不是因为草木生发吸引水，而是因为雨水渗入泥土才使草木生长。但水不能过多，否则草木会烂根、田土泥泞。要避免跟风盲从，你要先找到明确目标、有的放矢；若暂时没有目标，就脚踏实地地工作、积累功业。","你让万物蓬勃生长，并把这种繁荣推广出去，这样你才能看到草木茂盛。当你稳住脚跟，就能进一步吸纳同行资源，引导市场进入良性循环。你要以自己的经验为基础，将“刑罚”作为工具来警示和约束那些尚在蒙昧中的人，这样可以事半功倍。真正的目的，是要让他们不要犯错，少走弯路，从而免于受到刑罚和拘留。但是你要牢记，刑罚只是手段，而非最终目的；如果你长期以高压手段压制他们，反而会引发反抗，使局面更加艰难。","在你进行启蒙的过程中，要认识到每个人的素质不同，接受新事物的速度也各异，因此你需要怀着包容之心对待他们。你要明确，包容这些尚在蒙昧的人，是为了让他们学习知识，将来能够帮助你，甚至解放自己，接替你的工作。就像新媳妇出嫁，标志着孩子已经成人，可以成家立业了。","在启蒙的过程中，你必须考察每个人的心性，并优先选择那些信念坚定、有自己主张的人。比如，你绝不能娶那种一见到有钱有势的男人就动摇的人；娶这样的人对你没有任何好处。","你要认识到，大众大多数时候都处于蒙昧之中，缺乏深思熟虑；他们的无知会带来无法预料的后果。无知就是最大的困境。","当你在荒山上见到草木生长、欣欣向荣时，你会看到生机盎然的景象，这预示着下一步的良好发展。","当你彻底消除蒙昧、打破无知时，你就可以考虑下一步的发展计划。你尚未拥有占领新资源或市场的能力，但你已有足够实力守护现有事业，不会有什么灾患。","埋在土里的珍宝总是会发光的，只需要一场大雨冲刷。当水冲洗掉珍宝上所有的污渍时，珍宝就会焕然一新、光彩照人。此刻你的行事秉持正道，你可以放心地走向更广阔的天地，勇敢去闯荡。","当你看到草木欣欣向荣时，你要懂得维持当下的状态并提前做好准备来应对可能的风雨，以便将被动化为主动，将险境化为平安。","当你进行基础建设时，就像沙子如果得到足够的雨水才能变成肥沃的土壤一样。你要善用雨水资源，改造薄弱环节。虽然初期可能看不出明显效果，甚至会受到他人指责，但只要雨水充沛，沙土最终会变成沃田，这就是好事。","在竞争过程中，为自己保留退路是至关重要的。否则，当你像待在泥地里，雨水将泥土化为沼泽时，你就会陷入困境，容易被“吃小鱼的大鱼”吞噬，因为你的软弱就招来了侵犯。","当你经历风雨锤炼，从竞争对手中杀出一条血路时，你会真正摆脱小圈子，全面成长起来。","当你站稳脚跟并持续受益时，你可以放松身心、静待新机，只要你保持内心正直安定，一切都会好起来。","当雨下得越来越大，而你早已做好周全准备回到自己的家中安心避雨，你会看到外面雨水淹没他人，却有人不请自来求你避雨；此时你要热情接待，学习外来者的经验并分享机会；只要你有所得，这就是好事。","在争论时，你要坚持自己的观点，压抑内心恐惧，这样事情才会迎刃而解；但如果你穷追猛打，可能会破坏外部环境，这是不智之举。你应该在争论过程中保留余地，当需要时请能力者帮助你，因为一人孤军奋战往往难成大事。","当你守成有余时，你就必须寻求进一步发展；毕竟“进则无不胜，退则无不败”。若周围环境都在发展，而你原地踏步，就等同于退步。你要争取更多资源，推进事业。发展的过程必然伴随方向之争和资源之战，但你切记不要动武或过度争执，因为最终仍会迎来好结果。","当你与对手争论到最后却无法说服彼此时，就会出现分裂。到那时，你不如离开原来的庞大联盟，去一个小环境验证自己的想法。那里你可以自由发挥，不再受到束缚。","你一旦在前后发展上保持一致、内心正直安定，就会利用竞争对手的压力查漏补缺，最终获得好结果。你可能会寻求靠山，与伙伴一起奋斗，但若总是争吵，也难以取得真正成就。","如果你在争讼中无法获胜，就要回头服从正理，顺其自然、安于正道；退一步仍然宽广，这是明智之选。","当你用辩论让思路越发清晰时，这本身就是好事，说明你的理路正在明朗。","你若为争而斗，易“争火”引发更大纷争；即使你凭借正确立场得到上位者的支持与提升，但争讼本身会造成内部和市场的混乱，破坏和平安定。若为平息民愤而退让，反倒会让你处于不利境地，甚至更加不如。","领军打仗。当你带领军队时，使用老成持重的将领更为稳妥，这样胜算更大，失误更少。","随着你事业发展壮大，对资源的需求也会更高。大家都在争夺资源，就会产生激烈竞争。如果你在竞争时能严格自律，上下齐心，那么就能做到物尽其用、持续发展；否则，若纪律松懈，就可能因内部分裂或资源争夺失败而陷入凶险；过度压榨也会招来群众的反抗。","作为军中统帅，你要坐镇指挥、知人善用，而非凡事亲力亲为；只有这样才能避免灾患，这也与你的定位高度契合。","在同外部竞争时，你必须先评估竞争对手的实力；若不了解对方力量对比就贸然对抗，就会付出巨大代价。就像军队出征但载尸而归，这样的结局极为凶险。","当你决定从竞争转向合作时，你会就地往左方驻扎，占据对方右军的有利防守位置；只要你不轻举妄动，就不会有什么灾患。","在竞争过程中，你要兼顾内外平衡、兼收并蓄；就如同田猎时，当你发现猎物，全队上下齐心协力，你会马上提出并采纳良策，这样就能迅速制服猎物，不会有什么问题。另一方面，在激烈竞争中，应该由有经验、有能力的人主导；若经验不足之辈掌舵，往往代价惨重，这与信念无关，只是个人能力所限，极具凶险。","当你赢得一场战争，你会按功行赏——或裂土封侯，或分封大夫。但如果你只会赏人却不用人，就会打乱内部秩序。","当你保持恒久的坚贞时，就像江河奔腾，礁石被水冲刷，动荡不安；你若因动荡而动摇、随波逐流，最终会陷入更不利的处境。","当你手握充足资源时，要稳固自身、按计划一步步发展，不要随大流；你要相信自己，一步一个脚印，就像给罐子慢慢注满水，最终必能达到目标，这是真正的好运气。","当你自内而外地求同存异、保持自我正直安定时，你就处于极佳状态，这将助你在纷杂环境中保持清醒。","在外部，潜在的竞争对手无处不在；你要明确：稳固自身依靠的是你自己，不能把希望寄托于外部，否则就可能遇到不值得信赖的人。","只要你动机纯正并保持内心正直安定，前路就会明朗，结果必是向好的方向发展。","当你按计划一步步实现目标时，你不会拒绝来者，也不会追逐去者；你宽宏无私，得到群众的认可，他们甚至见到逃去的猎物也不会报警。如此和谐无间，正是你追求的理想局面。","当你的计划达到极致，却突然看不到新的方向时，会引起人心的困惑，这是极其凶险的。你要预见到这一陷阱，提前做好调整。","当环境生成的水汽蒸腾成云，但积蓄尚嫌不足而无法化雨时，你要继续沉淀、积累，直到条件成熟为止。","当你达成一个目标后，需要停下来好好休息、总结与反思，为下一轮突破做准备。你要反思：我在哪里做得不好？哪里犯了错？只有这样，才能不断进步。","不仅你自己要反思，也要引导团队一起反思。你的主动引导会带来积极成果，整个团队会因此更加团结进取。","当你决定休整，但与外部环境发展的需求产生冲突时，你要认识到两者本该相辅相成，却因为立场不同而爆发矛盾，就像夫妻反目。此时你需要果断取舍，否则反而自陷烦恼。","当你已经做了充分总结、明了得失之时，你对过去付出的代价会保持警惕，这能确保你将来不会重蹈覆辙。","如果你做到内外一体，并以诚信之心与同行相互扶持，就会形成一损俱损、一荣俱荣的局面。你要记住：你的财富实际上来自他人的支持与帮助。","当你积累达到“饱和”状态却不再行动时，这不仅无益，反而浪费；就像水位一路上涨却毫无行动，当你过于温馴却不采取对策，多余的雨水终会漫溢；尤其在快到团圆时节，如果此时你离家远行，便是极其危险的选择。","当你放心去执行计划，不再犹豫时，你就会顺利完成任务，无需担心灾害。","当你已有所成就，就可以用剩余的时间做自己真正想做的事情；你无需顾虑，坦然从容地去实践。凭借先前的成果支持，无论发生什么，你都不会遭灾。","因为你已有相当积累，继续简简单单地执行下去时，你的道路会越来越平稳宽阔。此时你要注意保持心态纯正、执着、低调，不被世俗干扰，这就如同“隐士”保持内心正直安定，是你持续安稳的秘诀。","当你谨记初衷，只想简单地把事情做好时，外界竞争者或会虎视眈眈，但你不能强行去做超出自身能力的事情；就像一个严重失明的人只能模糊识物，或一个瘸腿者能行走却始终不稳；若你不小心踩到老虎尾巴，就会自食恶果。以人事为例，就宛如武人拥兵自爱、心怀不轨，最终将面临灭顶之灾。","当你尾随强者而不被察觉时，只要你保持柔顺、小心谨慎，就能够避免伤害并施展抱负。最终，你会在更安全的状态中实现目标。","无论遇到多大的困境，只要你坚决去实践，即便动机纯正，也会受到考验和磨炼，这是你成长的必经之路。","当你简简单单地去执行任务时，你会获得阶段性成果；你会检视所得，并根据经验决定下一步发展，做到一边执行、一边规划，使你的发展像螺旋上升般循序渐进、和谐顺利。","当你投入少许努力却获得巨大成功时，那便是你努力得到的回报，无比欣慰。","当你像创新者初入市场时，资源就像初生的茅草，根系互相牵连。你拔起一根，就能连带拔出许多。此时你要紧抓机会，争取更多资源，以便在市场里站稳脚跟。","在新兴市场里，你要放眼长远，以包容之心去对待那些曾被视为荒废的资源。时间就是最珍贵的财富，所以一旦决定，就要果断执行。你要光明磊落、公正无私，即便取得成就，也别忘了曾经支持你却渐渐疏远的人，要一视同仁、不分亲疏。你的中规中矩作风将赢得众人尊崇。","当越来越多的竞争对手涌入新兴市场时，你曾经走过的平坦大道会变得崎岖难行。回归正常的竞争环境，你要坚守内心正直安定，不因环境变化而动摇。即使环境艰难，只要你保持信念，就不会遭受灾患。只要能获得收益，就安心享受。","当你在新兴市场中如鱼得水般自由翱翔时，你并不一心只为财富，而是为了追寻梦想。财富会自然而然地追随成功而来，你无需刻意追求。正如邻里之间，大家以诚相待，讲究信用，自然会相处和睦。","当你凭借先入优势获得大量资源和收益后，你会渐渐处于市场高位。即便如此，你也要警惕自己，不可骄傲自满。你要明辨大势，提前布局，并与后来者保持良好关系、学习分享。就像皇帝把女儿嫁出示好赐福，这样才会营造和谐氛围。","当更多竞争对手不断进入市场时，你的先入优势会逐步消失，如城墙倒塌于干涸护城河一样，你会回到原点。此刻，你若主动进攻，只会伤敌一千，自损八百。内部恐怕也难以适应后来势力的赶超，许多人会因心理落差而提出种种要求。此时，你虽能保持内心正直安定，但面对来自内外的双重压力，仍会感觉难以招架。","当你为自己营造了良好外部环境，却被人否定时，你要认清：从投入量来看，你付出很多却只收获很少。在这种情况下，你必须重新评估自己应得回报。","当越来越多的人进入新兴市场时，原本零散的“茅草”会迅速繁衍成密不透风的“草海”，根系越发发达，连成一片；若想再拔起它们，就会变得越来越困难。你此时若贪多好高，就会败走麦城，你要认清自身实力，把握自己能掌控的部分，避免一时野心煽动而导致整体失衡。只有这样，这个有序的市场才能保持最优状态，一切才会顺畅。","当你作为后来者时，要先定位自己，以包容之心继承前人留下的资源和经验；适合从小规模起步，逐步拓展，这样才会稳妥。因为各种限制和不畅，你不宜在此时做出过大投入。","当竞争对手异常强大，你难免会受到欺压。此时你要调节心态，以包容之心去面对可能的侮辱，让自己坚定如初。","当市场濒临饱和时，新入者成功与否大多依赖于时机和机遇；你应顺应时机，这样就不会有问题；作为弱势群体，只有精诚团结、捆成一股绳，才能得到福祉，才能有所收获。","当你站稳脚跟后，你会发现没有永远的敌人；当利益面前，对手会停止对你的排挤；对整个市场而言，这是好事。你要放下过去的痛苦与屈辱，甚至将对手转化为朋友，如同桑树一样互相纠缠、共同成长。","当市场的大饼利益分配完毕后，人们即由竞争走向合作；封闭局面不再需要，紧接着就是互通有无、共谋发展，大家皆大欢喜。","当你把人从散乱的状态凝聚到一致行动时，就会出现大好局面。大家齐心协力后，力量倍增，可以去大江大河闯荡，有利于培养协作精神。","当你发现机会并准备实施时，有识之士自然会想参与。在启动前，你要先做好详细计划，明确分工；只有这样，才能避免事与愿违。","当机会变成收益后，你若意图将全部利益瓜分在自己手中，就会导致体制僵化，失去后续发展动力。一旦市场陷入瓶颈，无法突破时，就会变成灾患。","当你发现自己无需直接作战时，可以采用震慑策略，比如在草丛中暗设伏兵，占据高点以便预警；这样对手摸不清你的真实实力，就难以大举进攻，为你赢得宝贵时间。","当你已经强大到足以固守城墙时，对手若想再次进攻，也会因得不偿失而退缩。于是你转而寻求平衡与共同发展；这才是明智之举。","当你与大家团结一致、齐心协力时，虽在求同存异上会付出不同代价，但最终形成的整体力量将极为巨大，能够赢得更多利益。正如先苦后甜，一旦摒弃隔阂，犹如两军同营，所向披靡。","当你的阵容聚集到一定规模、力量积累到一定程度时，就应集合众人一同开拓新领域。你要勇敢迈出那一步，不要留下遗憾。","你要承担起保佑和护佑的责任，形成一个完整闭环的逻辑：内外一致，和谐亨通。","当你与他人分享或共事时，也要默默地支持和庇佑他们。但是在实际操作中，你仍然要保持沟通。如果你沟通不畅，反而会成为妨碍。不管你的出发点是什么，都不能采取不当行为，否则必将招致灾患。遇到困难时，你不要气馁，因为这反而会让大家更加团结，从而避免灾患发生。","当你受到护佑时，就像被安置在大车中运送，货物不会散落损毁；你可以心无旁骛地朝既定方向前进，不必担忧，将无大患。","当你受到护佑时，你就会无往不利。犹如公侯之行，无论行止何地皆能顺畅，因为你得到天子的庇护。然而，对那些小人而言，这种护佑非但无法承受，往往会被其用来行恶，带来更大破坏。","当你深知盛极必衰时，你就会保持低调，继续沉默接受护佑，就像抑制住响亮的鼓声一样。如此，你才能避免招惹祸患。","当你在上下之间以诚信相交时，上位者以诚信待下，下位者也以诚信回报，这种交互双向的信任关系非常美好。","当上下同心、诚信相交时，这样的完美和谐关系会让你清楚地看见共同成就的前景。只要不出意外，你定能大成，甚至得到上天的庇佑，无往不利。","当你保持谦和的心态，你的真诚与勤奋终将为你赢得支持，并使你获得成功。","当你即使取得成就也保持谦逊时，你仍有追求但绝不自满；在外闯荡时持续以这种谦逊态度待人，这总是一个好的选择。","当你身边的人见到你的谦逊，也会自然受到感染和影响，这样你会更加受人尊敬。","当你既谦虚又勤劳时，你必能成就大业；这种心态会带来良好结果。","当你充分发挥谦虚的美德时，你会赢得无数人敬佩，因此一切都将无往不利。","当你不依靠财富，仍能获得邻里帮助时，这说明你的能力和谦逊赢得了信任；若你提出扩张的需求，也会得到广泛支持，因为大家都信任你。这样的局面定会无往不利。","当你将谦逊发展到极致时，你会获得天下人的景仰；然后你以大义之名征讨，他人私有的领地也可纳入囊中，没有人会反对。这将是一片祥和。","当你万事俱备、毋惧外界干扰时，你就可以大胆开辟战场、建功立业。","如果你从未行差踏错，你的成就必定非凡，对任何人来说都如大象般不可动摇；但在达到这一巅峰时，你要警惕自己不能过于得意；就像大象在领地中得意鸣叫，往往会为未来潜藏风险。","当你成为庞然大物时，选择新的发展方向更需谨慎，因为并非所有环境都能承载一个“大象”的基本需求。由于体型庞大，你可能踩塌道路或困于山石；但大象身强力壮，只要你付出时间和精力，就能脱困。你要多方面尝试，保持心中正直安定，最终必有好结果。","当你仔细观察竞争对手的反应时，一旦发现自己出现问题，你要立刻悔改；因为你的体型庞大而反应不够迅速，若你迟迟不改，就真的会后悔莫及。","当你以一个强大的主体进入市场时，你会带来巨大的收益，这是毋庸置疑的。与此同时，你会吸引更多合作伙伴，进一步带动市场繁荣，形成良性循环。","即便你因病需休整，只要你已有雄厚积累，依旧能够逐渐恢复，或者依靠长久支持而不会灭亡。","当你发展到极点、失去前行动力时，你可能会浑浑噩噩、整日沉迷享乐；这就很危险。但如果你因遇到挫折而暂时停步，也不见得是坏事；只要你及时调整，就不会有什么灾患。","当你占据主导位置时，要随时关注外部环境的变化并进行调整。你所处体系自成闭环，你能够做到知行合一、内外一致、和谐通达，你用此指引行为、迅速反应、洞见一切，并果断地斩断纷乱。你知道该做什么、不该做什么，因此行事端方正直。这种状态下，无论外部如何，都不会有什么灾祸缠身。","当你成功创业后，如果想要守住已有事业，就要面对各种依附而来的人。他们可能因私利、贪婪而导致藏污纳垢。正如“水至清则无鱼”，你需要兼收并蓄，同时保持内心正直安定，才能使事业持续向好发展。你要如何兼收并蓄？答案就是走出去，与外界沟通，破除私见，联结大众利益。这样才能使你的事业获得长线支持。","在听取众人意见时，你会发现两种最尖锐的理念冲突：年轻人的激进主义和中老年人的保守主义。你必须有所取舍。在进行内部建设时，你要去粗取精、完善自我。等你做好充分准备后，就要采取激进果敢的手段，迅速处理问题，如同“快刀斩乱麻”，才能一举突破僵局。","当内部建设已经完善、对外一致时，你便可以稳扎稳打，避免因冲动而付出不必要的代价。你要先弄清自己真正想要什么，再在有经验和有能力的人指导下，逐步落实对外策略，才能获得收获，这种方式最利于稳扎稳打。","当你盲目听从他人时，即便你从中获益，也可能在不知不觉中偏离正轨，最终得不偿失。即使你内心正直安定，但如果你在跟随过程中没有明确目标，也没能对方向做岀甄别，就可能被错误路线牵着走。相反，如果你在任何跟随的过程中都始终保持目标导向，借势而行，就不会有什么问题。","当你以真诚信念去追随并相互扶持时，你就会和伙伴一起创造美好的局面。","当你的随和达到极致时，人际关系就会达到巅峰，变得牢不可破。正如你被“绑”在一起，彼此纠缠，内外合一。你这样稳固关系，是因为你付出了真心，正如人们在西山诚心祭祀上天，终将得到天赐福。这种状态，能让你无往不利。","当你像沃土养育世间万物那样建立一个完整的生态系统时，一切都生生不息、和谐亨通。你可以带兄弟们走出去闯荡，增长见识，但你要记得不要破坏生态平衡，否则也会伤害自己。你要有意识地调整外部因素，让环境为你所用。","当你意识到自己的学识有限、家大业大时，就要谦逊地兼听各方意见。在发展过程中，你需要外界帮忙指出你的“蛊惑”与错误。这些人可以是思想锐意革新的年轻人，也可以是经验丰富的长辈。多听他们的建议，必然对你有所裨益。正所谓“忠言逆耳”，虽然听起来刺耳，却往往能成就大事。","就像用企业文化作比，在内部事务处理上，体现的是公司的文化氛围。下属需主动适应企业文化，而不是企业被动迎合下属。无论对错，也不应由下属改变，因为那会削弱你对企业文化的掌控。犹如家庭中，女主内只需以“母亲”身份治家，把家务井井有条，而非依赖其他人来迎合小孩的喜好。","在竞争过程中，你难免会犯错。只有通过实际行动去验证你的决策是否正确，真实地承担相应后果，才能从失败中学到宝贵经验。即便过程中会有些惋惜，但只要你及时“亡羊补牢”，从错误中吸取教训，就不会招致大灾大难。","然而，在合作中，如果你对他人的错误一味包容、不加督促，时间一久，势必积重难返，导致团队陷入被动、难以突破。","当你委任那些备受赞誉的贤能之人时，他们会用自己的经验和智慧帮助你纠正错误，让你避免走弯路。","当错误得到彻底纠正后，如果你不再派这些贤才任何角色，他们可能会选择离开，留下你独自面对前路。此时，你留下的只有过去的成果与美名，或许会被人传颂，甚至神话化，但你也会因此失去珍贵助力。","当你自上而下始终保持监督与考察时，你就建立了一个完整闭环的体系。你做到知行合一、内外一致，使得和谐亨通成为可能。你据此指导自己的行动，反应敏捷、一目了然，能够快速斩断纷乱，知道该做什么、不该做什么，行事端方正直。若下属成长得比你快，而你却仍想牢牢掌握控制，这样就会埋下极大的凶险。","当你以潜移默化的方式去教育和感化他人时，你可以更好地监督和领导。正确的督导方式终会换来明显收获。","同样，在内部建设中，你要及时沟通、加强团结，使团队成为一个坚不可摧的整体。这样，无论面对怎样的挑战，都能无往不利。","当你面临竞争对手时，要坚定立场，从自己的角度采取相应行动。你既不能为了显示谦卑而过度自卑，也不可因为想显得大度而过分慷慨；如果发生了偏差，你要赶快纠正，否则可能会招惹灾难。在争论时必要时请人帮忙，而不是孤身对抗。","在合作过程中，如果你要把督导之权交给最有能力、做得最好的人，就能最大程度避免问题的发生。","当你以智慧之心行使督导权时，你的目的在于教化他人，而非一手包办。掌握督导之能，正是上位者应有的担当。","当你的督导做到极致时，下属都已成长为能独立思考的人，你不必再指指点点，只需以柔顺敦厚的态度旁观。他们自会把事情办好，这就非常棒，不会有什么灾难。基层组织和体制已稳固成熟。","当你把自己打理得干净利落时，你不需主动推销自己。正如俗话所说“酒香不怕巷子深”，自然会有人主动前来寻求你的帮助。你只要保持客观、温和且心存感恩，就能在人们心中建立起信仰，赢得尊敬与仰慕。","当你在寻求机会时，你要高瞻远瞩，不要只看眼前，也不要像孩子般匆忙幼稚地判断形势。对于普通人，这或许不会带来严重后果，但对于肩负重任的你来说，一旦决策不慎，可能会把所有人带入艰难境地。","在内部建设时，你不需要每个下属都清晰了解大局；基层真正重要的是做好自己分内的事。就如“女主内”之于家庭，基层只需专注自身职责，从而使整体运转更顺畅。","当你仔细观察时，你会评估自己与生俱来的优势与劣势。若对手因自身弱势而退却，你应及时跟上，接过机会。","当你注意到行业中各方势力分布时，就能为自己选择合适的阵营并为其尽力，这将助你快速找到立足点。","当你时时反省自己时，你就能不断纠错，避免灾患。","如果你将观察做到极致，通过观察他人经历、经验，就能验证自己的选择并为自己做好预防，绝不会再招致灾患。","当你发现自身的薄弱环节后，要及时补足，使知行合一、内外贯通。若涉及人事问题，若需运用“刑罚”，你就要做到有法可依、果断斩断乱麻。","与他人共事的时候，如果你发现有人拖后腿，你就要及时发生问题并小惩大戒，以起到提醒作用。就好比对轻微违法者只戴脚镣，虽然限制了他们的活动，但不会引发更大灾患。","当你借机壮大自己，就像大口吃肉一样，或许吃相不雅，但只要你能消化和利用这些资源，就无可厚非。","当你进入一个新的资源环境，遇到从未经历的挑战时，可能会一时不适应并遭遇挫折。就像你尝试吃一种腥臊味很重的腊肉，会觉得难以入口。但只要你调整应对方法，慢慢就会习惯，最终不会有什么问题。","当你在艰苦环境中辛苦补给自己时，只要你保持内心正直安定，你就会获得意想不到的收获。就像啃骨头时发现骨髓中夹着一枚金属箭头，意外之喜令人欣喜。","当你补给自己、积聚力量并在条件成熟时正常发挥时，你就会有所收获。只要你保持内心正直安定、接受磨炼，就不会遇到大问题。","然而，如果你补给过度却没有及时消耗，必然会积累无用脂肪，成为负担，好比背负沉重枷锁，遮住耳朵，使你行走不便，接受信息也受阻。这种状况非常危险。","当你在内外协同的基础上适度修饰美化，你的事业会更加亨通。但切记：再多修饰也无法改变事物本质，你只能在小范围内调整，无法担当大任。","当你觉得该展示自己时，就该走出去，让更多人看到你。不要为走出去而走出去，而是要享受外出的过程。就像不必总是乘车，只要你穿上一双舒适的鞋，徒步也能领略沿途风光。你不必刻意压抑自己的成就，要善待自己，让自己感到舒服。","在进行内部建设时，领导者本身的提升同样必不可少。就像整理下巴处的胡须，需要随着嘴巴的开合而动作，这象征你要时刻关注“头面”和“喉舌”的形象与表达。","当你不能过度要求自己时，就要学会保持状态，这样才能有足够精力处理突发事件。只要你保持内心正直安定，就能实现长久发展。","当你保持低调、不事修饰时，却骑着一匹白马，并且把它装扮得五彩斑斓、显得神骏非凡，你就会让人看到：你自身的价值不平凡。你要注重实用而非“面子”。好钢要用在刀刃上；与他人竞争难免有摩擦，但你应寻求合作，如同婚嫁一般，方不至于落得惨败。","当你不能过分追求外在光鲜，而应将精力更多地放在实事上时，就像你用极少绢帛装点林园，示意已经到位；而真正需要关注的，是林园本身。虽然看似小气，但你省下的财富却能用来办更重要的事情，这才是正确之举。","当你的气质与素养因长期培养而潜移默化地提升到一定高度时，你就无需任何外部修饰，举手投足间自有风采。只要你保持这种状态，不论外部如何，也不必担心灾患。","当你不随波逐流、明确自己的目的时，你才能在各种诱惑中保持清醒，不被动摇。","当你知道万物盛极必衰时，你会意识到根基的重要性，并持续维护内心的正直安定。就像你发现床脚正在剥离时，若不及时采取行动，床就会最终塌陷，带来灾祸。","当你发现中层开始出现问题、能力不足以支撑发展规划时，你必须及时关注并进行调整。正如床板的剥离，若不马上修补，床就无法继续使用。","当你身处环境对你发展的条件日益不利时，你就要果断脱离，而不能患得患失；这样才能避免灾患。","当整个环境已不再适合你生存发展时，就像床面已经掉块，你再怎么努力都无法继续使用。此时你若仍死守，则为时已晚，处境凶险。","当你发现环境不适合你时，你需要制定目标并制定分阶段计划，自下而上地逐步改善环境，这样才能做到无往不利。","当你已经腐化到极点，看到剩下的只有自己还在坚持但却被同化感压力时，你要果断收马，回到原点重新开始。否则，你就只能坐等资源耗尽，最终束手无策。","当你处于自己的主场时，只要你能来去自如、如鱼得水，就会吸引更多合作伙伴前来与你并肩作战，你就不会遭受灾患。大家一起把分工做好，形成循环往复的良性机制。","当你重返发展轨道时，要在统一的环境里多方面尝试，但对于尚不了解的事物，你不要走太远，要及时回来总结经验。哪怕走错也无妨，只要及时修正，一切都会好起来。多方面尝试能开阔眼界，让思路更全面，这是好事。","当你满载而归时，整个团队都会因你的回归而获得提升，这是件值得庆贺的好事！","当你与竞争对手的交锋频繁进行，并在过程中不断尝试与修正错误，最终会让你不断回归正道、磨砺自己，这样就不会招来灾患。","当你坚持走自己的道路时，一旦发现前路错误，就及时独行返回。尽管你无法确定后路是否有利，但你展现出了一种坚定的信念。","当你勇于尝试，即便失败，你也会收获大量经验；至少年轻时尝过试，就不会为“未尝试”而后悔。","当你的前路陷入极度迷茫时，你可能会发现自己既无法前行，也无法后退；在这样的情形下，你若仍执意前行，很容易遭遇重大失败，甚至一败涂地；想象如果一个上位者一意孤行，其结局也往往是覆亡，伤筋动骨，需要多年时间才能恢复，这种后果十分危险。","当你谨守自身原则、行事有理有据时，你就不必随意行动；你要做到知行合一，使内心与行动保持一致、和谐通达；这样的你反应敏捷、一切都变得一目了然，能快速斩断纷乱，明辨何为可为、何为不可为，行事端方正直。如果你心中有偏见，这就像眼里长了东西，一叶障目，无法看到全局；因此你要放下偏见，听从正确的指导。","当你进行任何尝试前，都要深思熟虑、周密计划，而非“无脑”行事；只有这样，你才会获得良好的收获。","当你不要对结果抱过高期待时，要脚踏实地地去实践；就像不耕地就不会有收获，不开垦土地就不会有斗量粮食；与其空想，不如现在就开始行动。","即便你一直行事中规中矩，也可能无缘无故招来灾患；就像有人把牛拴在路边，有人经过就将牛牵走，村民因此被连累要求赔偿；在这种情况下，村民就会遭到无妄之灾。","当你与外部合作时，只要你坚守正道，就不会有什么灾患。","当你行得正、坐得稳时，遇到意外灾害也不必惊慌。就像你莫名其妙病倒时，不要胡乱用药，要让身体自然恢复，这样就能渡过难关。","当你对任何机会都过分谨慎、以致无法及时把握时，就会显得迂腐；一旦你行动时无法精准把握时机，也会徒增障碍。例如你在蒙蔽状态下行动，很可能无所收获，最终得不偿失。","当你处于持续积累的过程中，你的反应会十分敏捷，一切会一目了然。你能够迅速斩断纷乱，明辨可为与不可为，并行事端方正直。你不依赖家庭，而是通过外部条件来丰富自己；如果时机成熟，你就可以“出山”一展拳脚。","当你探明方向后开始投入时，首先要经历一个不见成效的积累阶段，这段时间是你的“磨砺期”。你需要承受压力，不要急于扩展，而应先停下来补充自身实力。","当你停下发展脚步、巩固自身时，就算遭遇突发风浪也能经受住，就像在静止状态下大车车厢脱离车轴那一刻，由于不是在高速运动中，这一突发事故也不会造成重大损害。","当你逐渐积累资源时，也要培养驾驭资源的能力；就像驾驭奔驰的马车一般，速度越快，驾驭就越难。你需要在艰苦环境中保持内心正直安定，并且训练车夫和卫兵，这样当关键时刻来临时，大家都做好准备，行动才会更顺畅。","在合作中，当你需要对他人加以约束，就像驯化小牛时在牛角上绑一根横木一样；经过驯化后，小牛便会顺从地为你所用，这正是你要追求的局面。","当你阉割野猪后，它的獠牙退化、失去攻击性，随即长脂肪，转变为你积累的力量；此时退化的獠牙不再伤人，你就可以把它纳入麾下，这种兼收并蓄的做法是非常明智的。","当资源积累到极限时，就如水满即溢，积蓄的势能会直接冲破困境而爆发；与其让这股势能无处输导，不如为其开辟通路，让其送到更广阔天地，这样你就会亨通顺利。","当你在保养团队和支持他人时，你的行动会高度敏捷，能够快速看清形势并果断处置；你能迅速斩断纷乱，明辨可为与不可为，行事端方正直。你时刻以他人下巴的保养状态作为参考，但你自己的养护依然要靠自己。","当你拥有足够资源时，你就要先让自己消化这些资源。因为每个人的情况不同，保养的方法、效果与时机也各异；你要在了解自己的情况下，结合思考来设计最适合自己的保养方案。别人能吃的，并不代表你也能照搬；倘若你盲目仿效，投入大量却一无所获，必将陷入危险。","你要建立一套自下而上的金字塔式结构，这才是真正稳固自身发展的方式。你绝不能弄错保养的先后顺序，否则就会违背常理；若基层无力而形成倒金字塔式结构，就会导致涩阻不前；此时你要重新调整结构，暂时不要再盲目扩张，否则将面临严重凶险。","当竞争无处不在，持续发生时，你会发现很难维持“保养之道”；因为环境艰难，即便你能保持内心正直安定，也可能招致意料之外的危险；竞争的本质在于长期投入过程，让主体很难得到足够的滋养，从而削弱整体发展潜力。","当你主动提出让大众、群众提供支持与供养，以维持整个市场的发展时，这是可取的。只要你保持威严与睿智、恪守原则，就不会有问题。因为所取之于民，就应当用之于民。","当现实状况是你只能保养自己、无法顾及群众时，这便违背了自然法则。你无法因心急而强行索取，当下你唯一能做的是稳固自身，安身立命，保持内心正直安定，待自己能力足够后，再逐步实现更庞大的目标。此时，你不能急躁，否则会陷入危机。","当供养达到极限时，全天下群雄都倚赖你的供养而得以安居乐业，这对你来说既是压力，也是磨砺。尽管如此，被供养者是获益者；只要你保持内心正直安定，这将为你带来良机，有利于借势前行、开拓新局。","当你感觉压力实在过大，就好比栋梁被压弯时，你必须与团队同心协力，共同化解危机；否则你将因单打独斗而被压垮。","当你发现仅靠计划已无法应对突发变数时，你需要准备充足资源作底气，这样才能随时应对竞争压力与突发事件，降低失误风险。","当你获得充足资源注入时，你就会焕发新的生机；就像枯萎的杨柳重新抽出嫩芽。因为压力让你保持低调谨慎，你更懂得团队协作，所做之事必将得到良好效果。正如老翁迎娶妙龄新妇，所结之缘虽违俗念，但若讲求心灵契合，终将有福。","当外部压力骤增、超出自身能力时，就像房屋栋梁被压弯，此刻处境极度危险。若不及时自省、调整，将难逃一劫。","当你具备栋梁之材却因能力有限，就像一根向上弯曲的横梁，虽然还可支撑房子，却无法抵御横向压力。虽保有基础功能，但只要外力稍大，就会“断裂”。","当你能力不足时，你更应脚踏实地锻炼自己；否则，即使拥有充分资源，你也难以持久保持成就。就像一棵残花骤开，看似美丽却不长久；若在盖房时选用这样的梁，房屋终难稳固。正如弱女子娶强夫，此事虽有缘分，但根本矛盾仍在，不会被外界赞誉。最关键的，是你需保持自身与环境的相互认可。","当压力远超你的承受极限时，就像强行涉水却能力不足，终被水淹没，这是极度危险的处境。但知难而上却仍无可厚非，至少你无惧挑战，这一点可以理解。","当你陷入重重陷阱却又显露出水性崇高时，你就如水一般既能容纳万物，又能随心而动。你要保持本心，坚持立场。水行自上而下，虽看似随性，但却有迹可循。这种柔韧而有力量的特质，会让你无往不利。","在任何时候，你总会遇到困难，但遇到困难时，你应保持冷静，谨慎分析当下环境，一步步克服障碍。千万不要盲目蛮干，否则你可能会越陷越深，甚至招致无法挽回的灾难。","当你面对危险的陷阱时，要先正好心态。任何小小的收获都应被你视为胜利。哪怕是微不足道的胜利，也能为你积累信心，带来进步。","当环境恶劣得像深陷陷坑之中，危机四伏时，你要尽量保持静止，避免轻举妄动。稍有不慎，便会被困得更深。","当你陷入重重困难，无法顾及礼仪与外表时，你要与伙伴同舟共济，不必拘泥形式。想象这样一幕：几个关键人物被困于一处，只有一壶酒、两篮吃食，他们只能用普通瓦罐分着吃。若有人要喝，只需喊一声，酒食便会从窗口递来。在困境面前，你们同舟共济，携手度过，便可避免灾祸。","当你决意“移山填海”去填满陷坑时，有时小丘尚未推平，你已挥铲而去；无论如何，此行动是你自救的一次尝试，只要能保护自身，不会有什么大问题。","当你困境重重，却仍能到达“巅峰”时，就像你被牢牢缚在荆棘丛中，动弹不得。如果你在此状态足足三年都无法逃脱，那将极其凶险。","当你陷入重重困境，又想靠外部力量脱身时，你要行事果断，坚持正道，使自己内外一致、和谐通达；同时保持心中柔顺、勤勉坚持，就像一头母牛一般，不断积蓄力气才能等待良机。时刻保持警醒，既是自保之选，也会带来意外收获。","你要记住“失败是成功之母”，从众多先例中汲取灵感，不论结果如何，都要秉持敬意、虚心分析。你越尊重历史案例，就越少犯同样错误，越能走向成功之路。","当你坐镇中央之地、内外一致时，就会营造一派和谐景象，整个局面皆大欢喜。","当你的内外环境泾渭分明时，你就能把握机会，发现美好。如同面对夕阳，你可以乐观地吟唱“夕阳无限好”；但若沉浸在“风烛残年、自怨自艾”的悲鸣之中，那种心态必将带来越来越多的凶险。你的乐观会指引你走向光明，而悲观只会让你陷入泥沼。","当你始终坚决地坚持自我时，一旦遇到矛盾，就可能发生冲突，甚至破坏整个环境。就像突如其来的一场大火，来势凶猛、难以预测。你会惊慌失措、心急如焚，却往往无能为力；一旦失控，你就会陷入毁灭性打击。","当局面分崩离析时，你会流下伤心泪水，忧伤叹息。但既然事已至此，你就要接受现实、吸取教训，因为这也是“破而后立”的契机。从这个角度看，尽管过程痛苦，但却是成长必经之路。","当合作彻底破裂时，为避免自己成为竞争对手，你就会主动出手攻占对方，废除其决策者，将对方的优质资源纳入麾下。此举虽决绝，却也能杜绝日后更大灾患，让你长久安宁。","当你与他人一拍即合，配合密切，就好比你娶媳妇一般。你内外一致、亨通无阻，行事果断且始终保持正道，这样你才能事半功倍，达到双赢。","当你踏入未知领域时，你既要实践，也要小心谨慎。很多问题未必能用眼前的经验预知，就像你在渡溪时要先用脚趾试探湖底，方可决定是跨步还是后撤。只要你循序渐进，细心应对，就能安全抵达对岸。","当你感觉就像小腿突然被刺激一样焦躁不安时，无论你如何急躁，都只是在浪费力气。你应打好基础，保持安静积蓄能量。这样一来，当面对未知环境时，即便条件不足，你也不会盲目出击，以免造成无法预料的后果。","当你的“大腿”接收到刺激，一摆动就带动你行动时，你要保持克制，不能盲目跟随他人。你要根据外部环境随机应变，朝最适合自己的方向稳步前进，才能避免陷入危境。","当你感应形势而行动时，只要你内心正直安定，就会无往不利，即便身处困境，也不会让他人的悲观情绪左右你。但若你陷入迷茫，行动摇摆不定，就会拖累合作伙伴，让大家也陷入悲观。这正是你需要警惕之处。","当你始终把群众的利益放在心上，为群众付出而不求回报时，你就会赢得他们的信任与支持。然而，沟通并不总是双向的；你若不主动倾听群众心声，就无法顺畅交流，最终可能只能单方面付出而得不到回应。","当你的“感应”达到极致时，你会倾向于通过心灵感应去处理本应口头表达的事情，把简单问题复杂化；这并不利于团队合作，且会让沟通变得曲折。","当一种做事方式既能让你久享福、也无任何灾患时，你就能够带领大家协同工作，共同进步。","当你的措施已经带来了持续收益时，你需要关注“度”的把握。要与周围反应保持同步，不能一味索取，否则即使策略正确，也会破坏环境平衡，无法获得长久收益。","当你坚持走自己的道路时，只要你不动摇，就不会后悔。","当你在做事时需要持之以恒，而不是三天打鱼、两天晒网。即使你心中保持正直安定，但若因畏惧失败而过分保守，你的事业也会陷入停滞窘境。唯有坚持到底，才能见到丰收果实。","当你无休止地对同一片田地进行狩猎而不顾伤害可持续发展时，你终将打光田里的所有猎物，导致资源枯竭。你需要适当休整或另觅新市场，才能避免彻底走向衰败。","当你坚持并持之以恒时，你便践行了一种从头到尾、一以贯之的原则。对于女性，这是持家之道；而对于男性来说，你要在保持正直安定的基础上，结合瞬息万变的环境，灵活修正行动方针；在完成一个目标后，要向更高层次、更广阔领域进发；若偏安于现状，迟早会耗尽资源，走向凶险。","当你追求恒久而不变时，一旦达到极致，就会发现世界没有永恒不变的事物。维持恒定需要付出越来越大的代价，终将超出你的能力。到最后，你只能依靠外部救济才能苟延残喘，这将是极大的危险。","当你的能力已不足以维持现状时，你就要暂时隐退，以免无谓消耗。只要你能保持内外亨通，不要犹豫不决，坚守内心正直安定，就能在困境中保全实力。","当你面对“无所谓”的竞争时，你可以选择暂避锋芒，不必硬拼。要果断做出决定；若对手都离去而你还滞留，可能会成为众矢之的。因此，退避时也要有长远规划。","当你退避时，要确保自身的资源和团队保持稳定，就像用黄牛皮裹住骨头，使它们无法轻易脱离；这能让你在关键时刻保持团结。","当你选择退避却已投入大量资源时，你会很难放下，并因此难以前行，就像被疾病缠身般痛苦不堪。此时你要尽快放下所执，不断提升自己；例如可以开始畜养仆人、侍妾等，为下一步反击做准备。","当你在合适的时机采取恰当的退避策略时，你能退而不乱，保持内心正直安定，并最大限度保全实力，不错过锤炼自我的机会。但对于那些退而不甘、墨守陈规偏安一隅的人，退避可能会使他们走向沉沦，这就不理想。","当你主动退避并保留实力时，你的价值与信念才能不被浪费。只要你保持内心正直安定，这就是值得赞许的选择。","当你退避到最高境界时，你会审时度势，在最合适时机主动隐退；你能带走大量财富，这样无往不利。","当你适时“急流勇退”时，你就能在新的环境中借势增益、自身成长。你会行事果断、内心坚定，这就是最佳时机，能使你更上一层楼。","当你主动出击时，要确保全员统一步调、各方都跟上。若你误以为自己脚力快而单枪匹马冲锋，必将陷入孤军奋战的危险境地，这一点你务必牢牢记住。","当你不断增强自身、保持内心正直安定，就会一切顺利，这才是成功之道。","在竞争环境下，你不能恃强好胜地硬拼，而应顶住压力、灵活迂回，逐步削弱对手；就像用撒网捕猎一样，你要保持心中坚定，借助压力磨砺自己；就像公羊用羊角撞破篱笆，你则用层层障碍制约对手，让对方不得不被动应对。","当你的力量积聚到极致，先前的付出就迎来收获，你曾经的悔恨纷纷随之消逝；你可以一鼓作气、一战而胜，就像壮羊将篱笆撞散，将羊角脱牢；通过磨砺之后，你变得足够强壮，事业得以稳健向前；就像大车与车轮的连接处是磨损最厉害的部位，只要这一环节足够坚固，整辆车就能载重远行。","当“羊儿冲出篱笆”后，不知所踪时，你不必后悔。因为这意味着你当前所构筑的篱笆无法再禁锢更强壮的对手。既然已发生，就当作教训，借此提升自己，将来的“篱笆”就会足够牢固；这就是“亡羊补牢”的智慧。","在竞争中，当你持续增强自身并达到极致时，终有一天你会脱出樊笼，就像那头强壮的公羊经过坚持与磨炼，终于摆脱篱笆的束缚。这种突破本身对于你而言，是一件值得庆贺的好事。","当你善用良种好马进行配种，就会不断提高整个马群的素质。每天都会有优秀品种小马出生，这将为你带来源源不断的竞争力。","当机会来临时，你要抓紧时机加快发展步伐。你要向前冲啊！但在冲刺的过程中，切记时刻牢记你心中所求，保持内心正直安定，这样你就会收获丰厚果实。即使外界对你的激进产生质疑，但只要结果足够丰厚，质疑声就会被你的成就化解。","在激进发展的过程中，你难免会担忧，害怕后劲不足无法持续下去。此时，你要保持坚定的内心，结果就会证明你的选择无误。当你在快速扩张中仍保持正道时，为人处事的高层都会看到你的诚意，并愿意为你提供大量支持。","当你努力进取、对谁都讲究诚信时，你终会赢得竞争对手的尊重，从而不再对从前的失败感到悔恨。","然而，当激进过度、后劲开始枯竭时，尽管你内心依旧坚定，但也会陷入艰苦境地，你要格外注意不要因急于求成而耗尽所有能量。","当你高速发展时，不可能事事俱全。即便一路没有走弯路，你依旧会取得成就；这时你要不计较过去的得失，勇于向前看、顺势而逝，一切都会无往不利。","当你的快速发展走到极点时，你就像站上了动物角尖的位置，没有半点回旋余地。此时，内部的不稳和资源分配矛盾便会暴露，你不得不集中精力来解决内部纷争；就像你得面对自己子民叛乱、需要出兵征伐，虽然危险重重，但只要你保持内心正直安定，最终会化险为夷。这是一次从内部涌现的问题，需要你注意不要因此前的激进让团队陷入艰难。","当你需要注意过度消耗资源时，你会发现自己往往行事果断，但一直保持正道却会非常吃力。","过分激进会造成不必要的损失。就像鸟儿飞得又高又远，却因过度疲劳最终无法再次振翅；又如你外出旅行时急于赶路，三天不吃饭，导致身体受损。此时，你应停下来补充能量，否则当你到达目的地时，反而成为别人的笑柄。","当你发展过快、身体支撑不住时，就像长途跋涉后肌肉拉伤一般，你就要学会提拔一批可靠干员，让他们分担工作，这样你才能继续前行，成就更大事业。","当你通过投入大量资源参与竞争，将战场推进到资源充足之地时，最终可能俘获对手的首领，改变战局。若以南方火焰战区为例，只要你足够壮大，就会像南部沙场一样火力全开。只是你要注意不要操之过急，始终保持内心正直安定。","当你保持心中正直安定时，站在普通人的角度去理解他们对事物的看法，你就能清楚发现过度消耗带来的伤害。于是你会放弃过度消耗的策略，及时离场，避免更大损失。","当你像箕子舍身伤己一般，为了让自己坚定内心，你甘愿承担暂时的痛苦，只要这能帮助你保持正直安定，这种做法就是对的。","当你发光发热到极致时，你的破坏力也到达极限，最终会像太阳一样自行陨落，留下一片黑暗。就像太阳初升时照耀天地，但最终也难免坠入黄土。你要警惕过度消耗自己的能量，避免自取灭亡。","当你能够快速反应、果断行事，但始终保持内心柔弱以维护正道时，这样的反应速度会让你在复杂环境中游刃有余，不会因为一时冲动而迷失方向。","当你在外奔波寻求发展时，一定要防范“后院失火”——家庭或团队内部出现问题。无论你打算做什么，都要得到家人或团队成员的支持，这样无论结果如何，你都不会后悔。因为“家”永远是你最后的堡垒。","对于家人来说，他们并不需要你去闯荡远方，只要你安守本分、照顾好家人日常起居即可。这样的状态足以带来幸福与安宁。","当你治家过于严苛时，家人可能怨言丛生，虽然短期内会产生摩擦，但从长远来看，这种严格管教有利于家人健康成长。相反，如果你纵容孩子、妻妾，使其随心所欲，往往最终会导致家庭失控，结果也并不美好。","当你继续稳扎稳打、锐意进取时，你会收获丰硕成果，并改善家中环境，让家人过上更好生活。这是一件值得庆贺的好事。","当你以“天下为家”的胸怀去治理国家时，人民会因你公平廉明而安居乐业，你无需担心社会动荡。这样的治理方式就是最理想的状态。","当你在治家中秉持“像一个家长一样”的方式时，要以诚实守信、树立威信为根本；这样你所管理的家庭定会和睦向上，一切都会好起来。","当你处事时能够求同存异，就会带来更优结果。你要学会去芜存精，留下一切对你有益的元素；如果杂质过多，反而会让你得不偿失。","当遇到与自己相悖之物时，要先进行区分、去粗取精；与此同时，也要容纳那些与你异见的人，不要因一时不喜欢就排斥他们。正如马匹丢失时，不必急于去追，因为“老马识途”，它终会自行归来。你要以开放心态对待不同人，方能真正包容。","当你决定另起炉灶、一人逐梦时，你要保持求同存异的心态。即便与你原来的老板成为竞争对手，也不会有什么大问题。你要在新的舞台上凭借自身实力说话。","当你另起炉灶初期举步维艰时，就像一个出狱囚犯一开始只找到拉车的差事却根本不会拉车，总是走不顺路；此时你要做出决定：要么坚持信念、继续努力，就会看到成果；要么及时放弃并另寻机会，也可能获得新的转机。无论选择哪条道路，都要有所行动。","当你另起炉灶却被孤立时，你要及时寻找可以依靠的能人、建立互信，这样即使有再多困难，你们也能相互扶持，共渡难关，避免遭遇灾难。","当你另起炉灶并取得成就后，你便会被行业所接纳；过去的悔恨也会随之消失。若整个行业都从你的模式中获益，加入其中也是顺理成章，不会有人阻拦。","当你变得刚愎自用、对立严重时，你会被彻底孤立，就像一头陷在泥淖中的猪，若想爬出，也满身泥垢；你看到一队陌生人时，可能会拉弓准备抵抗，后却迟疑而放下弓。你不该继续这种无谓的较劲，而要主动寻求合作，化敌为友；当你果断下定决心后，寻找并消除自身的缺陷，就如同雨水洗净猪身泥垢一般。这样才能恢复并赢得尊重。","当你陷入极度对立、孤军奋战时，你的前进之路艰难如履薄冰，宛若陷入沼泽；此时你要尽快寻人协助，用山石填平沼泽、平衡过剩的水体，而不是坐等沼泽扩散，否则越陷越深。若此刻能找到有能力之人帮忙，你就能脱困。","当你在前行途中遇到难以逾越的障碍时，你要施展应对办法，一步步把困难克服，最终达到终点。尽管过程艰苦，但当你满载而归之时，将会赢得巨大的赞誉，这就是真正的“载誉而归”。","当上位者遇到困难时，真正战胜困难的是他的手下。要认识到，许多努力与成功，往往来自手下的付出，而非个人功劳。","在激烈竞争的过程中，你所积累的经验会成为实战利器。起初开辟新路充满阻碍，但当道路通畅之后，你再返回则轻车熟路，效率倍增。","世界上最美丽壮观的风景往往隐藏在遥远崎岖之地。你前行路上的艰辛，正是为了到达那片秘境，才能收获更丰厚成果，让你“车载斗量”；同时，它也会吸引更多伙伴与之合作，带来更大机遇。","当你在发展过程中遇到巨大的困难时，你的合作伙伴不会离你而去，他们会与你并肩作战，共同度过难关。","当你在困顿旅途终于抵达终点时，你将收获巨大的成果。这时正当各方齐聚，你应大方展示成果，让有眼光的上位者与世人共同见证你的辉煌。","在水流中需要山石作为河堤，才能引导水流循环；若无出路，水就会在湖泊中来回循环，形成闭塞系统；若有出路，水则会化作溪流、江河，奔流不止。你要在资源运转中找到适合自己的去路，否则就会停滞不前。","当你顺应自然规律做事时，很多问题都会水到渠成，自然而然迎刃而解，从而避免灾患。","当你付出努力并获得回报，有时还能收获意外惊喜时，就像你在围猎时精准射中狐狸，结果发现它身上还有金属箭头，是从别处逃脱的战利品。你要心怀警惕，不可因为意外收获而得意忘形，也不可贪心。保持内心正直安定，这是你必然获得好结果的关键。","当你像背负沉重负担的打工者却坐上了大车时，如果你的能力不足以驾驭所获资源，那么肯定会招来凶悍竞争者的觊觎。即便你保持内心正直安定，也难免会因此遭受灾难。","当你顺风顺水时，自然会吸引投机者依附；在这个过程中，你要警惕基层隐患。正所谓“千里之堤，毁于蚁穴”，你要及时分辨良莠、去芜存精。同样，在选择合作伙伴时，也要遵循这一原则。","当你对他人进行筛选、去粗取精之后，你可以进一步影响其中的害群之马，让他们学习诚信，将他们的力量纳入麾下，让他们成为你的一部分。如此一来，你的事业才能百尺竿头、更进一步。","当你顺势而为到达发展顶点时，就会发现借势之道的妙处。正如智者射鹰，他会先登上高墙，以此带来更多力量，一箭即可命中目标。你若学会借势，就能无往不利。","当你的“金属”体质或核心力量因种种“锈蚀”而受损时，你要坚守信仰、抵抗外界腐蚀。尽管过程艰难，你只要坚持下去，就不会遭遇什么大灾难。你要牢记：将自己比作鼎身，需要借助环境才能发挥作用；只要你心怀信念，借势而行，总会迎来有益的成果。","当你面临紧急事务时，你应该先放下手头的事情去处理紧急情况。但你也要兼顾手中重要工作，根据自身能力适度减免，而非完全放弃。无论如何，最重要的工作必须优先完成。","当你意识到更重要、更有助于整体发展的事情出现时，你要暂停手头的工作并优先处理这件事；这样做不仅不会损害你，反而能更好地推动大局。优先保证重要事项完成后，再酌情处理“紧急但不重要”的任务。","在合作初期，仅靠一个人决策难免会武断，直到碰得头破血流才知道错误所在；若两个人合作，就能相互启发，共同进步，遇到分歧还能协商解决；若三个人合作，分歧往往导致拉帮结派，最终一人被孤立，甚至两败俱伤。因此，你要谨慎选择决策方式，避免因人数众多而导致效率低下。","当你帮助他人发现问题并帮助他们解决问题时，你不仅让伙伴迅速高兴起来，也在过程中积累了自己的宝贵经验，并赢得了真正的友谊。只要你坚持助人，自己的事业也会因积累而壮大，绝不会有什么灾患。","当你已经有所成就时，要常怀感恩，为那些曾经帮助过你的人送上贵重的礼物。这样，你与他们的关系会更加牢固，因为“礼尚往来”是一种维系和谐氛围的好方法。","当你为了大势需要舍弃个人利益、开始回馈社会时，你要始终保证不损害群众利益，而是通过自己的力量让他们获得实际收益；这样你就不会招致任何灾患。只要你保持内心正直安定，长期来看，全天下人都会归顺于你。此时，国家就像一个大家庭，你做的任何事都将迎来良好结果。","当大势已成、你获得回馈时，正是收获时节。你可以趁此机会出去闯荡，锻炼自己——“读万卷书，不如行万里路”。要敢于从小河溪流迈向大江大河，才能获得更宝贵的经验和格局。","当你用这次机会把事情做大、做强时，就是完善而完备的好事，绝不会有祸患。你要大胆向前，让自己在业内外都崭露头角。","当你秉持“礼尚往来、不求回报”的信念时，你只要时不时送上贵重礼品，就能保持与他人的关系紧密无缝。你要常怀善念，以礼相待，就像君主向上天献祭，上天赐予福祉，一派和谐景象，这就是最好的状态。","当你在实战中与竞争对手交锋时，要让下属和伙伴从实践中获益。你要保持诚信，以事实为依据，不偏不倚。遇到问题时，要请教参谋智者，用足够的尊重换取最好建议，这样才能从中受益、不断进步。","当你请参谋智者为你指点时，你的行事就会不偏不倚、不再迷途。你会因为他们的指正而快速成长，这也会吸引更多合作伙伴。就如国家昌盛时，会吸引各地俊杰来投，促进整体繁荣。","当你怀着一颗仁慈之心，真诚地为天下人谋福祉时，无论你做什么，都不需要过多担忧。因你的虔诚与仁爱，人们自然会以同样的虔诚之心来回应。你只要心怀善念，最终必能见证良好回报。","当你追求利益到极致，却忽视增益伙伴、双赢原则，有时还会为了满足个人利益而巧取豪夺时，你便舍弃了初衷中的自我提升与合理发展，这会引发极其凶险的后果。你要警惕这种走偏的行为，保持初心和正道。","当你清晰地公布“现状已无法满足需求”时，你要告诉自己不能再妥协，否则就要马上采取行动。对于那些只在乎利益而不顾长远的人，你要果断离开，不要被他人拖累。","当你发现现有条件已无法满足你的发展、甚至开始阻碍你时，你就要果断离开。倘若你的前行速度已超过大多数人，可以优先出发；但这是基于你能清醒地评估自己能力前提下。若你实际能力不足，勉强前行那就会败在半途，错失终点。","在战略层面上，你可蔑视对手，但在战术层面上却须重视对手。你行事虽可刚勇果断，但思想却不能轻视他人，要时时警惕对手在你麻痹时偷袭。就像打仗时要防备敌人夜间偷营一样，一旦准备充分，自然就无所畏惧。","当你爱憎分明、心中决然并显露在脸上时，你会显得容易被暗算或遭到深仇大恨。你要明白：情绪与决心并不能代替策略与合作，如果你独断专行，即便伙伴心甘情愿，也会因无法同步而被抛下，最后孤身前行。你要保持坚定，但切勿招惹风浪。","当你心中已有决断却能力不足时，就像一个臀部瘦弱无法使身体前行的人。你需要依靠合作伙伴、借用他们的资源和能力来印证自己的决断，但你依然要牢牢掌握主动，就像牵着羊前行一般，对于任何动摇你信念的观点，你必须拒绝。","当你已取得成就并身处高位时，即使你内心柔弱，也不得不显露刚毅之态。就像苋草外表柔弱却能顶风生长一样。只有你保持中立和公正，方可确保自己不遭遇任何灾患。","当你把“刚决”做到极致，一旦你心有所想，便不再与他人讨论，立刻全身心投入时，这种作风若缺乏规划与分析，结局往往难以预料，极其凶险。你要把“刚决”与“审慎”结合，才能确保万无一失。","若你遇到刚强的对手，就不要拼硬碰硬，而要以柔克刚，用亲和之术化解对方尖锐之力，争取最大利益。只有这样，你才能化敌为友，取得更大利益。","当你需要让发展步伐放缓时，就像把车熄火、拴上坚固的刹车一样，这是明智的做法。在高速发展之下，一旦停不下来，你将忽视潜在问题，导致严重后果。犹如瘦弱的猪仔，不堪一击，偏偏仍硬往前冲，结果只会陷得更深。","当你自我反省达到极致，你就能言之有物、获益良多，不会出现偏差。正如鱼儿离不开水，你也需要保持柔和、顺应环境的品质。你把成果留在内心，暂不急于对外分享，因为每一次饱满的收获都需要沉淀，待时机成熟再公开，这样才能保障万无一失。","当你在激烈竞争中自身能力尚不足以远行时，就像臀部无肉、行路艰难，你要守住本分，并以柔克刚。即使你历经诸多磨炼，却仍能避免大祸，因为你懂得在对抗中保存实力。","当你获得的支持难以让你发起大举行动时，如果你执意行动，必将是凶险。你要耐心等待，先巩固现有资源，确保自己具备发起行动的底气，然后再蓄势突围。","当你已功成名就，却仍显柔弱，你便会低调行事，如同将胸中锦绣深藏而不轻易露出。尽管你心怀壮志，也可能因种种不利因素被迫施展实力，你要学会在低调中积蓄力量。","当你将“柔弱以柔克刚”做到极致时，你会发现已无退路，就如同触及尖角的柔软生物，进退维谷。但若你能够主动缠绕住对方，就能化险为夷。这份柔中带韧，是你最大的生存之道。","当大家聚拢在一起、顺应大众之意时，事务便会亨通无阻。上位者只需以此凝聚向心力，就像带领百姓到祖庙祭祀一般。对外交流也因此更加顺畅，有利于各方共同协作。","当你讲诚信却因能力有限无法独自完成目标时，就应该招募志同道合之人、组建团队。你发出一声号令，就会有人响应，一旦人力物力充足，再去执行任何宏图，就不会出现重大问题。","当大家聚在一起、群策群力时，你就会获得长久的收获。因为你们是凭借共同信仰走到一起的，你所做的一切都被赋予意义。即使只是一次简简单单的祭祀，也会让环境因为你的诚心而变得丰饶。","在竞争对手环伺之时，伙伴们若徒增同情叹息，却无法改变任何局势。你只有付诸行动，才能检验可行性，哪怕需要少量额外付出，也不会带来重大灾患。","当大家同舟共济、携手并肩时，你便无往不利。你或许不是团队中的主导者，但只要大家携手并进，就不会有灾难。因为彼此信任，协作自然更顺畅。","当伙伴们聚集到一定数量后，如果你能够成为主导，就不必担忧灾患。但如果你无法真正获得众心，就要凭借实力与智慧带领他们保持和谐，使自己始终立于不败之地，那样你的悔恨也会慢慢消散。","当聚集达到极致、已无可聚之人时，自然会有人离开。这时你要妥善安排“散伙费”，体面告别，让大家依依不舍地离去。那种“好合好散”的场面不会招致灾祸。","当你积聚了足够的资源后，团队再也无法继续扩展，你就要转而提升自身，建立上下通达的系统。你要抓住现有机会，不断完善自己，向外部有能力的人学习，不要畏惧。利用外部资源进一步提炼你自己的精华，这样你才能乘势而上。","当你拥有资源支持，要抓住每一次发展机会。你要以诚信和公平为原则，把握升迁与发展机遇，这是一件何其美好的事情！","当你内心恭敬虔诚，即使微薄的祭祀也会感动神灵，你就一定会得到好的回报，不会有什么问题。","当你以资源优势对敌人形成倾轧时，对手会闻风丧胆，纷纷退避。遥远前方若再无人把守，你就可以顺势占领这一地区。","当汹涌洪流不可阻挡时，就像君王到岐山祭祀，必定吉祥如意、无一灾祸。","当你取得成就并保持内心正直安定后，就能不断收获好成果。但你也要按部就班、稳步推进，莫因一时成果而骄傲自满。","当你在某个领域提升到极致，却发现没有明确目标时，你会陷入前路迷茫的状态。此时如果你盲目提升，就难免失去方向。你要始终在前行过程中不断修正自己的思路，保持内心正直安定。","当你如同水一般顺势攀升、流动，却突然到达无法再升之处，你就会被困于某个角落。但你的内心依旧坚强，即使被束缚，也不会有大的灾难。哪怕四面受困、进退两难，只要你能保持内心正直安定，也不会被最终击垮。","当资源耗尽之时，你会陷入窮困境地。就好像你连一把椅子都没有，只能长时间坐在粗糙的树桩上，腰酸背痛、又冷又饿。在这种情况中，你应利用时间调整心态，认真反省自己，不要再被他人言论所迷惑，也不要自怨自怜。","当你拥有过多资源却无法好好利用时，就只会导致浪费，还会让你因与身份不匹配而背上“浪费”、“僭越”的骂名。你要清醒地认识到，必须给自己定位，切莫继续疏于行动。就像宴席中的酒菜摆得过于丰盛，反而浪费。真正丰盛的菜肴是用来祭祀的，只有在那个时机分享方能发挥最大价值。","当你的竞争对手大势已成，看似坚不可摧，就像你陷入乱石之中，想要退出却发现回头路到处荆棘丛生。当你好不容易返家，却发现妻子已经不见，这样的处境实在凶险。","当你留在原地等待援助时，救援物资往往庞大且迟缓。一开始你可能需要等待更长时间，但只要坚持，总会得救。","当你已经取得成就时，遇到挫折时往往损失更大。如同你位居上卿，却因朝令不明被扣罚割鼻等极刑。要认清自己所处的困境、接受损失，然后放下过去、寻找东山再起的机会，如借祭祀之机重整旗鼓。","当你身处极端困苦的境地时，你动也动不了，不动也不行。就好像你被纠缠在乱七八糟的葛藤中，无法挣脱，又仿佛你站在随时可能崩塌的山石之间，整个人都摇摆不定。你只要稍微做出一点行动，就会使自己陷入危险，动了之后你会后悔，不动时又觉得不甘心。无论怎样，都有可能让你后悔，因此你最好尽快采取行动。","当你的资源受到限制时，你虽然想改建城邑，但原本的井却始终在那里，无法挪动。你不要试图去改变资源的环境。你每天来来往往地到井里打水，但井里的水不会随着周围环境的改变而增多也不会减少，总是原封不动地存在着。直到有一天，你将井绳几乎放到井底却仍然没有打到水，你气得把打水的瓶子都摔坏了。这时，你才发现资源已经被耗尽了。","当你的资源受到种种限制时，你需要理性地分析现有资源的状况，然后果断地取舍。你发现井里的水已经浑浊不堪，泥泞不清，无法食用；剩下那些已经被废弃、干涸的水井，连鸟儿都不会前来觅食。你必须认清现实，及时放弃无用的水源。","当你的资源极度紧张时，你只能省吃俭用，家里一派破败景象。井水早已干涸，井底只剩下打着嗝的虾蟆；家里盛水的器皿也快报废了，有的根本没有盖子，有的已经破损漏水，对你毫无用处。","井中污泥虽然已被清理干净，但如果没有人来取用，会让你心中痛惜。直到你亲自汲水上来享用，你才明白这是因为上位者下令改善水质资源。由此你可以看出，君王贤明时，大家才能一起享受到福祉。","当你为防患未然而加大投入，比如用泥土堆砌、用砖石修筑水井时，就不会有什么灾患。","你要让井水保持清澈明净，就像甘甜凉爽的泉水一样，供天下人饮用。","你完成了对资源和环境的改造后，就能持续不断地提供支持，实现共赢。井水改造完毕，你就有能力让民众源源不断地汲水；此时资源充足，不必独占，也无需为井盖分外设限。只要你以诚心分享资源，就能营造出和谐美好的局面。","当你等待时机进行变革时，必须明确改革的目的，并敏锐地把握出手的时机。你要知道，得道多助，进行改革需要你内心的坚持，也需要外部环境的支持。如果你借助天时，使土地更加肥沃，那么改革才能顺利进行。这是一个内外闭环、亨通无碍的过程；一旦改革成功，你绝不会后悔。","如果你察觉时机尚不成熟，就要稳住阵脚，强迫自己克制，积聚力量。就像用坚韧的黄牛皮捆住自己，不让自己轻易挣脱。","当你等待到时机成熟时，就可以开始推行改革。这个合适的时机往往是改革对象由盛转衰、显露出腐败的时候。你在这种时候果断前行，就能取得良好效果，不会出现问题。","如果你贸然推行革新、参与竞争，会面临凶险。在这种情况下，你只能保持内心的镇定，在竞争中磨砺自己。你要自上而下推进改革，才能事半功倍。在经过谨慎严密的论证后，你提出的革新方案，务必要请示高层并获得信任和充分授权，然后才能展开变革。","在改革过程中，如果你能及时修正错误，就会消除悔恨，也会因此赢得更多同伴的信赖。你借助他们的力量来改变常规命令，从而获得更多收益，这是一件好事。","当你有所成就后，可以不定期地提出革新方案；经过评估，如果方案足够优秀，你就要付诸实践。首先，你要把改革运用到自己身上，就像老虎到了换毛的季节，焕然一新，让自己彻底改变。你凭借丰富的经验，总结出良好的变革应对机制；在变革初期，你依靠强大的能力和主导地位，就能在未见成效前赢得下属和伙伴们的信任。","当你的改革达到极致时，整体就会上一个台阶。君子焕然一新，小人也会改头换面。改革刚完成时，你需要巩固成果，不可过于激进，否则会带来凶险。你应稳扎稳打，保持内心的镇定，这样才是正确之道。","你要利用已有资源来形成缓冲，并借助外部势力来提升自己，让你的精华全部展现出来。","当你借用外部势力来被动提升自己的时候，必须做好充足准备，防止被外势所误导。就像烹食之前，要把鼎倒过来，把无用的残渣倒出来。借火烹食的鼎，就是在告诉你借势的道理。纳妾虽容易引起家庭纠纷，但如果由此得到了儿子，使后继有人，这件事情就没有问题。","当你通过自我完善而获得更多能力时，就像鼎中充实，因此会招来竞争对手的嫉妒。但是因为这是内部发展，外人无法干涉，也无法靠近来争夺，这种状态对你是有利的。","如果外部之火烧得太旺，就会导致鼎耳脱落。你的鼎身被烫得太热，无法移动，用来烹食非常不便；即使最肥美的野鸡也只能眼看却无法下锅。即将下雨时，鼎太烫而无法触碰，这意味着你白白浪费了一锅美汤，让你后悔不已。然而，只要雨水终会熄灭余火，使鼎身降温，最终还是会有好的结果。","如果鼎足折断，就相当于把大家的饭食都打翻，使一地黏腻，看起来十分凶险。","当你为鼎配上黄铜制的鼎耳和坚固的金铉时，就算再大的火也无法损坏你的鼎，这对保持内部的正直安定非常有利。","当你为鼎配上玉制的鼎杠，就提升了自身的品质，一切将无往不利。","如果你成为大家的“主心骨”，就要做到处变不惊，使内外亨通。当雷声传来时，大家都很恐惧，而你却要谈笑自若；雷声传得很远时，其它人都吓得毛骨悚然，而你依旧从容地吃饭，甚至连手中的酒都不会洒出一滴。","你需要不停地锻炼自己，承受压力，战胜自己的恐惧，以此来带动周围的人。就像雷声阵阵，起初你也会很恐惧，但通过有意识的锻炼，你就能保持谈笑自若，真正成为“主心骨”，这是一件好事。","当机会来临时，你要抓住机会来磨砺自己，即便这会暂时让你失去安宁。巨大的机遇常常伴随着巨大的财富，但你不要主动去追求财富，只要把握好机会，财富自然会降临。在古文化中，“七”对应阴阳五行，正好象征一个小轮回，指的就是这次机会。那些只追求财富的人反而得不到，而通过苦练内功的人，财富会自动送上门来。","如果你心中有鬼，就更容易被突如其来的雷电吓到。雷声让你恐惧不安，而雷电照亮天空、震慑小人。在雷电阵阵中前行时，你无需担心看不清前方的道路，也不用害怕被小人蒙蔽。","当面对巨大的机会和压力时，如果你自身不够强大，就更容易陷入困境。就像被雷声惊得跌入泥沼一样。","当雷声阵阵、一来又去、一去又来时，你要借此机会磨砺自己，保持内心的平静安宁。遭遇重大事故时，也要如此。","如果你内心戒惧到了极致，就不适宜主动出击。就像天雷震动时，你会恐惧不安、惊惶四顾。如果你在心不安定时贸然采取行动，就会带来凶险。雷声还未传到你身前，却已经震到邻居头上；你要吸取教训，时时戒备，这样就不会有什么灾患。然而，即便邻居出事而你幸免，也难免被打上“自私”的标签，等你想与人合作时，可能会听到一些冷言冷语。","无论你处于静止还是行动状态，都要与环境融为一体，不分彼此。这样你就能与周围一起承担各种事情，共同分享一切，就不会有灾难发生。","如果你坚持内心的“静”，就要坚持自己好的那一面，认清自己的优点。对好的地方，你就要坚持；人若要行动，先要迈出脚步，站稳脚跟，坚定不移，就不会招致灾患。你一贯保持内心的正直安定，这是一件好事。","当你像小腿蓄力一样，已经具备了潜在能力，但只有腰臀带动小腿才能真正前进；这意味着虽然你有力量，却不足以做出实质性作为。因此，你要维持现状，暂缓扩张；同时，你要关注下属，让他们看到成长的机会，以免他们心中闷闷不乐。","当你处于竞争之中时，不能一味龟缩不动，而要审时度势，抓准机会果断出击。否则等到对手发展壮大后，你会陷入更大的困境。就像你保持腰部不动，背上的两片肌肉失去了与腰部的联动，整个人就无法发力，令人忧心如焚。","在与他人合作的过程中，你要保持自我约束。在那个时候，你就像保持身体静止一般，就不会有什么灾患。","当你保持面颊严肃不变，说话条理分明、井然有序时，就能把事情解释清楚。由于误解而引起的悔恨也会因此烟消云散。","如果你能够将守正做到极致，就会表现出谨慎敦厚的品质，这对你有利。","当你渗透转化、循序渐进时，就像与心仪之人恋爱并最终结婚一样，这是美好的事情。","当你遇到能力强的人时，你会受到他的影响，往好的方向发展；反之亦然。就像水鸟来到水畔学习游泳捕捉鱼类，都是潜移默化的培养，循序渐进。正如你教导孩子，孩子做错事时你会呵斥，久而久之，好习惯就会自然养成，这样就不会有什么问题。","当一切水到渠成，你抓到小鱼时，就要找块礁石来落脚，安稳地享受收获。这就是在良好转变后获得美好结果的表现，非常令人欣喜。","如果你参与竞争，却突然发现新的环境完全无法适应，就像水鸟来到干旱无水的大地一样。用在人事方面，就好比你身为丈夫出征再也无法回来，或者妻子怀孕却不能养育孩子。这是一种极其凶险的局面，不宜主动出击，最好采用防御策略来抵御外敌。","当你逐步渐进地进入山林时，时不时能找到平整的枝杈让你栖息，在这种状态下就不会有什么灾患。","即便你身处并非自己习惯的环境，也可以通过逐步发展和改造而取得成就。就像水鸟最终成功飞上高山；在你的人生中，就像一位妻子三年未能怀孕，最终还是如愿以偿，不会被取代，这是一件好事。","当你渗透发展到极致、实现自身成长后，便能快速适应各种环境，就像来到四通八达的道路中枢。此时你拥有了实力，也需要选择承担相应的责任，这样才更好。就像水鸟凭借漂亮羽毛成为典礼上的装饰品一样。","当你逐渐渗透，被动适应，并将被动转化为主动时，就要像草丛缠绕金子那样，让自己与环境契合，不要强行砍伐；否则硬要去做事只会适得其反。","如果你将女儿嫁出去，就要主动适应新环境。在三人同行中，必有我师；当你发现他人有自己欠缺的优点或处世方法时，就要虚心学习，平心静气，把自己放到一个较低的位置上。就像出嫁成为妾，通过学习补全了自己的不足，最终将所学转化为自己的东西并发扬光大，就像一个瘸腿的人通过恢复和学习重新学会行走，随后还可以远行。这是一件好事。","当你主动适应新环境时，也要符合自己的定位。即便双目失明，你仍然能够看见事物；你不必自卑，要主动适应，虚怀若谷，不因外物而喜，不因自身而悲，以隐士般的正直安定来主导你的思维。","当你将女儿嫁为大家的大妇时，却因为她自身能力和心性等综合原因，最终只能以妾的身份出嫁。","如果你坚持自己，不轻易盲从，就像待嫁少女不肯轻易许嫁，以至于婚期延误。但你不必担心，推迟日期只是为了等待更好的时机；即便延期，最终你仍能嫁出去。","当帝乙将少女嫁出时，从服饰上看，大妇所穿的服饰不如偏房的服饰艳丽华美。这是因为到了农历十五，身为家中大妇，你只求阖家欢乐团圆，这是一件好事。","当你适应达到极致时，该学的都学会了，已经无可适应；就像女子的筐篮空空荡荡，里面的果实已经被吃光；或者像男子宰杀牲畜却不见血（牲畜已经死去），这种情况再做下去就没有意义和利益可言。","如果你要壮大自己，就要像用干草引火一样，在适当的操作和环境下，就能燃起大火，实现亨通。上位者可以借此壮大自身，就如国家欣欣向荣。火势一旦大了，草木马上被烧尽，但你也可以利用草木保存火种；当你用草木来保存火种时，火势虽微弱，却不容易熄灭，这令人不必担心。当你需要点燃火种时，还可以借助天时，比如中午天热时，燃火会更容易。","当你拥有适合高速发展的资源时，自然要把握住机会，但也要注意后续资源是否能够跟上，以满足后续发展。否则，原有的资源很快会被消耗殆尽，盛大的景象只会成为昙花一现。你需要找到与发展相匹配的资源，这样即便长期发展，也不会出现大问题。只要你继续发展，成就越大，就会获得众人的尊崇。","在你高速发展的时候，不可知的问题也会随之出现。就像在大白天，太阳光被云层或日食层层遮住，甚至白天都能看到北斗星一样，这并非吉兆。这样的情形很容易给你的决策带来猜忌的声音。实际上，这只是常见的现象，只要你沉着应对，一一解决，就会有好的结果；你要有信心，相信自己的决策和目标制定是正确的。","当你的竞争对手从各个方向重重包围时，旌旗如同天日遮蔽，你几乎无法看到阳光。如果你握住旗杆，却让竞争对手折断了你的右臂，就会失去对旗杆的掌控，就如同被剥夺了阳光一般。此时，你要努力取回主动权，让阳光重新照耀在你身上，这是一件好事。","在你高速发展过程中，如果遇到浮云遮日、人人人心惶惶的时候，要意识到你的伙伴的上级也可能遇到相同的问题。你要认真倾听他们的意见，大家同心协力，就能度过难关，取得好结果。","当你有所成就时，会有锦绣人才纷纷投靠，这意味着你得到了良将贤臣的拥护，同时也会带来喜庆和美誉，这是一件好事。","如果你过分激进，导致资源被过度消耗，最终连基本的供给都成问题，就会陷入闭塞不出的境地。就像你建起高大房屋却把窗户遮死，从缝隙里只能窥视外面，长久无人来访；整整三年都不见人，这种自封孤立的状态非常凶险。","当你过分消耗资源，导致资源紧张时，就要调整发展策略，寻找新的方向；同时保持内心的正直安定，不要盲目冲动。","你要根据资源情况及时调整自己的发展方向。当外部资源与发展方针不匹配时，必须灵活变通，调整自己的策略，以确保资源得到高效利用。此时你要注意，一定要配合资源情况做出改变，而不能为了坚持自己而只做无关紧要的小改动，否则往往会造成更大的代价，还可能失去良机，从而招致灾害。","当环境发生变化时，你要及时调整自己。因为你之前的积累，已经具备了基本的安身立命条件，即便奔波在外也无须担心。就像旅行时累了，你有旅馆可住；你的旅费足够，手下也一致支持你。","如果你在旅途中住处失火，失去了随身的童仆，你要保持内心的正直安定，并经受住磨砺。","当你身处异乡，虽然找到了安稳的住处，也赚到了日常的路费和用品，但你的心情仍然不算愉快，因为这只不过是旅途中的暂时栖息。","如果你外出射杀野鸡，一箭毙命，这就说明你历经艰辛、苦练技能后终于成功，并以完美的命中率赢得了赞誉。","当你颠沛流离，终有所成，即使暂时驻扎的地方并非真正的家，你也要明白，这就像鸟巢失火被烧掉；你先因成功而欢笑，随后又因驻地被毁而大哭，甚至连牛也跟着失散，这种境遇非常凶险。","当你处于颠沛流离的状态时，仍然需要保持谦逊顺从。纵然你相对柔弱，无法做大事，但你本身依然是美好的存在，能够获得小小的顺通。与他人一起做事情时，就会展现出整体的和谐美好，极具吸引力。","当你遇到比自己更有成就的人时，需要保持顺从和谦逊，但并不意味着盲从；你仍要坚持自己的主见。如果对方退却，你无需顾虑，就会自然发展并跟上对方。这时你要果断决策，如同武人那般坚定的意志。","当你决定收起原来的成就，以谦虚顺从的态度对待即将发生的事情时，就好比把摆放在台子上的珍宝收起来，放到床下，然后请史官或巫婆为你祈福。这种做法是恰当的，不会有问题。","如果你被竞争对手压制，即便你面露顺从之色，却会因为过分珍惜自己而陷入艰难的局面。","当你选择合作互助，并保持谦逊顺从时，你会左右逢源、收获众多，所有的悔恨都会烟消云散。就像田猎时，你获得了丰富多彩的猎物，各个品种应有尽有。","当你已有所成就时，仍然要保持顺从和正直安定，这样就能消除所有悔恨，你所做的一切都会无往不利。即便在最初阶段，因为多人提建议而陷入选择困难、决策不顺，但慢慢你会习惯这种状态；在你顺从别人并被别人顺从的过程中，就会形成良性循环，这是一件好事。","如果你谦虚柔顺到了极致，就像将台子上放着的珍宝都藏到床下，这样你就失去了最基本的价值。虽然你保持了内心的正直安定，但过分压抑自己却会带来凶险。","当你终于获得成就，大家皆大欢喜，事业亨通时，你仍需要保持内心的正直安定。","当你自身比外部更优秀时，虽比他人更胜一筹，但你要明白红花绿叶各有千秋；只要你彼此相敬如宾，给予应有的尊重，大家就能和谐共处，最终达成皆大欢喜的结果。","你要相信自己能够做得更好，这种自信对你是有益的，它可以帮助你调整心态，消除内心的悔恨。","如果你的竞争对手来到身边，却曲意逢迎，力图维持一个皆大欢喜的局面，这种做法往往不太现实，反而隐藏着凶险。","当你与他人合作时，要通过协商或谈判来达成一个皆大欢喜的解决方案。在谈判过程中，你会经历波折和漫长的等待，无法保持安宁；但你每解决一个问题、达成一项共识时，就会感到欢喜雀跃。","当你有所成就时，就要以天下同乐为己任。但你要认识到各个阶级之间的利益牵扯很难做到一碗水端平；如果你只是取悦某个阶级，就会损害对立面阶级的利益，导致他们在心理上主动与您疏远。为了保全这部分被剥离的阶级的诚信，你不得不加重自己的负担，尽量兼顾各方，这是一件非常困难且危险的事情。","当你引导民众一同欢乐时，就要让大家感受到参与的乐趣。","即便存在不和谐，只要你能够把握时机，内外一致，就能亨通。当你处于有利地位时，可以借机建立新的信仰体系，比如代民众去祖庙祭祀；这样做有利于你快速推动事情，并保持内心的正直安定。","当外部条件优于自身、人民人心涣散时，你不必勉强那些已经不再忠诚的人；反而要重新培养核心竞争力，挑选那些既有能力又柔顺忠诚的人，通过提拔他们来壮大自己。就像用健壮良马来弥补自己的实力不足一样，这样的结果对你有利。","当人心涣散时，正是你进行结构调整的良机。你要抓住这个机会去去污存精，这样所有的悔恨都会消失。","在面对竞争时，你要在锻炼对手的同时，也借助这种压力来解构内部不同思想，进行区分。就像用流水来洗涤对手的全身；即使水流四散，你也不必后悔。","当你充分发挥自己的能力，就能让那些结党营私的小团体解散，这才是真正的和谐。小团体一旦解散，大融合就会出现，伙伴们会收起私心，团结一致，如同山丘般凝聚在一起，场面壮观非同寻常。","当你有所成就时，要承担起对民众的责任。当天下人心涣散时，你要发布令令行禁止，重新树立信任的核心。同时，你还要排除私利，以身作则，将王宫积聚的财富散发出去，这样就不会有什么灾患。","如果你过分离散，导致无法挽回的伤害，就要洗干净伤口流出的血液，将自己远远保存起来，这样就不会招致祸患。","当人心已经涣散时，你可以暂时退而保存自己，保持节制。但你不能因此让节制成为苦楚，否则心中苦闷无法维持内心的端方正直。","如果你自身优秀，而外部竞争逐渐出现，挑战你的权威时，你不应该立刻主动出击，在内部制造更多竞争；你应该先审视自己，确保自身稳定（包括资源、市场、人际），并控制与外部的接触，以避免不必要的消耗，这样就能避免问题的发生。","当你的内部稳固，发展成强大的实体后，就不要固步自封；你要趁机进入市场竞争。就像富裕的大户人家却闭门不出一样，这种做法只会招致祸患。","面对竞争，如果你不主动进取，就会退步；如果一直不加节制地等待，等到后来的竞争者赶上你时，你只能徒呼奈何，悲伤叹息。一旦这种情况发生，你依然可以凭借自身的能力优势重新赶上去，不会发生太大的灾患。","在合作过程中，你要保持自我节制。不要把节制当作枷锁，而要意识到这是自然而合理的做法，然后心安理得地去接受，这样才能内外一致、亨通无碍。","当你已有所成就时，节制就成为成功的代价；如果你将节制推而广之，被节制者就会愉快地接受，这是一件好事。只要你坚持下去，就会得到众人的尊崇。","如果你过分节制，甚至影响到正常的生活，陷入痛苦的状态，此时你会因为过分虚弱，即便内心信念再坚定，也还是会面临凶险。你要明白，节制是你心中的信念，虽然肉体会受苦，但内心的悔恨却会慢慢消亡。","你要保持自信，以诚待人，就像鱼儿在水里自由游动，自然就能孕育出良好的生态氛围。只要你保持内心的正直安定，一切就会顺利。","当你与外部客户或竞争对手打交道时，一定要建立在诚信的基础上。首先，你要理性地评估对方是否值得信任，这样才能获得好的结果。一旦你选择相信某个人，就要坚持下去；如果你一直心存疑惑，就无法保持内心的安宁。","你要建立诚信的关系，让彼此沟通无障碍。就像日影下的仙鹤在鸣叫，即使小鹤看不到，也能发声应和。如果你有好东西，就要与对方分享，同甘共苦；就像你有好酒，就要与朋友一同畅饮，直到喝光它。","当你坚守心中的信仰时，无论成败，你都要为自己的决定承担后果。遇到竞争对手时，要么你敲响战鼓，积极迎战，要么你罢兵退守；结果只有两种：要么战败而痛哭，要么凯旋而高歌。","如果你的合作伙伴离开了，你要祝愿他们幸福，就像临近农历十五，人们都在求取阖家团圆。即便你的马儿走失，但成双成对的马匹总能找到彼此；虽然失去了一对，但只要各自好合好散，就不会有什么灾患。","当你做到内外一体后，就能让整个市场因诚信而勾连一体、合作无间，遇到损失时大家同感痛苦，获得利益时大家共享荣光。不论最终结果如何，都是你遵循内心信念而获得的，不会有什么灾患。","如果你自信到了极致，就会变成自满，并强行去做超出自己能力范围的事，最终会伤人害己。就像锦鸡声音嘹亮，却无法高飞却要登天。即使你心中有这样的信念，但能力有限，仍会带来凶险。","你要明白，自信必须建立在对外界事物的充分了解基础之上。再优秀的外部资源也不属于你，你必须从头开始，一步一个脚印地努力。就像天空中的飞鸟只是留下叫声，其他什么痕迹都无法留存。因此，无论你做什么，都不能好高骛远，要脚踏实地，才能获得非常好的结果。","你要提防过度自信和好高骛远，要参考外部优秀之处，将其学为己用。对你而言，更多的还是要一步一个脚印地前行，不能像飞鸟一样一飞而过，看得都是表面，却什么也没收获。","当你出访探望他人时，这只是手段；你真正的目的是学到有用的东西，切勿本末倒置。如果你拜访了某位专家，却只遇到他的老师；又或者没有见到老板，却遇到了他的下属，但无论如何，你想了解的情况已经了解到了，就没有问题。","在竞争环境中，如果你不清楚敌我情况，没有真正出访沟通，就要保持谨慎戒备，并预先做好应急准备，以防万一。因为如果你盲目听从，可能会造成不可挽回的损失，那才是真正的凶险。","如果你与合作伙伴有相同目标，即使缺少专程拜访，也不会发生大灾难；你们会经常相遇交流。然而，长期发展下去，彼此的战略规划和处事方式差异会逐渐显现，内部分歧会越来越严重，最终形成很大的阻碍。你必须提前预防此类事情发生，不要太过固执，为了坚持而坚持。","当你有所成就时，就会有人来拜访你。访客一路而来，像生成的水汽蒸腾成云，但如果访客也遵循“藏于小处”的原则，这朵云还不会化作雨滴。通过与访客的沟通，就能足不出户地获取他们的经验，这也是你新的收获。就像智者射猎时，会在箭杆上绑上细绳，哪怕猎物跑进洞里，也能将它拖回来。","如果你与对方互不相识，却贸然前去拜访，就像飞鸟自投罗网，这是非常凶险的，这就是所谓的“天灾人祸”。","当你用水灭火时，如果水势够大，就能将火彻底熄灭，使一切亨通，反应也会越来越及时。起初，如果水小火大，反而会助长火势；但是只要你不断注入水，最终就能扑灭火势。你要做到做事适可而止，不要把事情做绝做尽。","当你发现内外出现矛盾时，要先区分彼此力量的对比；当你认识到外部势力大且不可逆时，就要重新制定方针，必要时彻底放弃已有计划，反其道而行之。虽然你要付出不小代价，但越早做出反应，就能越早回到正轨。就像行驶中的车子，当你拉住车轮时，车子就无法前行；你如果全身力气都在拉住车轮，尾巴就会无力下垂并被地面拖湿。如此，你就不会再招致更大的灾患。","如果你陷入内外矛盾、无法收获，也无法展示自己的能力，就像妇女遗失了首饰，无法打扮自己。然而你的能力依然在那里，只要你处理好内外关系，调整好方向和策略，最终就会有展现才华、获得收获的时机。就如七日一个小轮回，到那时你会再次收获成果。","当你与对手竞争且势均力敌时，就像商高宗征伐鬼方，整整用三年才获得最终胜利。三年的战斗让你的兵丁疲惫不堪，使你无法再轻率用兵；而在兵丁中，若有人有战功却无能力，就不能提拔他们，即使重赏也不能重用。","当你与合作伙伴之间在管理思想和企业文化上存在冲突时，就要时时保持警惕，就像在细密的丝织品中混入了旧棉絮一般，一旦松懈就会带来隐患。","你要明白，只有真正能增益自己的事情，才对你有利。就像你举行隆重的杀牛祭祀，对环境并没有实际作用；反而简单而诚心的祭祀，才能真正造福环境。原因就在于实实在在的好处摆在那里。","当水完全扑灭了火，就变成了完全由水主导的世界；你就无法游动，很容易被水淹没到头顶，这是非常危险的情况。","如果你想摆脱“鸟尽弓藏”的局面，就必须孤注一掷，冲出那片天地，这样才能亨通。就像小狐狸用湿润的尾巴去救火，这种方式无法灭火，也没有任何好处。","当你全心抗争时，就要将内外矛盾视为机会，通过自己的努力来改变外部局势。如果你有足够的能力，就要全身心地投入，争取那一丝希望；要以小我之力与包围自己的外势抗争，不能有任何顾虑，生死成败在此一举。就像用尾巴沾湿的一些水珠去灭火是远远不够的，只有把全身都打湿，整个冲入火场，才能有可能冲出限制你的天地。","当你面临最艰苦的时刻时，要认清自己目前的软弱无力；即便外部压迫得厉害，也不能根据本能盲目挣扎、浪费体能，而要克制自己、积聚力量，寻找突破困境的机会。你必须慎重考虑、仔细观察，不要轻举妄动，就像行驶中的车子，有时需要在保持动力的时候制动（同时踩住油门和刹车），保持内心的正直安定，才能确保最终获得好的结果。","在激烈竞争之中，当你能力不足以大获全胜时，如果你一意孤行地去对抗，那将极其危险。与你其与弱者对抗，不如果断退让，到适合自己的地方另辟新战场。","当你身处“破釜沉舟”的境地，为了追求理想，你毫无退路，背水一战。只要你保持内心正直安定、决不后悔，就能像你带兵征伐鬼方一般，即使历经三年艰苦，也终将胜利，将国家打造成庞然大物。","当你既已破釜沉舟、全力以赴，在大火熊熊之中从容穿行时，你宛如光芒万丈的存在，让旁人刮目相看。正是因为你坚守信念，你才能冲破重重封锁，这就是好样的你！","当你做该做之事后，便要听天由命，无论胜败，都要怀着欣然之心去接受。你要满怀自信地饮酒作乐，坦然面对成败。如果你已经作好了充分准备，却依然败下阵来，也不要过度悲伤；你要及时调整自己、放下包袱，尽快走出低谷。借酒消愁可以理解，但若过度酗酒，连头都湿透，那便是失当之举。"]),ii=Object.freeze(["就像你刚出生时，你用双手触摸世界，逐渐认识自己，同时也在认清这个陌生的环境。","你需要在内心中打好基础，通过调整自己的状态来不断积累能量，以便随时准备与外部环境进行互动，并能够投入到外部竞争中。","当你开始与外部环境接触时，你会不断试探、观察对手，并随时根据自己与外部竞争者之间的关系来调整策略。","一旦你获得了外部的认可，你就要从外部合作者的角度对自己的状态进行客观评价，并与他们一起探讨你应该采取的策略。","当你已经与外部环境深度融合，你就要以主导者的身份审视自己在这个环境中的位置，进而制定对应的行动方案。","走到今天，你发现自己已经接近外部环境所能容纳的极限，于是你在困境中思考变革，并从当前状态向下一个阶段迈进。"]);var De={};Ge(De,{CLASSIC:()=>ai,EXPAND:()=>si,GIST:()=>ri,STAGE:()=>li});var ai=Object.freeze(["元、亨、利、貞","初九。潛龍勿用","九二。見龍在田。利見大人","九三。君子終日乾乾，夕惕若。厲，無咎","九四。或躍在淵，無咎","九五。飛龍在天，利見大人","上九。亢龍有悔","元、亨、利、牝馬之貞。君子有攸往，先迷後得主，利。西南得朋，東北喪朋。安貞、吉","初六。履霜，堅。冰至","六二。直、方、大；不習，無不利","六三。含章，可貞。或從王事，無成有終","六四。括囊，無咎無譽","六五。黃裳，元吉","上六。龍戰於野，其血玄黃","元、亨、利、貞。勿用有攸往。利建侯","初九。磐桓。利居貞。利建侯","六二。屯如邅如，乘馬班如。匪寇，婚媾。女子貞不字，十年乃字","六三。即鹿無虞，惟入於林。君子幾，不如舍。往，吝","六四。乘馬班如，求婚媾。往吉，無不利","九五。屯其膏。小貞吉，大貞兇","上六。乘馬班如，泣血漣如","亨。匪我求童蒙，童蒙求我。初筮，告。再三瀆，瀆則不告。利、貞","初六。發蒙，利用刑人，用說桎梏。以往，吝","九二。包蒙，吉。納婦，吉。子克家","六三。勿用取女：見金夫，不有躬。無攸利","六四。困蒙，吝","六五。童蒙，吉","上九。擊蒙。不利為寇，利禦寇","有孚，光亨，貞吉。利涉大川","初九。需於郊，利用恆，無咎","九二。需於沙，小有言，終吉","九三。需於泥，致寇至","六四。需於血，出自穴","九五。需於酒食，貞吉","上六。入於穴，有不速之客三人來，敬之，終吉","有孚，窒惕，中吉，終兇。利見大人，不利涉大川","初六。不永所事。小有言，終吉","九二。不克訟，歸而逋其邑。人三百戶，無眚","六三。食舊德。貞厲，終吉。或從王事，無成","九四。不克訟，復即命。渝安貞，吉","九五。訟，元吉","上九。或錫之鞶帶，終朝三褫之","貞。丈人吉，無咎","初六。師出以律。否臧兇","九二。在師中，吉，無咎。王三錫命","六三。師或輿屍，兇","六四。師左次，無咎","六五。田有禽，利執言，無咎。長子帥師。弟子輿屍，貞兇","上六。大君有命，開國承家。小人勿用","吉。原筮，元永貞。不寧方來，後夫兇","初六。有孚，比之，無咎。有孚，盈缶。終來有它，吉","六二。比之自內，貞吉","六三。比之匪人","六四。外比之，貞吉","九五。顯比。王用三驅，失前禽，邑人不誡，吉","上六。比之無首，兇","亨。密雲不雨，自我西郊","初九。復自道，何其咎？吉","九二。牽復。吉","九三。輿說輻。夫妻反目","六四。有孚，血去惕出，無咎","九五。有孚攣如，富以其鄰","上九。既雨既處，尚德載。婦貞厲。月幾望，君子征，兇","履虎尾，不咥人，亨","初九。素履，往，無咎","九二。履道坦坦，幽人貞，吉","六三。眇能視，跛能履。履虎尾，咥人，兇。武人為於大君","九四。履虎尾，愬愬，終吉","九五。夬履，貞厲","上九。視履考祥，其旋元吉","小往大來，吉，亨","初九。拔茅茹，以其彙。征，吉","九二。包荒，用馮河。不遐遺，朋亡，得尚於中行","九三。無平不陂，無往不復。艱貞，無咎。勿恤其孚，於食有福","六四。翩翩不富以。其鄰不戒以孚","六五。帝乙歸妹，以祉，元吉","上六。城復於隍，勿用師。自邑告命。貞吝","否之匪人，不利君子貞，大往小來","初六。拔茅茹，以其彙，貞吉，亨","六二。包承，小人吉，大人否亨","六三。包羞","九四。有命，無咎。疇離祉","九五。休否，大人吉。其亡其亡，繫於苞桑","上九。傾否，先否，後喜","同人於野，亨。利涉大川，利君子貞","初九。同人於門，無咎","六二。同人於宗，吝","九三。伏戎於莽，升其高陵，三歲不興","九四。乘其墉，弗克攻，吉","九五。同人先號咷而後笑。大師克相遇","上九。同人於郊，無悔","元、亨","初九。無交，害。匪，咎。艱則無咎","九二。大車以載，有攸往，無咎","九三。公用亨於天子。小人弗克","九四。匪其彭，無咎","六五。厥孚交如威如，吉","上九。自天祐之，吉，無不利","亨。君子有終","初六。謙謙。君子用涉大川，吉","六二。鳴謙，貞吉","九三。勞謙，君子有終，吉","六四。無不利，撝謙","六五。不富以其鄰，利用侵伐，無不利","上六。鳴謙，利用行師，征邑國","利建侯、行師","初六。鳴豫，兇","六二。介於石，不終日。貞吉","六三。盱豫，悔，遲，有悔","九四。由豫，大有得，勿疑。朋盍簪","六五。貞疾，恆不死","上六。冥豫。成有渝，無咎","元、亨、利、貞。無咎","初九。官有渝，貞，吉。出門交，有功","六二。繫小子，失丈夫","六三。繫丈夫，失小子。隨有求，得。利居貞","九四。隨有獲，貞兇。有孚在道，以明，何咎","九五。孚於嘉，吉","上六。拘繫之，乃從維之。王用亨於西山","元、亨。利涉大川。先甲三日，後甲三日","初六。幹父之蠱，有子考，無咎。厲，終吉","九二。幹母之蠱，不可貞","九三。幹父之蠱，小有悔，無大咎","六四。裕父之蠱，往見吝","六五。幹父之蠱，用譽","上九。不事王侯。高尚其事","元、亨、利、貞。至於八月，有兇","初九。鹹臨，貞，吉","九二。鹹臨，吉，無不利","六三。甘臨，無攸利。既憂之，無咎","六四。至臨，無咎","六五。知臨，大君之宜，吉","上六。敦臨，吉，無咎","盥而不薦，有孚顒若","初六。童觀，小人無咎，君子吝","六二。闚觀，利女貞","六三。觀我生，進退","六四。觀國之光，利用賓於王","九五。觀我生，君子無咎","上九。觀其生，君子無咎","亨。利用獄","初九。屨校滅趾，無咎","六二。噬膚滅鼻，無咎","六三。噬臘肉，遇毒。小吝，無咎","九四。噬乾胏，得金矢。利艱貞，吉","六五。噬乾肉，得黃金。貞厲，無咎","上九。何校滅耳，兇","亨。小利有攸往","初九。賁其趾，捨車而徒","六二。賁其須","九三。賁如濡如。永貞吉","六四。賁如皤如。白馬翰如。匪寇，婚媾","六五。賁於丘園，束帛戔戔。吝，終吉","上九。白賁，無咎","不利有攸往","初六。剝床以足。蔑貞，兇","六二。剝床以辨，蔑貞，兇","六三。剝之，無咎","六四。剝床以膚，兇","六五。貫魚以宮人寵，無不利","上九。碩果不食。君子得輿，小人剝廬","亨。出入無疾。朋來無咎。反復其道，七日來復。利有攸往","初九。不遠復，無祇悔，元吉","六二。休復，吉","六三。頻復，厲，無咎","六四。中行獨復","六五。敦復，無悔","上六。迷復，兇，有災眚。用行師，終有大敗。以其國君兇，至於十年不克征","元、亨、利、貞。其匪正，有眚，不利有攸往","初九。無妄往，吉","六二。不耕，獲；不菑，畲。則利有攸往","六三。無妄之災。或繫之牛，行人之得，邑人之災","九四。可貞，無咎","九五。無妄之疾，勿藥有喜","上九。無妄，行有眚，無攸利","利、貞。不家食，吉。利涉大川","初九。有厲，利已","九二。輿說輹","九三。良馬逐。利艱貞。曰閑輿衛。利有攸往","六四。童牛之牿，元吉","六五。豮豕之牙。吉","上九。何天之衢。亨","貞、吉。觀頤，自求口實","初九。捨爾靈龜，觀我朵頤，兇","六二。顛頤，拂經，於丘頤。征，兇","六三。拂頤，貞兇。十年勿用，無攸往","六四。顛頤，吉。虎視眈眈，其欲逐逐，無咎","六五。拂經，居，貞吉。不可涉大川","上九。由頤，厲，吉。利涉大川","棟橈。利有攸往，亨","初六。藉用
