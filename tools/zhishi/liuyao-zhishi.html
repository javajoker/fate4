好鋼用在刀刃上","一個地方不容留，也會在別處找到合適的發展空間","毅然決然地行動，才能創造雷厲風行的局面","堅守正道，義無反顧，讓瞬間的光芒成為永恆","做盡人力，把結果交給天命，心無遺憾"]),si=Object.freeze(["當你站在皓日當空、驕陽似火的天地之間，你便融入了一個完整且自給自足的體系；在這個體系中，你深刻體會到知行合一，使得你內外一致、和諧通達。你用這種狀態來指導自己的行為，反應敏捷，一切都變得一目了然，你能夠迅速果斷地解決問題。你明白該做什麼、不該做什麼，行事端方正直。","當你像新生嬰兒一樣觸摸這個世界時，你會努力認清自己，同時面對陌生環境時懂得自我保護。你在悄悄地積蓄力量，為未來的挑戰做好準備。","當你不必為了保持低調而特意隱藏自己的存在時，你就能自由地活動。就算有人注意到你，也無妨，因為你已經做好了與外界打交道的準備。","雖然你已經足夠優秀，但你不會因此自滿。你會分清朋友與對手，因為外部環境瞬息萬變，如果你不不斷進步，就會被淘汰。因此你每天都努力不懈，夜晚仍保持警惕，關起門來反復反省自己的得失。雖然過程艱辛，但你清楚這是必經的磨砺，只有這樣才能避免災難。","當你積累到足夠程度時，你就可以根據大勢隨意選擇發展策略；你進可攻敵、退可守敵，無論何種選擇，都不會有什麼災患。你好比一條神龍，脫離溫床後既可退居深淵，也可騰空飛起，隨時掌握主動。","當你保持內外一致、達到平衡和諧時，你就像飛龍在天，不斷自強不息，成為世人仰望的存在。就像太陽晝夜運行不息，你在顯露能力的同時，穩步取得成就。","當你站在山巔俯瞰世界，卻發現還有更高的目標遙不可及時，你會為最初目標的選擇感到後悔；這提醒你：凡事物極必反，切不可驕傲自滿。","當你像大地那樣包容萬物、處於完整閉環、自給自足的狀態時，你便領悟到知行合一，使你的內心與行動保持一致、和諧通達。你以此指導自己的行為，反應靈敏、洞察一切，能迅速果斷地解決問題。你清楚自己該做什麼、不該做什麼，於是默默為自己提供生存的土壤，行事如同溫順而強壯的母馬。起初你或許迷茫，但很快就會形成自己的主見；在西南方你抓住機會的同時，也會在東北方錯失機會。環境平靜安定時，你要保持專注，不要三心二意。","當你從無到有地建立事業時，你會遇到巨大的壓力。你會給自己做出正確定位，頂住壓力，利用壓力來錘煉自己，這樣才能迅速充實自己。","當你逐漸充實自己，你會越來越體現出純正不苟、整齊統一、包容萬物的品質。你會兼收並蓄，無所不包；在這樣的狀態下，你無需額外整改，因為已經沒有解決不了的問題。","當你面對外部競爭對手時，你會胸懷錦繡卻不輕易顯露，腳踏實地地積蓄力量。只有這樣才能保證自己在真正壯大之前不被吞噬；否則一旦過早暴露，你就會被捲入競爭，此時你要把穩腳下，腳踏實地地始終做到有始有終，而不是單純追求個人成功。","當你腳踏實地、行事中規中矩、滴水不漏時，你不會奢求額外回報，就像一個紮緊的口袋。這樣你不會被過多讚譽，但同樣也不會招來災禍。","當你量力而行，專注完成自己分內的事務時，你的謙遜會讓你功成不居，卻能營造出繁榮局面。你已完全適應環境，並進一步成為環境的基石，得到群眾的認同和習慣。這樣的狀態非常美好。","當你包容萬物包容到極致時，你可能會面臨失去繼續支撐的內部動力。你需要時刻警惕，防止滿足現狀而停滯不前。","當你像樹木發芽一樣，需要深紮根基才能茁壯成長時，你就融入了一個完整、自給自足的體系。你領悟到知行合一，使你的內外保持一致、和諧通達。你用這種狀態指導自己，反應迅速、洞察明晰，能快速斬斷紛亂。你知道什麼值得做、什麼該放棄，行事端方正直。如果雨水過多而你隨波逐流，你反而會像毀壞根基的樹木，根爛木枯。因此，你不能盲從大流，而是要先明確目標、有的放矢；如果暫未找到目標，就老老實實地在已有領域耕耘、建功立業。","當你像在堅硬山石上打洞立表柱一樣艱難地生發時，你需要找到最正確的位置並提前設定目標，這樣才能實現事半功倍。","當你白手起家時，你的發展會時好時壞，就像拉車的馬步調不一致，難以順利前行。開始階段因為經驗不足，你的決策和執行都需要不斷調整，此時你還要保持團隊團結，不被困難擊倒。這樣的情況下，你很容易動搖，甚至喪失前進動力，轉而尋求外部資源合作。但這樣一來，你就把主動權交出去，將來的發展將不再由自己掌控，也許要很長時間才能實現你的規劃。","當外部世界的繁華吸引你，而你仍處在初創階段的艱苦之中時，你就要更清楚地認識自己，量力而為，不要被貌似美好的目標所迷惑。你應該先做自己能夠完成的事情，就像沒有嚮導獨自進入山林打獵一樣：即使你多次差點抓到獵物，卻都讓它溜走，越深入愈容易迷失。此時，與其深陷歧途，不如放棄這個目標，重新評估自己的方向。","雖然起步階段充滿磕磕絆絆，但你已經成長為可以自給自足的個體。因為你是新的生機，蘊含著無限潛力。這時你可以尋求合作，實現雙贏：你與他人各取所需，互補優勢。只要你堅持下去，就會收穫良好結果。","在起步階段，你要以積累資源、聚集力量為主。現有的力量足以實現一些小目標，但尚不足以完成大目標；如果你強行去做力不從心的事，結果往往會適得其反，將自己推入危險境地。","當你察覺發展已到瓶頸時，你必須尋求轉變，但新的方向太多，令你難以抉擇；當意見分歧，就像拉車的馬步調不一致，你會在進退之間動搖；最終你可能因為無聲痛哭而各奔東西，各自追尋理想。","當你決定去啟蒙他人時，你就像草木在光禿的泥土上生長，不是因為草木生發吸引水，而是因為雨水滲入泥土才使草木生長。但水不能過多，否則草木會爛根、田土泥濘。要避免跟風盲從，你要先找到明確目標、有的放矢；若暫時沒有目標，就腳踏實地地工作、積累功業。","你讓萬物蓬勃生長，並把這種繁榮推廣出去，這樣你才能看到草木茂盛。當你穩住腳跟，就能進一步吸納同行資源，引導市場進入良性循環。你要以自己的經驗為基礎，將「刑罰」作為工具來警示和約束那些尚在蒙昧中的人，這樣可以事半功倍。真正的目的，是要讓他們不要犯錯，少走彎路，從而免於受到刑罰和拘留。但是你要牢記，刑罰只是手段，而非最終目的；如果你長期以高壓手段壓制他們，反而會引發反抗，使局面更加艱難。","在你進行啟蒙的過程中，要認識到每個人的素質不同，接受新事物的速度也各異，因此你需要懷著包容之心對待他們。你要明確，包容這些尚在蒙昧的人，是為了讓他們學習知識，將來能夠幫助你，甚至解放自己，接替你的工作。就像新媳婦出嫁，標誌著孩子已經成人，可以成家立業了。","在啟蒙的過程中，你必須考察每個人的心性，並優先選擇那些信念堅定、有自己主張的人。比如，你絕不能娶那種一見到有錢有勢的男人就動搖的人；娶這樣的人對你沒有任何好處。","你要認識到，大眾大多數時候都處於蒙昧之中，缺乏深思熟慮；他們的無知會帶來無法預料的後果。無知就是最大的困境。","當你在荒山上見到草木生長、欣欣向榮時，你會看到生機盎然的景象，這預示著下一步的良好發展。","當你徹底消除蒙昧、打破無知時，你就可以考慮下一步的發展計劃。你尚未擁有占領新資源或市場的能力，但你已有足夠實力守護現有事業，不會有什麼災患。","埋在土裡的珍寶總是會發光的，只需要一場大雨沖刷。當水沖洗掉珍寶上所有的污漬時，珍寶就會煥然一新、光彩照人。此刻你的行事秉持正道，你可以放心地走向更廣闊的天地，勇敢去闖蕩。","當你看到草木欣欣向榮時，你要懂得維持當下的狀態並提前做好準備來應對可能的風雨，以便將被動化為主動，將險境化為平安。","當你進行基礎建設時，就像沙子如果得到足夠的雨水才能變成肥沃的土壤一樣。你要善用雨水資源，改造薄弱環節。雖然初期可能看不出明顯效果，甚至會受到他人指責，但只要雨水充沛，沙土最終會變成沃田，這就是好事。","在競爭過程中，為自己保留退路是至關重要的。否則，當你像待在泥地裡，雨水將泥土化為沼澤時，你就會陷入困境，容易被「吃小魚的大魚」吞噬，因為你的軟弱就招來了侵犯。","當你經歷風雨錘煉，從競爭對手中殺出一條血路時，你會真正擺脫小圈子，全面成長起來。","當你站穩腳跟並持續受益時，你可以放鬆身心、靜待新機，只要你保持內心正直安定，一切都會好起來。","當雨下得越來越大，而你早已做好周全準備回到自己的家中安心避雨，你會看到外面雨水淹沒他人，卻有人不請自來求你避雨；此時你要熱情接待，學習外來者的經驗並分享機會；只要你有所得，這就是好事。","在爭論時，你要堅持自己的觀點，壓抑內心恐懼，這樣事情才會迎刃而解；但如果你窮追猛打，可能會破壞外部環境，這是不智之舉。你應該在爭論過程中保留餘地，當需要時請能力者幫助你，因為一人孤軍奮戰往往難成大事。","當你守成有餘時，你就必須尋求進一步發展；畢竟「進則無不勝，退則無不敗」。若周圍環境都在發展，而你原地踏步，就等同於退步。你要爭取更多資源，推進事業。發展的過程必然伴隨方向之爭和資源之戰，但你切記不要動武或過度爭執，因為最終仍會迎來好結果。","當你與對手爭論到最後卻無法說服彼此時，就會出現分裂。到那時，你不如離開原來的龐大聯盟，去一個小環境驗證自己的想法。那裡你可以自由發揮，不再受到束縛。","你一旦在前後發展上保持一致、內心正直安定，就會利用競爭對手的壓力查漏補缺，最終獲得好結果。你可能會尋求靠山，與夥伴一起奮鬥，但若總是爭吵，也難以取得真正成就。","如果你在爭訟中無法獲勝，就要回頭服從正理，順其自然、安於正道；退一步仍然寬廣，這是明智之選。","當你用辯論讓思路越發清晰時，這本身就是好事，說明你的理路正在明朗。","你若為爭而鬥，易「爭火」引發更大紛爭；即使你憑藉正確立場得到上位者的支持與提升，但爭訟本身會造成內部和市場的混亂，破壞和平安定。若為平息民憤而退讓，反倒會讓你處於不利境地，甚至更加不如。","領軍打仗。當你帶領軍隊時，使用老成持重的將領更為穩妥，這樣勝算更大，失誤更少。","隨著你事業發展壯大，對資源的需求也會更高。大家都在爭奪資源，就會產生激烈競爭。如果你在競爭時能嚴格自律，上下齊心，那麼就能做到物盡其用、持續發展；否則，若紀律鬆懈，就可能因內部分裂或資源爭奪失敗而陷入兇險；過度壓榨也會招來群眾的反抗。","作為軍中統帥，你要坐鎮指揮、知人善用，而非凡事親力親為；只有這樣才能避免災患，這也與你的定位高度契合。","在同外部競爭時，你必須先評估競爭對手的實力；若不了解對方力量對比就貿然對抗，就會付出巨大代價。就像軍隊出征但載屍而歸，這樣的結局極為兇險。","當你決定從競爭轉向合作時，你會就地往左方駐紮，占據對方右軍的有利防守位置；只要你不輕舉妄動，就不會有什麼災患。","在競爭過程中，你要兼顧內外平衡、兼收並蓄；就如同田獵時，當你發現獵物，全隊上下齊心協力，你會馬上提出並採納良策，這樣就能迅速制服獵物，不會有什麼問題。另一方面，在激烈競爭中，應該由有經驗、有能力的人主導；若經驗不足之輩掌舵，往往代價慘重，這與信念無關，只是個人能力所限，極具兇險。","當你贏得一場戰爭，你會按功行賞——或裂土封侯，或分封大夫。但如果你只會賞人卻不用人，就會打亂內部秩序。","當你保持恆久的堅貞時，就像江河奔騰，礁石被水沖刷，動盪不安；你若因動盪而動搖、隨波逐流，最終會陷入更不利的處境。","當你手握充足資源時，要穩固自身、按計劃一步步發展，不要隨大流；你要相信自己，一步一個腳印，就像給罐子慢慢注滿水，最終必能達到目標，這是真正的好運氣。","當你自內而外地求同存異、保持自我正直安定時，你就處於極佳狀態，這將助你在紛雜環境中保持清醒。","在外部，潛在的競爭對手無處不在；你要明確：穩固自身依靠的是你自己，不能把希望寄託於外部，否則就可能遇到不值得信賴的人。","只要你動機純正並保持內心正直安定，前路就會明朗，結果必是向好的方向發展。","當你按計劃一步步實現目標時，你不會拒絕來者，也不會追逐去者；你寬宏無私，得到群眾的認可，他們甚至見到逃去的獵物也不會報警。如此和諧無間，正是你追求的理想局面。","當你的計劃達到極致，卻突然看不到新的方向時，會引起人心的困惑，這是極其兇險的。你要預見到這一陷阱，提前做好調整。","當環境生成的水汽蒸騰成雲，但積蓄尚嫌不足而無法化雨時，你要繼續沉澱、積累，直到條件成熟為止。","當你達成一個目標後，需要停下來好好休息、總結與反思，為下一輪突破做準備。你要反思：我在哪裡做得不好？哪裡犯了錯？只有這樣，才能不斷進步。","不僅你自己要反思，也要引導團隊一起反思。你的主動引導會帶來積極成果，整個團隊會因此更加團結進取。","當你決定休整，但與外部環境發展的需求產生衝突時，你要認識到兩者本該相輔相成，卻因為立場不同而爆發矛盾，就像夫妻反目。此時你需要果斷取捨，否則反而自陷煩惱。","當你已經做了充分總結、明了得失之時，你對過去付出的代價會保持警惕，這能確保你將來不會重蹈覆轍。","如果你做到內外一體，並以誠信之心與同行相互扶持，就會形成一損俱損、一榮俱榮的局面。你要記住：你的財富實際上來自他人的支持與幫助。","當你積累達到「飽和」狀態卻不再行動時，這不僅無益，反而浪費；就像水位一路上漲卻毫無行動，當你過於溫馴卻不採取對策，多餘的雨水終會漫溢；尤其在快到團圓時節，如果此時你離家遠行，便是極其危險的選擇。","當你放心去執行計劃，不再猶豫時，你就會順利完成任務，無需擔心災害。","當你已有所成就，就可以用剩餘的時間做自己真正想做的事情；你無需顧慮，坦然從容地去實踐。憑藉先前的成果支持，無論發生什麼，你都不會遭災。","因為你已有相當積累，繼續簡簡單單地執行下去時，你的道路會越來越平穩寬闊。此時你要注意保持心態純正、執著、低調，不被世俗干擾，這就如同「隱士」保持內心正直安定，是你持續安穩的秘訣。","當你謹記初衷，只想簡單地把事情做好時，外界競爭者或會虎視眈眈，但你不能強行去做超出自身能力的事情；就像一個嚴重失明的人只能模糊識物，或一個瘸腿者能行走卻始終不穩；若你不小心踩到老虎尾巴，就會自食惡果。以人事為例，就宛如武人擁兵自愛、心懷不軌，最終將面臨滅頂之災。","當你尾隨強者而不被察覺時，只要你保持柔順、小心謹慎，就能夠避免傷害並施展抱負。最終，你會在更安全的狀態中實現目標。","無論遇到多大的困境，只要你堅決去實踐，即便動機純正，也會受到考驗和磨煉，這是你成長的必經之路。","當你簡簡單單地去執行任務時，你會獲得階段性成果；你會檢視所得，並根據經驗決定下一步發展，做到一邊執行、一邊規劃，使你的發展像螺旋上升般循序漸進、和諧順利。","當你投入少許努力卻獲得巨大成功時，那便是你努力得到的回報，無比欣慰。","當你像創新者初入市場時，資源就像初生的茅草，根系互相牽連。你拔起一根，就能連帶拔出許多。此時你要緊抓機會，爭取更多資源，以便在市場裡站穩腳跟。","在新興市場裡，你要放眼長遠，以包容之心去對待那些曾被視為荒廢的資源。時間就是最珍貴的財富，所以一旦決定，就要果斷執行。你要光明磊落、公正無私，即便取得成就，也別忘了曾經支持你卻漸漸疏遠的人，要一視同仁、不分親疏。你的中規中矩作風將贏得眾人尊崇。","當越來越多的競爭對手湧入新興市場時，你曾經走過的平坦大道會變得崎嶇難行。回歸正常的競爭環境，你要堅守內心正直安定，不因環境變化而動搖。即使環境艱難，只要你保持信念，就不會遭受災患。只要能獲得收益，就安心享受。","當你在新興市場中如魚得水般自由翱翔時，你並不一心只為財富，而是為了追尋夢想。財富會自然而然地追隨成功而來，你無需刻意追求。正如鄰里之間，大家以誠相待，講究信用，自然會相處和睦。","當你憑藉先入優勢獲得大量資源和收益後，你會漸漸處於市場高位。即便如此，你也要警惕自己，不可驕傲自滿。你要明辨大勢，提前佈局，並與後來者保持良好關係、學習分享。就像皇帝把女兒嫁出示好賜福，這樣才會營造和諧氛圍。","當更多競爭對手不斷進入市場時，你的先入優勢會逐步消失，如城牆倒塌於乾涸護城河一樣，你會回到原點。此刻，你若主動進攻，只會傷敵一千，自損八百。內部恐怕也難以適應後來勢力的趕超，許多人會因心理落差而提出種種要求。此時，你雖能保持內心正直安定，但面對來自內外的雙重壓力，仍會感覺難以招架。","當你為自己營造了良好外部環境，卻被人否定時，你要認清：從投入量來看，你付出很多卻只收穫很少。在這種情況下，你必須重新評估自己應得回報。","當越來越多的人進入新興市場時，原本零散的「茅草」會迅速繁衍成密不透風的「草海」，根系越發發達，連成一片；若想再拔起它們，就會變得越來越困難。你此時若貪多好高，就會敗走麥城，你要認清自身實力，把握自己能掌控的部分，避免一時野心煽動而導致整體失衡。只有這樣，這個有序的市場才能保持最優狀態，一切才會順暢。","當你作為後來者時，要先定位自己，以包容之心繼承前人留下的資源和經驗；適合從小規模起步，逐步拓展，這樣才會穩妥。因為各種限制和不暢，你不宜在此時做出過大投入。","當競爭對手異常強大，你難免會受到欺壓。此時你要調節心態，以包容之心去面對可能的侮辱，讓自己堅定如初。","當市場瀕臨飽和時，新入者成功與否大多依賴於時機和機遇；你應順應時機，這樣就不會有問題；作為弱勢群體，只有精誠團結、捆成一股繩，才能得到福祉，才能有所收穫。","當你站穩腳跟後，你會發現沒有永遠的敵人；當利益面前，對手會停止對你的排擠；對整個市場而言，這是好事。你要放下過去的痛苦與屈辱，甚至將對手轉化為朋友，如同桑樹一樣互相糾纏、共同成長。","當市場的大餅利益分配完畢後，人們即由競爭走向合作；封閉局面不再需要，緊接著就是互通有無、共謀發展，大家皆大歡喜。","當你把人從散亂的狀態凝聚到一致行動時，就會出現大好局面。大家齊心協力後，力量倍增，可以去大江大河闖蕩，有利於培養協作精神。","當你發現機會並準備實施時，有識之士自然會想參與。在啟動前，你要先做好詳細計劃，明確分工；只有這樣，才能避免事與願違。","當機會變成收益後，你若意圖將全部利益瓜分在自己手中，就會導致體制僵化，失去後續發展動力。一旦市場陷入瓶頸，無法突破時，就會變成災患。","當你發現自己無需直接作戰時，可以採用震懾策略，比如在草叢中暗設伏兵，占據高點以便預警；這樣對手摸不清你的真實實力，就難以大舉進攻，為你贏得寶貴時間。","當你已經強大到足以固守城牆時，對手若想再次進攻，也會因得不償失而退縮。於是你轉而尋求平衡與共同發展；這才是明智之舉。","當你與大家團結一致、齊心協力時，雖在求同存異上會付出不同代價，但最終形成的整體力量將極為巨大，能夠贏得更多利益。正如先苦後甜，一旦摒棄隔閡，猶如兩軍同營，所向披靡。","當你的陣容聚集到一定規模、力量積累到一定程度時，就應集合眾人一同開拓新領域。你要勇敢邁出那一步，不要留下遺憾。","你要承擔起保佑和護佑的責任，形成一個完整閉環的邏輯：內外一致，和諧亨通。","當你與他人分享或共事時，也要默默地支持和庇佑他們。但是在實際操作中，你仍然要保持溝通。如果你溝通不暢，反而會成為妨礙。不管你的出發點是什麼，都不能採取不當行為，否則必將招致災患。遇到困難時，你不要氣餒，因為這反而會讓大家更加團結，從而避免災患發生。","當你受到護佑時，就像被安置在大車中運送，貨物不會散落損毀；你可以心無旁騖地朝既定方向前進，不必擔憂，將無大患。","當你受到護佑時，你就會無往不利。猶如公侯之行，無論行止何地皆能順暢，因為你得到天子的庇護。然而，對那些小人而言，這種護佑非但無法承受，往往會被其用來行惡，帶來更大破壞。","當你深知盛極必衰時，你就會保持低調，繼續沉默接受護佑，就像抑制住響亮的鼓聲一樣。如此，你才能避免招惹禍患。","當你在上下之間以誠信相交時，上位者以誠信待下，下位者也以誠信回報，這種交互雙向的信任關係非常美好。","當上下同心、誠信相交時，這樣的完美和諧關係會讓你清楚地看見共同成就的前景。只要不出意外，你定能大成，甚至得到上天的庇佑，無往不利。","當你保持謙和的心態，你的真誠與勤奮終將為你贏得支持，並使你獲得成功。","當你即使取得成就也保持謙遜時，你仍有追求但絕不自滿；在外闖蕩時持續以這種謙遜態度待人，這總是一個好的選擇。","當你身邊的人見到你的謙遜，也會自然受到感染和影響，這樣你會更加受人尊敬。","當你既謙虛又勤勞時，你必能成就大業；這種心態會帶來良好結果。","當你充分發揮謙虛的美德時，你會贏得無數人敬佩，因此一切都將無往不利。","當你不依靠財富，仍能獲得鄰里幫助時，這說明你的能力和謙遜贏得了信任；若你提出擴張的需求，也會得到廣泛支持，因為大家都信任你。這樣的局面定會無往不利。","當你將謙遜發展到極致時，你會獲得天下人的景仰；然後你以大義之名征討，他人私有的領地也可納入囊中，沒有人會反對。這將是一片祥和。","當你萬事俱備、毋懼外界干擾時，你就可以大膽開闢戰場、建功立業。","如果你從未行差踏錯，你的成就必定非凡，對任何人來說都如大象般不可動搖；但在達到這一巔峰時，你要警惕自己不能過於得意；就像大象在領地中得意鳴叫，往往會為未來潛藏風險。","當你成為龐然大物時，選擇新的發展方向更需謹慎，因為並非所有環境都能承載一個「大象」的基本需求。由於體型龐大，你可能踩塌道路或困於山石；但大象身強力壯，只要你付出時間和精力，就能脫困。你要多方面嘗試，保持心中正直安定，最終必有好結果。","當你仔細觀察競爭對手的反應時，一旦發現自己出現問題，你要立刻悔改；因為你的體型龐大而反應不夠迅速，若你遲遲不改，就真的會後悔莫及。","當你以一個強大的主體進入市場時，你會帶來巨大的收益，這是毋庸置疑的。與此同時，你會吸引更多合作夥伴，進一步帶動市場繁榮，形成良性循環。","即便你因病需休整，只要你已有雄厚積累，依舊能夠逐漸恢復，或者依靠長久支持而不會滅亡。","當你發展到極點、失去前行動力時，你可能會渾渾噩噩、整日沉迷享樂；這就很危險。但如果你因遇到挫折而暫時停步，也不見得是壞事；只要你及時調整，就不會有什麼災患。","當你占據主導位置時，要隨時關注外部環境的變化並進行調整。你所處體系自成閉環，你能夠做到知行合一、內外一致、和諧通達，你用此指引行為、迅速反應、洞見一切，並果斷地斬斷紛亂。你知道該做什麼、不該做什麼，因此行事端方正直。這種狀態下，無論外部如何，都不會有什麼災禍纏身。","當你成功創業後，如果想要守住已有事業，就要面對各種依附而來的人。他們可能因私利、貪婪而導致藏污納垢。正如「水至清則無魚」，你需要兼收並蓄，同時保持內心正直安定，才能使事業持續向好發展。你要如何兼收並蓄？答案就是走出去，與外界溝通，破除私見，聯結大眾利益。這樣才能使你的事業獲得長線支持。","在聽取眾人意見時，你會發現兩種最尖銳的理念衝突：年輕人的激進主義和中老年人的保守主義。你必須有所取捨。在進行內部建設時，你要去粗取精、完善自我。等你做好充分準備後，就要採取激進果敢的手段，迅速處理問題，如同「快刀斬亂麻」，才能一舉突破僵局。","當內部建設已經完善、對外一致時，你便可以穩紮穩打，避免因衝動而付出不必要的代價。你要先弄清自己真正想要什麼，再在有經驗和有能力的人指導下，逐步落實對外策略，才能獲得收穫，這種方式最利於穩紮穩打。","當你盲目聽從他人時，即便你從中獲益，也可能在不知不覺中偏離正軌，最終得不償失。即使你內心正直安定，但如果你在跟隨過程中沒有明確目標，也沒能對方向做出甄別，就可能被錯誤路線牽著走。相反，如果你在任何跟隨的過程中都始終保持目標導向，借勢而行，就不會有什麼問題。","當你以真誠信念去追隨並相互扶持時，你就會和夥伴一起創造美好的局面。","當你的隨和達到極致時，人際關係就會達到巔峰，變得牢不可破。正如你被「綁」在一起，彼此糾纏，內外合一。你這樣穩固關係，是因為你付出了真心，正如人們在西山誠心祭祀上天，終將得到天賜福。這種狀態，能讓你無往不利。","當你像沃土養育世間萬物那樣建立一個完整的生態系統時，一切都生生不息、和諧亨通。你可以帶兄弟們走出去闖蕩，增長見識，但你要記得不要破壞生態平衡，否則也會傷害自己。你要有意識地調整外部因素，讓環境為你所用。","當你意識到自己的學識有限、家大業大時，就要謙遜地兼聽各方意見。在發展過程中，你需要外界幫忙指出你的「蠱惑」與錯誤。這些人可以是思想銳意革新的年輕人，也可以是經驗豐富的長輩。多聽他們的建議，必然對你有所裨益。正所謂「忠言逆耳」，雖然聽起來刺耳，卻往往能成就大事。","就像用企業文化作比，在內部事務處理上，體現的是公司的文化氛圍。下屬需主動適應企業文化，而不是企業被動迎合下屬。無論對錯，也不應由下屬改變，因為那會削弱你對企業文化的掌控。猶如家庭中，女主內只需以「母親」身份治家，把家務井井有條，而非依賴其他人來迎合小孩的喜好。","在競爭過程中，你難免會犯錯。只有通過實際行動去驗證你的決策是否正確，真實地承擔相應後果，才能從失敗中學到寶貴經驗。即便過程中會有些惋惜，但只要你及時「亡羊補牢」，從錯誤中吸取教訓，就不會招致大災大難。","然而，在合作中，如果你對他人的錯誤一味包容、不加督促，時間一久，勢必積重難返，導致團隊陷入被動、難以突破。","當你委任那些備受讚譽的賢能之人時，他們會用自己的經驗和智慧幫助你糾正錯誤，讓你避免走彎路。","當錯誤得到徹底糾正後，如果你不再派這些賢才任何角色，他們可能會選擇離開，留下你獨自面對前路。此時，你留下的只有過去的成果與美名，或許會被人傳頌，甚至神話化，但你也會因此失去珍貴助力。","當你自上而下始終保持監督與考察時，你就建立了一個完整閉環的體系。你做到知行合一、內外一致，使得和諧亨通成為可能。你據此指導自己的行動，反應敏捷、一目了然，能夠快速斬斷紛亂，知道該做什麼、不該做什麼，行事端方正直。若下屬成長得比你快，而你卻仍想牢牢掌握控制，這樣就會埋下極大的兇險。","當你以潛移默化的方式去教育和感化他人時，你可以更好地監督和領導。正確的督導方式終會換來明顯收穫。","同樣，在內部建設中，你要及時溝通、加強團結，使團隊成為一個堅不可摧的整體。這樣，無論面對怎樣的挑戰，都能無往不利。","當你面臨競爭對手時，要堅定立場，從自己的角度採取相應行動。你既不能為了顯示謙卑而過度自卑，也不可因為想顯得大度而過分慷慨；如果發生了偏差，你要趕快糾正，否則可能會招惹災難。在爭論時必要時請人幫忙，而不是孤身對抗。","在合作過程中，如果你要把督導之權交給最有能力、做得最好的人，就能最大程度避免問題的發生。","當你以智慧之心行使督導權時，你的目的在於教化他人，而非一手包辦。掌握督導之能，正是上位者應有的擔當。","當你的督導做到極致時，下屬都已成長為能獨立思考的人，你不必再指指點點，只需以柔順敦厚的態度旁觀。他們自會把事情辦好，這就非常棒，不會有什麼災難。基層組織和體制已穩固成熟。","當你把自己打理得乾淨利落時，你不需主動推銷自己。正如俗話所說「酒香不怕巷子深」，自然會有人主動前來尋求你的幫助。你只要保持客觀、溫和且心存感恩，就能在人們心中建立起信仰，贏得尊敬與仰慕。","當你在尋求機會時，你要高瞻遠矚，不要只看眼前，也不要像孩子般匆忙幼稚地判斷形勢。對於普通人，這或許不會帶來嚴重後果，但對於肩負重任的你來說，一旦決策不慎，可能會把所有人帶入艱難境地。","在內部建設時，你不需要每個下屬都清晰了解大局；基層真正重要的是做好自己分內的事。就如「女主內」之於家庭，基層只需專注自身職責，從而使整體運轉更順暢。","當你仔細觀察時，你會評估自己與生俱來的優勢與劣勢。若對手因自身弱勢而退卻，你應及時跟上，接過機會。","當你注意到行業中各方勢力分佈時，就能為自己選擇合適的陣營並為其盡力，這將助你快速找到立足點。","當你時時反省自己時，你就能不斷糾錯，避免災患。","如果你將觀察做到極致，通過觀察他人經歷、經驗，就能驗證自己的選擇並為自己做好預防，絕不會再招致災患。","當你發現自身的薄弱環節後，要及時補足，使知行合一、內外貫通。若涉及人事問題，若需運用「刑罰」，你就要做到有法可依、果斷斬斷亂麻。","與他人共事的時候，如果你發現有人拖後腿，你就要及時發生問題並小懲大戒，以起到提醒作用。就好比對輕微違法者只戴腳鐐，雖然限制了他們的活動，但不會引發更大災患。","當你借機壯大自己，就像大口吃肉一樣，或許吃相不雅，但只要你能消化和利用這些資源，就無可厚非。","當你進入一個新的資源環境，遇到從未經歷的挑戰時，可能會一時不適應並遭遇挫折。就像你嘗試吃一種腥臊味很重的臘肉，會覺得難以入口。但只要你調整應對方法，慢慢就會習慣，最終不會有什麼問題。","當你在艱苦環境中辛苦補給自己時，只要你保持內心正直安定，你就會獲得意想不到的收穫。就像啃骨頭時發現骨髓中夾著一枚金屬箭頭，意外之喜令人欣喜。","當你補給自己、積聚力量並在條件成熟時正常發揮時，你就會有所收穫。只要你保持內心正直安定、接受磨煉，就不會遇到大問題。","然而，如果你補給過度卻沒有及時消耗，必然會積累無用脂肪，成為負擔，好比背負沉重枷鎖，遮住耳朵，使你行走不便，接受信息也受阻。這種狀況非常危險。","當你在內外協同的基礎上適度修飾美化，你的事業會更加亨通。但切記：再多修飾也無法改變事物本質，你只能在小範圍內調整，無法擔當大任。","當你覺得該展示自己時，就該走出去，讓更多人看到你。不要為走出去而走出去，而是要享受外出的過程。就像不必總是乘車，只要你穿上一雙舒適的鞋，徒步也能領略沿途風光。你不必刻意壓抑自己的成就，要善待自己，讓自己感到舒服。","在進行內部建設時，領導者本身的提升同樣必不可少。就像整理下巴處的鬍鬚，需要隨著嘴巴的開合而動作，這象徵你要時刻關注「頭面」和「喉舌」的形象與表達。","當你不能過度要求自己時，就要學會保持狀態，這樣才能有足夠精力處理突發事件。只要你保持內心正直安定，就能實現長久發展。","當你保持低調、不事修飾時，卻騎著一匹白馬，並且把它裝扮得五彩斑斕、顯得神駿非凡，你就會讓人看到：你自身的價值不平凡。你要注重實用而非「面子」。好鋼要用在刀刃上；與他人競爭難免有摩擦，但你應尋求合作，如同婚嫁一般，方不至於落得慘敗。","當你不能過分追求外在光鮮，而應將精力更多地放在實事上時，就像你用極少絹帛裝點林園，示意已經到位；而真正需要關注的，是林園本身。雖然看似小氣，但你省下的財富卻能用來辦更重要的事情，這才是正確之舉。","當你的氣質與素養因長期培養而潛移默化地提升到一定高度時，你就無需任何外部修飾，舉手投足間自有風采。只要你保持這種狀態，不論外部如何，也不必擔心災患。","當你不隨波逐流、明確自己的目的時，你才能在各種誘惑中保持清醒，不被動搖。","當你知道萬物盛極必衰時，你會意識到根基的重要性，並持續維護內心的正直安定。就像你發現床腳正在剝離時，若不及時採取行動，床就會最終塌陷，帶來災禍。","當你發現中層開始出現問題、能力不足以支撐發展規劃時，你必須及時關注並進行調整。正如床板的剝離，若不馬上修補，床就無法繼續使用。","當你身處環境對你發展的條件日益不利時，你就要果斷脫離，而不能患得患失；這樣才能避免災患。","當整個環境已不再適合你生存發展時，就像床面已經掉塊，你再怎麼努力都無法繼續使用。此時你若仍死守，則為時已晚，處境兇險。","當你發現環境不適合你時，你需要制定目標並制定分階段計劃，自下而上地逐步改善環境，這樣才能做到無往不利。","當你已經腐化到極點，看到剩下的只有自己還在堅持但卻被同化感壓力時，你要果斷收馬，回到原點重新開始。否則，你就只能坐等資源耗盡，最終束手無策。","當你處於自己的主場時，只要你能來去自如、如魚得水，就會吸引更多合作夥伴前來與你並肩作戰，你就不會遭受災患。大家一起把分工做好，形成循環往復的良性機制。","當你重返發展軌道時，要在統一的環境裡多方面嘗試，但對於尚不了解的事物，你不要走太遠，要及時回來總結經驗。哪怕走錯也無妨，只要及時修正，一切都會好起來。多方面嘗試能開闊眼界，讓思路更全面，這是好事。","當你滿載而歸時，整個團隊都會因你的回歸而獲得提升，這是件值得慶賀的好事！","當你與競爭對手的交鋒頻繁進行，並在過程中不斷嘗試與修正錯誤，最終會讓你不斷回歸正道、磨砺自己，這樣就不會招來災患。","當你堅持走自己的道路時，一旦發現前路錯誤，就及時獨行返回。儘管你無法確定後路是否有利，但你展現出了一種堅定的信念。","當你勇於嘗試，即便失敗，你也會收穫大量經驗；至少年輕時嘗過試，就不會為「未嘗試」而後悔。","當你的前路陷入極度迷茫時，你可能會發現自己既無法前行，也無法後退；在這樣的情形下，你若仍執意前行，很容易遭遇重大失敗，甚至一敗塗地；想像如果一個上位者一意孤行，其結局也往往是覆亡，傷筋動骨，需要多年時間才能恢復，這種後果十分危險。","當你謹守自身原則、行事有理有據時，你就不必隨意行動；你要做到知行合一，使內心與行動保持一致、和諧通達；這樣的你反應敏捷、一切都變得一目了然，能快速斬斷紛亂，明辨何為可為、何為不可為，行事端方正直。如果你心中有偏見，這就像眼裡長了東西，一葉障目，無法看到全局；因此你要放下偏見，聽從正確的指導。","當你進行任何嘗試前，都要深思熟慮、周密計劃，而非「無腦」行事；只有這樣，你才會獲得良好的收穫。","當你不要對結果抱過高期待時，要腳踏實地地去實踐；就像不耕地就不會有收穫，不開墾土地就不會有斗量糧食；與其空想，不如現在就開始行動。","即便你一直行事中規中矩，也可能無緣無故招來災患；就像有人把牛拴在路邊，有人經過就將牛牽走，村民因此被連累要求賠償；在這種情況下，村民就會遭到無妄之災。","當你與外部合作時，只要你堅守正道，就不會有什麼災患。","當你行得正、坐得穩時，遇到意外災害也不必驚慌。就像你莫名其妙病倒時，不要胡亂用藥，要讓身體自然恢復，這樣就能渡過難關。","當你對任何機會都過分謹慎、以致無法及時把握時，就會顯得迂腐；一旦你行動時無法精準把握時機，也會徒增障礙。例如你在蒙蔽狀態下行動，很可能無所收穫，最終得不償失。","當你處於持續積累的過程中，你的反應會十分敏捷，一切會一目了然。你能夠迅速斬斷紛亂，明辨可為與不可為，並行事端方正直。你不依賴家庭，而是通過外部條件來豐富自己；如果時機成熟，你就可以「出山」一展拳腳。","當你探明方向後開始投入時，首先要經歷一個不見成效的積累階段，這段時間是你的「磨砺期」。你需要承受壓力，不要急於擴展，而應先停下來補充自身實力。","當你停下發展腳步、鞏固自身時，就算遭遇突發風浪也能經受住，就像在靜止狀態下大車車廂脫離車軸那一刻，由於不是在高速運動中，這一突發事故也不會造成重大損害。","當你逐漸積累資源時，也要培養駕馭資源的能力；就像駕馭奔馳的馬車一般，速度越快，駕馭就越難。你需要在艱苦環境中保持內心正直安定，並且訓練車夫和衛兵，這樣當關鍵時刻來臨時，大家都做好準備，行動才會更順暢。","在合作中，當你需要對他人加以約束，就像馴化小牛時在牛角上綁一根橫木一樣；經過馴化後，小牛便會順從地為你所用，這正是你要追求的局面。","當你閹割野豬後，它的獠牙退化、失去攻擊性，隨即長脂肪，轉變為你積累的力量；此時退化的獠牙不再傷人，你就可以把它納入麾下，這種兼收並蓄的做法是非常明智的。","當資源積累到極限時，就如水滿即溢，積蓄的勢能會直接衝破困境而爆發；與其讓這股勢能無處輸導，不如為其開闢通路，讓其送到更廣闊天地，這樣你就會亨通順利。","當你在保養團隊和支持他人時，你的行動會高度敏捷，能夠快速看清形勢並果斷處置；你能迅速斬斷紛亂，明辨可為與不可為，行事端方正直。你時刻以他人下巴的保養狀態作為參考，但你自己的養護依然要靠自己。","當你擁有足夠資源時，你就要先讓自己消化這些資源。因為每個人的情況不同，保養的方法、效果與時機也各異；你要在了解自己的情況下，結合思考來設計最適合自己的保養方案。別人能吃的，並不代表你也能照搬；倘若你盲目仿效，投入大量卻一無所獲，必將陷入危險。","你要建立一套自下而上的金字塔式結構，這才是真正穩固自身發展的方式。你絕不能弄錯保養的先後順序，否則就會違背常理；若基層無力而形成倒金字塔式結構，就會導致澀阻不前；此時你要重新調整結構，暫時不要再盲目擴張，否則將面臨嚴重兇險。","當競爭無處不在，持續發生時，你會發現很難維持「保養之道」；因為環境艱難，即便你能保持內心正直安定，也可能招致意料之外的危險；競爭的本質在於長期投入過程，讓主體很難得到足夠的滋養，從而削弱整體發展潛力。","當你主動提出讓大眾、群眾提供支持與供養，以維持整個市場的發展時，這是可取的。只要你保持威嚴與睿智、恪守原則，就不會有問題。因為所取之於民，就應當用之於民。","當現實狀況是你只能保養自己、無法顧及群眾時，這便違背了自然法則。你無法因心急而強行索取，當下你唯一能做的是穩固自身，安身立命，保持內心正直安定，待自己能力足夠後，再逐步實現更龐大的目標。此時，你不能急躁，否則會陷入危機。","當供養達到極限時，全天下群雄都倚賴你的供養而得以安居樂業，這對你來說既是壓力，也是磨砺。儘管如此，被供養者是獲益者；只要你保持內心正直安定，這將為你帶來良機，有利於借勢前行、開拓新局。","當你感覺壓力實在過大，就好比棟樑被壓彎時，你必須與團隊同心協力，共同化解危機；否則你將因單打獨鬥而被壓垮。","當你發現僅靠計劃已無法應對突發變數時，你需要準備充足資源作底氣，這樣才能隨時應對競爭壓力與突發事件，降低失誤風險。","當你獲得充足資源注入時，你就會煥發新的生機；就像枯萎的楊柳重新抽出嫩芽。因為壓力讓你保持低調謹慎，你更懂得團隊協作，所做之事必將得到良好效果。正如老翁迎娶妙齡新婦，所結之緣雖違俗念，但若講求心靈契合，終將有福。","當外部壓力驟增、超出自身能力時，就像房屋棟樑被壓彎，此刻處境極度危險。若不及時自省、調整，將難逃一劫。","當你具備棟樑之材卻因能力有限，就像一根向上彎曲的橫樑，雖然還可支撐房子，卻無法抵禦橫向壓力。雖保有基礎功能，但只要外力稍大，就會「斷裂」。","當你能力不足時，你更應腳踏實地鍛練自己；否則，即使擁有充分資源，你也難以持久保持成就。就像一棵殘花驟開，看似美麗卻不長久；若在蓋房時選用這樣的梁，房屋終難穩固。正如弱女子娶強夫，此事雖有緣分，但根本矛盾仍在，不會被外界讚譽。最關鍵的，是你需保持自身與環境的相互認可。","當壓力遠超你的承受極限時，就像強行涉水卻能力不足，終被水淹沒，這是極度危險的處境。但知難而上卻仍無可厚非，至少你無懼挑戰，這一點可以理解。","當你陷入重重陷阱卻又顯露出水性崇高時，你就如水一般既能容納萬物，又能隨心而動。你要保持本心，堅持立場。水行自上而下，雖看似隨性，但卻有跡可循。這種柔韌而有力量的特質，會讓你無往不利。","在任何時候，你總會遇到困難，但遇到困難時，你應保持冷靜，謹慎分析當下環境，一步步克服障礙。千萬不要盲目蠻幹，否則你可能會越陷越深，甚至招致無法挽回的災難。","當你面對危險的陷阱時，要先正好心態。任何小小的收穫都應被你視為勝利。哪怕是微不足道的勝利，也能為你積累信心，帶來進步。","當環境惡劣得像深陷陷坑之中，危機四伏時，你要盡量保持靜止，避免輕舉妄動。稍有不慎，便會被困得更深。","當你陷入重重困難，無法顧及禮儀與外表時，你要與夥伴同舟共濟，不必拘泥形式。想像這樣一幕：幾個關鍵人物被困於一處，只有一壺酒、兩籃吃食，他們只能用普通瓦罐分著吃。若有人要喝，只需喊一聲，酒食便會從窗口遞來。在困境面前，你們同舟共濟，攜手度過，便可避免災禍。","當你決意「移山填海」去填滿陷坑時，有時小丘尚未推平，你已揮鏟而去；無論如何，此行動是你自救的一次嘗試，只要能保護自身，不會有什麼大問題。","當你困境重重，卻仍能到達「巔峰」時，就像你被牢牢縛在荊棘叢中，動彈不得。如果你在此狀態足足三年都無法逃脫，那將極其兇險。","當你陷入重重困境，又想靠外部力量脫身時，你要行事果斷，堅持正道，使自己內外一致、和諧通達；同時保持心中柔順、勤勉堅持，就像一頭母牛一般，不斷積蓄力氣才能等待良機。時刻保持警醒，既是自保之選，也會帶來意外收穫。","你要記住「失敗是成功之母」，從眾多先例中汲取靈感，不論結果如何，都要秉持敬意、虛心分析。你越尊重歷史案例，就越少犯同樣錯誤，越能走向成功之路。","當你坐鎮中央之地、內外一致時，就會營造一派和諧景象，整個局面皆大歡喜。","當你的內外環境涇渭分明時，你就能把握機會，發現美好。如同面對夕陽，你可以樂觀地吟唱「夕陽無限好」；但若沉浸在「風燭殘年、自怨自艾」的悲鳴之中，那種心態必將帶來越來越多的兇險。你的樂觀會指引你走向光明，而悲觀只會讓你陷入泥沼。","當你始終堅決地堅持自我時，一旦遇到矛盾，就可能發生衝突，甚至破壞整個環境。就像突如其來的一場大火，來勢兇猛、難以預測。你會驚慌失措、心急如焚，卻往往無能為力；一旦失控，你就會陷入毀滅性打擊。","當局面分崩離析時，你會流下傷心淚水，憂傷嘆息。但既然事已至此，你就要接受現實、吸取教訓，因為這也是「破而後立」的契機。從這個角度看，儘管過程痛苦，但卻是成長必經之路。","當合作徹底破裂時，為避免自己成為競爭對手，你就會主動出手攻占對方，廢除其決策者，將對方的優質資源納入麾下。此舉雖決絕，卻也能杜絕日後更大災患，讓你長久安寧。","當你與他人一拍即合，配合密切，就好比你娶媳婦一般。你內外一致、亨通無阻，行事果斷且始終保持正道，這樣你才能事半功倍，達到雙贏。","當你踏入未知領域時，你既要實踐，也要小心謹慎。很多問題未必能用眼前的經驗預知，就像你在渡溪時要先用腳趾試探湖底，方可決定是跨步還是後撤。只要你循序漸進，細心應對，就能安全抵達對岸。","當你感覺就像小腿突然被刺激一樣焦躁不安時，無論你如何急躁，都只是在浪費力氣。你應打好基礎，保持安靜積蓄能量。這樣一來，當面對未知環境時，即便條件不足，你也不會盲目出擊，以免造成無法預料的後果。","當你的「大腿」接收到刺激，一擺動就帶動你行動時，你要保持克制，不能盲目跟隨他人。你要根據外部環境隨機應變，朝最適合自己的方向穩步前進，才能避免陷入危境。","當你感應形勢而行動時，只要你內心正直安定，就會無往不利，即便身處困境，也不會讓他人的悲觀情緒左右你。但若你陷入迷茫，行動搖擺不定，就會拖累合作夥伴，讓大家也陷入悲觀。這正是你需要警惕之處。","當你始終把群眾的利益放在心上，為群眾付出而不求回報時，你就會贏得他們的信任與支持。然而，溝通並不總是雙向的；你若不主動傾聽群眾心聲，就無法順暢交流，最終可能只能單方面付出而得不到回應。","當你的「感應」達到極致時，你會傾向於通過心靈感應去處理本應口頭表達的事情，把簡單問題複雜化；這並不利於團隊合作，且會讓溝通變得曲折。","當一種做事方式既能讓你久享福、也無任何災患時，你就能夠帶領大家協同工作，共同進步。","當你的措施已經帶來了持續收益時，你需要關注「度」的把握。要與周圍反應保持同步，不能一味索取，否則即使策略正確，也會破壞環境平衡，無法獲得長久收益。","當你堅持走自己的道路時，只要你不動搖，就不會後悔。","當你在做事時需要持之以恆，而不是三天打魚、兩天曬網。即使你心中保持正直安定，但若因畏懼失敗而過分保守，你的事業也會陷入停滯窘境。唯有堅持到底，才能見到豐收果實。","當你無休止地對同一片田地進行狩獵而不顧傷害可持續發展時，你終將打光田裡的所有獵物，導致資源枯竭。你需要適當休整或另覓新市場，才能避免徹底走向衰敗。","當你堅持並持之以恆時，你便踐行了一種從頭到尾、一以貫之的原則。對於女性，這是持家之道；而對於男性來說，你要在保持正直安定的基礎上，結合瞬息萬變的環境，靈活修正行動方針；在完成一個目標後，要向更高層次、更廣闊領域進發；若偏安於現狀，遲早會耗盡資源，走向兇險。","當你追求恆久而不變時，一旦達到極致，就會發現世界沒有永恆不變的事物。維持恆定需要付出越來越大的代價，終將超出你的能力。到最後，你只能依靠外部救濟才能茍延殘喘，這將是極大的危險。","當你的能力已不足以維持現狀時，你就要暫時隱退，以免無謂消耗。只要你能保持內外亨通，不要猶豫不決，堅守內心正直安定，就能在困境中保全實力。","當你面對「無所謂」的競爭時，你可以選擇暫避鋒芒，不必硬拼。要果斷做出決定；若對手都離去而你還滯留，可能會成為眾矢之的。因此，退避時也要有長遠規劃。","當你退避時，要確保自身的資源和團隊保持穩定，就像用黃牛皮裹住骨頭，使它們無法輕易脫離；這能讓你在關鍵時刻保持團結。","當你選擇退避卻已投入大量資源時，你會很難放下，並因此難以前行，就像被疾病纏身般痛苦不堪。此時你要盡快放下所執，不斷提升自己；例如可以開始畜養僕人、侍妾等，為下一步反擊做準備。","當你在合適的時機採取恰當的退避策略時，你能退而不亂，保持內心正直安定，並最大限度保全實力，不錯過錘煉自我的機會。但對於那些退而不甘、墨守陳規偏安一隅的人，退避可能會使他們走向沉淪，這就不理想。","當你主動退避並保留實力時，你的價值與信念才能不被浪費。只要你保持內心正直安定，這就是值得讚許的選擇。","當你退避到最高境界時，你會審時度勢，在最合適時機主動隱退；你能帶走大量財富，這樣無往不利。","當你適時「急流勇退」時，你就能在新的環境中借勢增益、自身成長。你會行事果斷、內心堅定，這就是最佳時機，能使你更上一層樓。","當你主動出擊時，要確保全員統一步調、各方都跟上。若你誤以為自己腳力快而單槍匹馬衝鋒，必將陷入孤軍奮戰的危險境地，這一點你務必牢牢記住。","當你不斷增強自身、保持內心正直安定，就會一切順利，這才是成功之道。","在競爭環境下，你不能恃強好勝地硬拼，而應頂住壓力、靈活迂迴，逐步削弱對手；就像用撒網捕獵一樣，你要保持心中堅定，借助壓力磨砺自己；就像公羊用羊角撞破籬笆，你則用層層障礙制約對手，讓對方不得不被動應對。","當你的力量積聚到極致，先前的付出就迎來收穫，你曾經的悔恨紛紛隨之消逝；你可以一鼓作氣、一戰而勝，就像壯羊將籬笆撞散，將羊角脫牢；通過磨砺之後，你變得足夠強壯，事業得以穩健向前；就像大車與車輪的連接處是磨損最厲害的部位，只要這一環節足夠堅固，整輛車就能載重遠行。","當「羊兒衝出籬笆」後，不知所蹤時，你不必後悔。因為這意味著你當前所構築的籬笆無法再禁錮更強壯的對手。既然已發生，就當作教訓，借此提升自己，將來的「籬笆」就會足夠牢固；這就是「亡羊補牢」的智慧。","在競爭中，當你持續增強自身並達到極致時，終有一天你會脫出樊籠，就像那頭強壯的公羊經過堅持與磨砺，終於擺脫籬笆的束縛。這種突破本身對於你而言，是一件值得慶賀的好事。","當你善用良種好馬進行配種，就會不斷提高整個馬群的素質。每天都會有優秀品種小馬出生，這將為你帶來源源不斷的競爭力。","當機會來臨時，你要抓緊時機加快發展步伐。你要向前衝啊！但在衝刺的過程中，切記時刻牢記你心中所求，保持內心正直安定，這樣你就會收穫豐厚果實。即使外界對你的激進產生質疑，但只要結果足夠豐厚，質疑聲就會被你的成就化解。","在激進發展的過程中，你難免會擔憂，害怕後勁不足無法持續下去。此時，你要保持堅定的內心，結果就會證明你的選擇無誤。當你在快速擴張中仍保持正道時，為人處事的高層都會看到你的誠意，並願意為你提供大量支持。","當你努力進取、對誰都講究誠信時，你終會贏得競爭對手的尊重，從而不再對從前的失敗感到悔恨。","然而，當激進過度、後勁開始枯竭時，儘管你內心依舊堅定，但也會陷入艱苦境地，你要格外注意不要因急於求成而耗盡所有能量。","當你高速發展時，不可能事事俱全。即便一路沒有走彎路，你依舊會取得成就；這時你要不計較過去的得失，勇於向前看、順勢而逝，一切都會無往不利。","當你的快速發展走到極點時，你就像站上了動物角尖的位置，沒有半點回旋餘地。此時，內部的不穩和資源分配矛盾便會暴露，你不得不集中精力來解決內部紛爭；就像你得面對自己子民叛亂、需要出兵征伐，雖然危險重重，但只要你保持內心正直安定，最終會化險為夷。這是一次從內部湧現的問題，需要你注意不要因此前的激進讓團隊陷入艱難。","當你需要注意過度消耗資源時，你會發現自己往往行事果斷，但一直保持正道卻會非常吃力。","過分激進會造成不必要的損失。就像鳥兒飛得又高又遠，卻因過度疲勞最終無法再次振翅；又如你外出旅行時急於趕路，三天不吃飯，導致身體受損。此時，你應停下來補充能量，否則當你到達目的地時，反而成為別人的笑柄。","當你發展過快、身體支撐不住時，就像長途跋涉後肌肉拉傷一般，你就要學會提拔一批可靠幹員，讓他們分擔工作，這樣你才能繼續前行，成就更大事業。","當你通過投入大量資源參與競爭，將戰場推進到資源充足之地時，最終可能俘獲對手的首領，改變戰局。若以南方火焰戰區為例，只要你足夠壯大，就會像南部沙場一樣火力全開。只是你要注意不要操之過急，始終保持內心正直安定。","當你保持心中正直安定時，站在普通人的角度去理解他們對事物的看法，你就能清楚發現過度消耗帶來的傷害。於是你會放棄過度消耗的策略，及時離場，避免更大損失。","當你像箕子捨身傷己一般，為了讓自己堅定內心，你甘願承擔暫時的痛苦，只要這能幫助你保持正直安定，這種做法就是對的。","當你發光發熱到極致時，你的破壞力也到達極限，最終會像太陽一樣自行隕落，留下一片黑暗。就像太陽初升時照耀天地，但最終也難免墜入黃土。你要警惕過度消耗自己的能量，避免自取滅亡。","當你能夠快速反應、果斷行事，但始終保持內心柔弱以維護正道時，這樣的反應速度會讓你在複雜環境中游刃有餘，不會因為一時衝動而迷失方向。","當你在外奔波尋求發展時，一定要防範「後院失火」——家庭或團隊內部出現問題。無論你打算做什麼，都要得到家人或團隊成員的支持，這樣無論結果如何，你都不會後悔。因為「家」永遠是你最後的堡壘。","對於家人來說，他們並不需要你去闖蕩遠方，只要你安守本分、照顧好家人日常起居即可。這樣的狀態足以帶來幸福與安寧。","當你治家過於嚴苛時，家人可能怨言叢生，雖然短期內會產生摩擦，但從長遠來看，這種嚴格管教有利於家人健康成長。相反，如果你縱容孩子、妻妾，使其隨心所欲，往往最終會導致家庭失控，結果也並不美好。","當你繼續穩紮穩打、銳意進取時，你會收穫豐碩成果，並改善家中環境，讓家人過上更好生活。這是一件值得慶賀的好事。","當你以「天下為家」的胸懷去治理國家時，人民會因你公平廉明而安居樂業，你無需擔心社會動盪。這樣的治理方式就是最理想的狀態。","當你在治家中秉持「像一個家長一樣」的方式時，要以誠實守信、樹立威信為根本；這樣你所管理的家庭定會和睦向上，一切都會好起來。","當你處事時能夠求同存異，就會帶來更優結果。你要學會去蕪存精，留下一切對你有益的元素；如果雜質過多，反而會讓你得不償失。","當遇到與自己相悖之物時，要先進行區分、去粗取精；與此同時，也要容納那些與你異見的人，不要因一時不喜歡就排斥他們。正如馬匹丟失時，不必急於去追，因為「老馬識途」，它終會自行歸來。你要以開放心態對待不同人，方能真正包容。","當你決定另起爐灶、一人逐夢時，你要保持求同存異的心態。即便與你原來的老闆成為競爭對手，也不會有什麼大問題。你要在新的舞台上憑藉自身實力說話。","當你另起爐灶初期舉步維艱時，就像一個出獄囚犯一開始只找到拉車的差事卻根本不會拉車，總是走不順路；此時你要做出決定：要麼堅持信念、繼續努力，就會看到成果；要麼及時放棄並另尋機會，也可能獲得新的轉機。無論選擇哪條道路，都要有所行動。","當你另起爐灶卻被孤立時，你要及時尋找可以依靠的能人、建立互信，這樣即使有再多困難，你們也能相互扶持，共渡難關，避免遭遇災難。","當你另起爐灶並取得成就後，你便會被行業所接納；過去的悔恨也會隨之消失。若整個行業都從你的模式中獲益，加入其中也是順理成章，不會有人阻攔。","當你變得剛愎自用、對立嚴重時，你會被徹底孤立，就像一頭陷在泥濘中的豬，若想爬出，也滿身泥垢；你看到一隊陌生人時，可能會拉弓準備抵抗，後卻遲疑而放下弓。你不該繼續這種無謂的較勁，而要主動尋求合作，化敵為友；當你果斷下定決心後，尋找並消除自身的缺陷，就如同雨水洗淨豬身泥垢一般。這樣才能恢復並贏得尊重。","當你陷入極度對立、孤軍奮戰時，你的前進之路艱難如履薄冰，宛若陷入沼澤；此時你要盡快尋人協助，用山石填平沼澤、平衡過剩的水體，而不是坐等沼澤擴散，否則越陷越深。若此刻能找到有能力之人幫忙，你就能脫困。","當你在前行途中遇到難以逾越的障礙時，你要施展應對辦法，一步步把困難克服，最終達到終點。儘管過程艱苦，但當你滿載而歸之時，將會贏得巨大的讚譽，這就是真正的「載譽而歸」。","當上位者遇到困難時，真正戰勝困難的是他的手下。要認識到，許多努力與成功，往往來自手下的付出，而非個人功勞。","在激烈競爭的過程中，你所積累的經驗會成為實戰利器。起初開闢新路充滿阻礙，但當道路通暢之後，你再返回則輕車熟路，效率倍增。","世界上最美麗壯觀的風景往往隱藏在遙遠崎嶇之地。你前行路上的艱辛，正是為了到達那片秘境，才能收穫更豐厚成果，讓你「車載斗量」；同時，它也會吸引更多夥伴與之合作，帶來更大機遇。","當你在發展過程中遇到巨大的困難時，你的合作夥伴不會離你而去，他們會與你並肩作戰，共同度過難關。","當你在困頓旅途終於抵達終點時，你將收穫巨大的成果。這時正當各方齊聚，你應大方展示成果，讓有眼光的上位者與世人共同見證你的輝煌。","在水流中需要山石作為河堤，才能引導水流循環；若無出路，水就會在湖泊中來回循環，形成閉塞系統；若有出路，水則會化作溪流、江河，奔流不止。你要在資源運轉中找到適合自己的去路，否則就會停滯不前。","當你順應自然規律做事時，很多問題都會水到渠成，自然而然迎刃而解，從而避免災患。","當你付出努力並獲得回報，有時還能收穫意外驚喜時，就像你在圍獵時精準射中狐狸，結果發現它身上還有金屬箭頭，是從別處逃脫的戰利品。你要心懷警惕，不可因為意外收穫而得意忘形，也不可貪心。保持內心正直安定，這是你必然獲得好結果的關鍵。","當你像背負沉重負擔的打工者卻坐上了大車時，如果你的能力不足以駕馭所獲資源，那麼肯定會招來兇悍競爭者的覬覦。即便你保持內心正直安定，也難免會因此遭受災難。","當你順風順水時，自然會吸引投機者依附；在這個過程中，你要警惕基層隱患。正所謂「千里之堤，毀於蟻穴」，你要及時分辨良莠、去蕪存精。同樣，在選擇合作夥伴時，也要遵循這一原則。","當你對他人進行篩選、去粗取精之後，你可以進一步影響其中的害群之馬，讓他們學習誠信，將他們的力量納入麾下，讓他們成為你的一部分。如此一來，你的事業才能百尺竿頭、更進一步。","當你順勢而為到達發展頂點時，就會發現借勢之道的妙處。正如智者射鷹，他會先登上高牆，以此帶來更多力量，一箭即可命中目標。你若學會借勢，就能無往不利。","當你的「金屬」體質或核心力量因種種「鏽蝕」而受損時，你要堅守信仰、抵抗外界腐蝕。儘管過程艱難，你只要堅持下去，就不會遭遇什麼大災難。你要牢記：將自己比作鼎身，需要借助環境才能發揮作用；只要你心懷信念，借勢而行，總會迎來有益的成果。","當你面臨緊急事務時，你應該先放下手頭的事情去處理緊急情況。但你也要兼顧手中重要工作，根據自身能力適度減免，而非完全放棄。無論如何，最重要的工作必須優先完成。","當你意識到更重要、更有助於整體發展的事情出現時，你要暫停手頭的工作並優先處理這件事；這樣做不僅不會損害你，反而能更好地推動大局。優先保證重要事項完成後，再酌情處理「緊急但不重要」的任務。","在合作初期，僅靠一個人決策難免會武斷，直到碰得頭破血流才知道錯誤所在；若兩個人合作，就能相互啟發，共同進步，遇到分歧還能協商解決；若三個人合作，分歧往往導致拉幫結派，最終一人被孤立，甚至兩敗俱傷。因此，你要謹慎選擇決策方式，避免因人數眾多而導致效率低下。","當你幫助他人發現問題並幫助他們解決問題時，你不僅讓夥伴迅速高興起來，也在過程中積累了自己的寶貴經驗，並贏得了真正的友誼。只要你堅持助人，自己的事業也會因積累而壯大，絕不會有什麼災患。","當你已經有所成就時，要常懷感恩，為那些曾經幫助過你的人送上貴重的禮物。這樣，你與他們的關係會更加牢固，因為「禮尚往來」是一種維繫和諧氛圍的好方法。","當你為了大勢需要捨棄個人利益、開始回饋社會時，你要始終保證不損害群眾利益，而是通過自己的力量讓他們獲得實際收益；這樣你就不會招致任何災患。只要你保持內心正直安定，長期來看，全天下人都會歸順於你。此時，國家就像一個大家庭，你做的任何事都將迎來良好結果。","當大勢已成、你獲得回饋時，正是收穫時節。你可以趁此機會出去闖蕩，鍛練自己——「讀萬卷書，不如行萬里路」。要敢於從小河溪流邁向大江大河，才能獲得更寶貴的經驗和格局。","當你用這次機會把事情做大、做強時，就是完善而完備的好事，絕不會有禍患。你要大膽向前，讓自己在業內外都嶄露頭角。","當你秉持「禮尚往來、不求回報」的信念時，你只要時不時送上貴重禮品，就能保持與他人的關係緊密無縫。你要常懷善念，以禮相待，就像君主向上天獻祭，上天賜予福祉，一派和諧景象，這就是最好的狀態。","當你在實戰中與競爭對手交鋒時，要讓下屬和夥伴從實踐中獲益。你要保持誠信，以事實為依據，不偏不倚。遇到問題時，要請教參謀智者，用足夠的尊重換取最好建議，這樣才能從中受益、不斷進步。","當你請參謀智者為你指點時，你的行事就會不偏不倚、不再迷途。你會因為他們的指正而快速成長，這也會吸引更多合作夥伴。就如國家昌盛時，會吸引各地俊傑來投，促進整體繁榮。","當你懷著一顆仁慈之心，真誠地為天下人謀福祉時，無論你做什麼，都不需要過多擔憂。因你的虔誠與仁愛，人們自然會以同樣的虔誠之心來回應。你只要心懷善念，最終必能見證良好回報。","當你追求利益到極致，卻忽視增益夥伴、雙贏原則，有時還會為了滿足個人利益而巧取豪奪時，你便捨棄了初衷中的自我提升與合理發展，這會引發極其兇險的後果。你要警惕這種走偏的行為，保持初心和正道。","當你清晰地公佈「現狀已無法滿足需求」時，你要告訴自己不能再妥協，否則就要馬上採取行動。對於那些只在乎利益而不顧長遠的人，你要果斷離開，不要被他人拖累。","當你發現現有條件已無法滿足你的發展、甚至開始阻礙你時，你就要果斷離開。倘若你的前行速度已超過大多數人，可以優先出發；但這是基於你能清醒地評估自己能力前提下。若你實際能力不足，勉強前行那就會敗在半途，錯失終點。","在戰略層面上，你可蔑視對手，但在戰術層面上卻須重視對手。你行事雖可剛勇果斷，但思想卻不能輕視他人，要時時警惕對手在你麻痺時偷襲。就像打仗時要防備敵人夜間偷營一樣，一旦準備充分，自然就無所畏懼。","當你愛憎分明、心中決然並顯露在臉上時，你會顯得容易被暗算或遭到深仇大恨。你要明白：情緒與決心並不能代替策略與合作，如果你獨斷專行，即便夥伴心甘情願，也會因無法同步而被拋下，最後孤身前行。你要保持堅定，但切勿招惹風浪。","當你心中已有決斷卻能力不足時，就像一個臀部瘦弱無法使身體前行的人。你需要依靠合作夥伴、借用他們的資源和能力來印證自己的決斷，但你依然要牢牢掌握主動，就像牽著羊前行一般，對於任何動搖你信念的觀點，你必須拒絕。","當你已取得成就並身處高位時，即使你內心柔弱，也不得不顯露剛毅之態。就像莧草外表柔弱卻能頂風生長一樣。只有你保持中立和公正，方可確保自己不遭遇任何災患。","當你把「剛決」做到極致，一旦你心有所想，便不再與他人討論，立刻全身心投入時，這種作風若缺乏規劃與分析，結局往往難以預料，極其兇險。你要把「剛決」與「審慎」結合，才能確保萬無一失。","若你遇到剛強的對手，就不要拼硬碰硬，而要以柔克剛，用親和之術化解對方尖銳之力，爭取最大利益。只有這樣，你才能化敵為友，取得更大利益。","當你需要讓發展步伐放緩時，就像把車熄火、拴上堅固的剎車一樣，這是明智的做法。在高速發展之下，一旦停不下來，你將忽視潛在問題，導致嚴重後果。猶如瘦弱的豬仔，不堪一擊，偏偏仍硬往前衝，結果只會陷得更深。","當你自我反省達到極致，你就能言之有物、獲益良多，不會出現偏差。正如魚兒離不開水，你也需要保持柔和、順應環境的品質。你把成果留在內心，暫不急於對外分享，因為每一次飽滿的收穫都需要沉澱，待時機成熟再公開，這樣才能保障萬無一失。","當你在激烈競爭中自身能力尚不足以遠行時，就像臀部無肉、行路艱難，你要守住本分，並以柔克剛。即使你歷經諸多磨砺，卻仍能避免大禍，因為你懂得在對抗中保存實力。","當你獲得的支持難以讓你發起大舉行動時，如果你執意行動，必將是兇險。你要耐心等待，先鞏固現有資源，確保自己具備發起行動的底氣，然後再蓄勢突圍。","當你已功成名就，卻仍顯柔弱，你便會低調行事，如同將胸中錦繡深藏而不輕易露出。儘管你心懷壯志，也可能因種種不利因素被迫施展實力，你要學會在低調中積蓄力量。","當你將「柔弱以柔克剛」做到極致時，你會發現已無退路，就如同觸及尖角的柔軟生物，進退維谷。但若你能夠主動纏繞住對方，就能化險為夷。這份柔中帶韌，是你最大的生存之道。","當大家聚攏在一起、順應大眾之意時，事務便會亨通無阻。上位者只需以此凝聚向心力，就像帶領百姓到祖廟祭祀一般。對外交流也因此更加順暢，有利於各方共同協作。","當你講誠信卻因能力有限無法獨自完成目標時，就應該招募志同道合之人、組建團隊。你發出一聲號令，就會有人響應，一旦人力物力充足，再去執行任何宏圖，就不會出現重大問題。","當大家聚在一起、群策群力時，你就會獲得長久的收穫。因為你們是憑藉共同信仰走到一起的，你所做的一切都被賦予意義。即使只是一次簡簡單單的祭祀，也會讓環境因為你的誠心而變得豐饒。","在競爭對手環伺之時，夥伴們若徒增同情嘆息，卻無法改變任何局勢。你只有付諸行動，才能檢驗可行性，哪怕需要少量額外付出，也不會帶來重大災患。","當大家同舟共濟、攜手並肩時，你便無往不利。你或許不是團隊中的主導者，但只要大家攜手並進，就不會有災難。因為彼此信任，協作自然更順暢。","當夥伴們聚集到一定數量後，如果你能夠成為主導，就不必擔憂災患。但如果你無法真正獲得眾心，就要憑藉實力與智慧帶領他們保持和諧，使自己始終立於不敗之地，那樣你的悔恨也會慢慢消散。","當聚集達到極致、已無可聚之人時，自然會有人離開。這時你要妥善安排「散夥費」，體面告別，讓大家依依不捨地離去。那種「好合好散」的場面不會招致災禍。","當你積聚了足夠的資源後，團隊再也無法繼續擴展，你就要轉而提升自身，建立上下通達的系統。你要抓住現有機會，不斷完善自己，向外部有能力的人學習，不要畏懼。利用外部資源進一步提煉你自己的精華，這樣你才能乘勢而上。","當你擁有資源支持，要抓住每一次發展機會。你要以誠信和公平為原則，把握升遷與發展機遇，這是一件何其美好的事情！","當你內心恭敬虔誠，即使微薄的祭祀也會感動神靈，你就一定會得到好的回報，不會有什麼問題。","當你以資源優勢對敵人形成傾軋時，對手會聞風喪膽，紛紛退避。遙遠前方若再無人把守，你就可以順勢占領這一地區。","當洶湧洪流不可阻擋時，就像君王到岐山祭祀，必定吉祥如意、無一災禍。","當你取得成就並保持內心正直安定後，就能不斷收穫好成果。但你也要按部就班、穩步推進，莫因一時成果而驕傲自滿。","當你在某個領域提升到極致，卻發現沒有明確目標時，你會陷入前路迷茫的狀態。此時如果你盲目提升，就難免失去方向。你要始終在前行過程中不斷修正自己的思路，保持內心正直安定。","當你如同水一般順勢攀升、流動，卻突然到達無法再升之處，你就會被困於某個角落。但你的內心依舊堅強，即使被束縛，也不會有大的災難。哪怕四面受困、進退兩難，只要你能保持內心正直安定，也不會被最終擊垮。","當資源耗盡之時，你會陷入窮困境地。就好像你連一把椅子都沒有，只能長時間坐在粗糙的樹樁上，腰酸背痛、又冷又餓。在這種情況中，你應利用時間調整心態，認真反省自己，不要再被他人言論所迷惑，也不要自怨自憐。","當你擁有過多資源卻無法好好利用時，就只會導致浪費，還會讓你因與身份不匹配而背上「浪費」、「僭越」的罵名。你要清醒地認識到，必須給自己定位，切莫繼續疏於行動。就像宴席中的酒菜擺得過於豐盛，反而浪費。真正豐盛的菜餚是用來祭祀的，只有在那個時機分享方能發揮最大價值。","當你的競爭對手大勢已成，看似堅不可摧，就像你陷入亂石之中，想要退出卻發現回頭路到處荊棘叢生。當你好不容易返家，卻發現妻子已經不見，這樣的處境實在兇險。","當你留在原地等待援助時，救援物資往往龐大且遲緩。一開始你可能需要等待更長時間，但只要堅持，總會得救。","當你已經取得成就時，遇到挫折時往往損失更大。如同你位居上卿，卻因朝令不明被扣罰割鼻等極刑。要認清自己所處的困境、接受損失，然後放下過去、尋找東山再起的機會，如借祭祀之機重整旗鼓。","當你身處極端困苦的境地時，你動也動不了，不動也不行。就好像你被糾纏在亂七八糟的葛藤中，無法掙脫，又彷彿你站在隨時可能崩塌的山石之間，整個人都搖擺不定。你只要稍微做出一點行動，就會使自己陷入危險，動了之後你會後悔，不動時又覺得不甘心。無論怎樣，都有可能讓你後悔，因此你最好盡快採取行動。","當你的資源受到限制時，你雖然想改建城邑，但原本的井卻始終在那裡，無法挪動。你不要試圖去改變資源的環境。你每天來來往往地到井裡打水，但井裡的水不會隨著周圍環境的改變而增多也不會減少，總是原封不動地存在著。直到有一天，你將井繩幾乎放到井底卻仍然沒有打到水，你氣得把打水的瓶子都摔壞了。這時，你才發現資源已經被耗盡了。","當你的資源受到種種限制時，你需要理性地分析現有資源的狀況，然後果斷地取捨。你發現井裡的水已經渾濁不堪，泥濘不清，無法食用；剩下那些已經被廢棄、乾涸的水井，連鳥兒都不會前來覓食。你必須認清現實，及時放棄無用的水源。","當你的資源極度緊張時，你只能省吃儉用，家裡一派破敗景象。井水早已乾涸，井底只剩下打著嗝的蝦蟆；家裡盛水的器皿也快報廢了，有的根本沒有蓋子，有的已經破損漏水，對你毫無用處。","井中污泥雖然已被清理乾淨，但如果沒有人來取用，會讓你心中痛惜。直到你親自汲水上來享用，你才明白這是因為上位者下令改善水質資源。由此你可以看出，君王賢明時，大家才能一起享受到福祉。","當你為防患未然而加大投入，比如用泥土堆砌、用磚石修築水井時，就不會有什麼災患。","你要讓井水保持清澈明淨，就像甘甜涼爽的泉水一樣，供天下人飲用。","你完成了對資源和環境的改造後，就能持續不斷地提供支持，實現共贏。井水改造完畢，你就有能力讓民眾源源不斷地汲水；此時資源充足，不必獨占，也無需為井蓋分外設限。只要你以誠心分享資源，就能營造出和諧美好的局面。","當你等待時機進行變革時，必須明確改革的目的，並敏銳地把握出手的時機。你要知道，得道多助，進行改革需要你內心的堅持，也需要外部環境的支持。如果你借助天時，使土地更加肥沃，那麼改革才能順利進行。這是一個內外閉環、亨通無礙的過程；一旦改革成功，你絕不會後悔。","如果你察覺時機尚不成熟，就要穩住陣腳，強迫自己克制，積聚力量。就像用堅韌的黃牛皮捆住自己，不讓自己輕易掙脫。","當你等待到時機成熟時，就可以開始推行改革。這個合適的時機往往是改革對象由盛轉衰、顯露出腐敗的時候。你在這種時候果斷前行，就能取得良好效果，不會出現問題。","如果你貿然推行革新、參與競爭，會面臨兇險。在這種情況下，你只能保持內心的鎮定，在競爭中磨砺自己。你要自上而下推進改革，才能事半功倍。在經過謹慎嚴密的論證後，你提出的革新方案，務必要請示高層並獲得信任和充分授權，然後才能展開變革。","在改革過程中，如果你能及時修正錯誤，就會消除悔恨，也會因此贏得更多同伴的信賴。你借助他們的力量來改變常規命令，從而獲得更多收益，這是一件好事。","當你有所成就後，可以不定期地提出革新方案；經過評估，如果方案足夠優秀，你就要付諸實踐。首先，你要把改革運用到自己身上，就像老虎到了換毛的季節，煥然一新，讓自己徹底改變。你憑藉豐富的經驗，總結出良好的變革應對機制；在變革初期，你依靠強大的能力和主導地位，就能在未見成效前贏得下屬和夥伴們的信任。","當你的改革達到極致時，整體就會上一個台階。君子煥然一新，小人也會改頭換面。改革剛完成時，你需要鞏固成果，不可過於激進，否則會帶來兇險。你應穩紮穩打，保持內心的鎮定，這樣才是正確之道。","你要利用已有資源來形成緩衝，並借助外部勢力來提升自己，讓你的精華全部展現出來。","當你借用外部勢力來被動提升自己的時候，必須做好充足準備，防止被外勢所誤導。就像烹食之前，要把鼎倒過來，把無用的殘渣倒出來。借火烹食的鼎，就是在告訴你借勢的道理。納妾雖容易引起家庭糾紛，但如果由此得到了兒子，使後繼有人，這件事情就沒有問題。","當你通過自我完善而獲得更多能力時，就像鼎中充實，因此會招來競爭對手的嫉妒。但是因為這是內部發展，外人無法干涉，也無法靠近來爭奪，這種狀態對你是有利的。","如果外部之火燒得太旺，就會導致鼎耳脫落。你的鼎身被燙得太熱，無法移動，用來烹食非常不便；即使最肥美的野雞也只能眼看卻無法下鍋。即將下雨時，鼎太燙而無法觸碰，這意味著你白白浪費了一鍋美湯，讓你後悔不已。然而，只要雨水終會熄滅餘火，使鼎身降溫，最終還是會有好的結果。","如果鼎足折斷，就相當於把大家的飯食都打翻，使一地黏膩，看起來十分兇險。","當你為鼎配上黃銅製的鼎耳和堅固的金鉉時，就算再大的火也無法損壞你的鼎，這對保持內部的正直安定非常有利。","當你為鼎配上玉製的鼎槓，就提升了自身的品質，一切將無往不利。","如果你成為大家的「主心骨」，就要做到處變不驚，使內外亨通。當雷聲傳來時，大家都很恐懼，而你卻要談笑自若；雷聲傳得很遠時，其它人都嚇得毛骨悚然，而你依舊從容地吃飯，甚至連手中的酒都不會灑出一滴。","你需要不停地鍛練自己，承受壓力，戰勝自己的恐懼，以此來帶動周圍的人。就像雷聲陣陣，起初你也會很恐懼，但通過有意識的鍛練，你就能保持談笑自若，真正成為「主心骨」，這是一件好事。","當機會來臨時，你要抓住機會來磨砺自己，即便這會暫時讓你失去安寧。巨大的機遇常常伴隨著巨大的財富，但你不要主動去追求財富，只要把握好機會，財富自然會降臨。在古文化中，「七」對應陰陽五行，正好象徵一個小輪迴，指的就是這次機會。那些只追求財富的人反而得不到，而通過苦練內功的人，財富會自動送上門來。","如果你心中有鬼，就更容易被突如其來的雷電嚇到。雷聲讓你恐懼不安，而雷電照亮天空、震懾小人。在雷電陣陣中前行時，你無需擔心看不清前方的道路，也不用害怕被小人蒙蔽。","當面對巨大的機會和壓力時，如果你自身不夠強大，就更容易陷入困境。就像被雷聲驚得跌入泥沼一樣。","當雷聲陣陣、一來又去、一去又來時，你要借此機會磨砺自己，保持內心的平靜安寧。遭遇重大事故時，也要如此。","如果你內心戒懼到了極致，就不適宜主動出擊。就像天雷震動時，你會恐懼不安、驚惶四顧。如果你在心不安定時貿然採取行動，就會帶來兇險。雷聲還未傳到你身前，卻已經震到鄰居頭上；你要吸取教訓，時時戒備，這樣就不會有什麼災患。然而，即便鄰居出事而你倖免，也難免被打上「自私」的標籤，等你想與人合作時，可能會聽到一些冷言冷語。","無論你處於靜止還是行動狀態，都要與環境融為一體，不分彼此。這樣你就能與周圍一起承擔各種事情，共同分享一切，就不會有災難發生。","如果你堅持內心的「靜」，就要堅持自己好的那一面，認清自己的優點。對好的地方，你就要堅持；人若要行動，先要邁出腳步，站穩腳跟，堅定不移，就不會招致災患。你一貫保持內心的正直安定，這是一件好事。","當你像小腿蓄力一樣，已經具備了潛在能力，但只有腰臀帶動小腿才能真正前進；這意味著雖然你有力量，卻不足以做出實質性作為。因此，你要維持現狀，暫緩擴張；同時，你要關注下屬，讓他們看到成長的機會，以免他們心中悶悶不樂。","當你處於競爭之中時，不能一味龜縮不動，而要審時度勢，抓準機會果斷出擊。否則等到對手發展壯大後，你會陷入更大的困境。就像你保持腰部不動，背上的兩片肌肉失去了與腰部的聯動，整個人就無法發力，令人憂心如焚。","在與他人合作的過程中，你要保持自我約束。在那個時候，你就像保持身體靜止一般，就不會有什麼災患。","當你保持面頰嚴肅不變，說話條理分明、井然有序時，就能把事情解釋清楚。由於誤解而引起的悔恨也會因此煙消雲散。","如果你能夠將守正做到極致，就會表現出謹慎敦厚的品質，這對你有利。","當你滲透轉化、循序漸進時，就像與心儀之人戀愛並最終結婚一樣，這是美好的事情。","當你遇到能力強的人時，你會受到他的影響，往好的方向發展；反之亦然。就像水鳥來到水畔學習游泳捕捉魚類，都是潛移默化的培養，循序漸進。正如你教導孩子，孩子做錯事時你會呵斥，久而久之，好習慣就會自然養成，這樣就不會有什麼問題。","當一切水到渠成，你抓到小魚時，就要找塊礁石來落腳，安穩地享受收穫。這就是在良好轉變後獲得美好結果的表現，非常令人欣喜。","如果你參與競爭，卻突然發現新的環境完全無法適應，就像水鳥來到乾旱無水的大地一樣。用在人事方面，就好比你身為丈夫出征再也無法回來，或者妻子懷孕卻不能養育孩子。這是一種極其兇險的局面，不宜主動出擊，最好採用防禦策略來抵禦外敵。","當你逐步漸進地進入山林時，時不時能找到平整的枝杈讓你棲息，在這種狀態下就不會有什麼災患。","即便你身處並非自己習慣的環境，也可以通過逐步發展和改造而取得成就。就像水鳥最終成功飛上高山；在你的人生中，就像一位妻子三年未能懷孕，最終還是如願以償，不會被取代，這是一件好事。","當你滲透發展到極致、實現自身成長後，便能快速適應各種環境，就像來到四通八達的道路中樞。此時你擁有了實力，也需要選擇承擔相應的責任，這樣才更好。就像水鳥憑藉漂亮羽毛成為典禮上的裝飾品一樣。","當你逐漸滲透，被動適應，並將被動轉化為主動時，就要像草叢纏繞金子那樣，讓自己與環境契合，不要強行砍伐；否則硬要去做事只會適得其反。","如果你將女兒嫁出去，就要主動適應新環境。在三人同行中，必有我師；當你發現他人有自己欠缺的優點或處世方法時，就要虛心學習，平心靜氣，把自己放到一個較低的位置上。就像出嫁成為妾，通過學習補全了自己的不足，最終將所學轉化為自己的東西並發揚光大，就像一個瘸腿的人通過恢復和學習重新學會行走，隨後還可以遠行。這是一件好事。","當你主動適應新環境時，也要符合自己的定位。即便雙目失明，你仍然能夠看見事物；你不必自卑，要主動適應，虛懷若谷，不因外物而喜，不因自身而悲，以隱士般的正直安定來主導你的思維。","當你將女兒嫁為大家的大婦時，卻因為她自身能力和心性等綜合原因，最終只能以妾的身份出嫁。","如果你堅持自己，不輕易盲從，就像待嫁少女不肯輕易許嫁，以至於婚期延誤。但你不必擔心，推遲日期只是為了等待更好的時機；即便延期，最終你仍能嫁出去。","當帝乙將少女嫁出時，從服飾上看，大婦所穿的服飾不如偏房的服飾豔麗華美。這是因為到了農曆十五，身為家中大婦，你只求闔家歡樂團圓，這是一件好事。","當你適應達到極致時，該學的都學會了，已經無可適應；就像女子的筐籃空空蕩蕩，裡面的果實已經被吃光；或者像男子宰殺牲畜卻不見血（牲畜已經死去），這種情況再做下去就沒有意義和利益可言。","如果你要壯大自己，就要像用乾草引火一樣，在適當的操作和環境下，就能燃起大火，實現亨通。上位者可以借此壯大自身，就如國家欣欣向榮。火勢一旦大了，草木馬上被燒盡，但你也可以利用草木保存火種；當你用草木來保存火種時，火勢雖微弱，卻不容易熄滅，這令人不必擔心。當你需要點燃火種時，還可以借助天時，比如中午天熱時，燃火會更容易。","當你擁有適合高速發展的資源時，自然要把握住機會，但也要注意後續資源是否能夠跟上，以滿足後續發展。否則，原有的資源很快會被消耗殆盡，盛大的景象只會成為曇花一現。你需要找到與發展相匹配的資源，這樣即便長期發展，也不會出現大問題。只要你繼續發展，成就越大，就會獲得眾人的尊崇。","在你高速發展的時候，不可知的問題也會隨之出現。就像在大白天，太陽光被雲層或日食層層遮住，甚至白天都能看到北斗星一樣，這並非吉兆。這樣的情形很容易給你的決策帶來猜忌的聲音。實際上，這只是常見的現象，只要你沉著應對，一一解決，就會有好的結果；你要有信心，相信自己的決策和目標制定是正確的。","當你的競爭對手從各個方向重重包圍時，旌旗如同天日遮蔽，你幾乎無法看到陽光。如果你握住旗杆，卻讓競爭對手折斷了你的右臂，就會失去對旗杆的掌控，就如同被剝奪了陽光一般。此時，你要努力取回主動權，讓陽光重新照耀在你身上，這是一件好事。","在你高速發展過程中，如果遇到浮雲遮日、人人人心惶惶的時候，要意識到你的夥伴的上級也可能遇到相同的問題。你要認真傾聽他們的意見，大家同心協力，就能度過難關，取得好結果。","當你有所成就時，會有錦繡人才紛紛投靠，這意味著你得到了良將賢臣的擁護，同時也會帶來喜慶和美譽，這是一件好事。","如果你過分激進，導致資源被過度消耗，最終連基本的供給都成問題，就會陷入閉塞不出的境地。就像你建起高大房屋卻把窗戶遮死，從縫隙裡只能窺視外面，長久無人來訪；整整三年都不見人，這種自封孤立的狀態非常兇險。","當你過分消耗資源，導致資源緊張時，就要調整發展策略，尋找新的方向；同時保持內心的正直安定，不要盲目衝動。","你要根據資源情況及時調整自己的發展方向。當外部資源與發展方針不匹配時，必須靈活變通，調整自己的策略，以確保資源得到高效利用。此時你要注意，一定要配合資源情況做出改變，而不能為了堅持自己而只做無關緊要的小改動，否則往往會造成更大的代價，還可能失去良機，從而招致災害。","當環境發生變化時，你要及時調整自己。因為你之前的積累，已經具備了基本的安身立命條件，即便奔波在外也無須擔心。就像旅行時累了，你有旅館可住；你的旅費足夠，手下也一致支持你。","如果你在旅途中住處失火，失去了隨身的童僕，你要保持內心的正直安定，並經受住磨砺。","當你身處異鄉，雖然找到了安穩的住處，也賺到了日常的路費和用品，但你的心情仍然不算愉快，因為這只不過是旅途中的暫時棲息。","如果你外出射殺野雞，一箭斃命，這就說明你歷經艱辛、苦練技能後終於成功，並以完美的命中率贏得了讚譽。","當你顛沛流離，終有所成，即使暫時駐紮的地方並非真正的家，你也要明白，這就像鳥巢失火被燒掉；你先因成功而歡笑，隨後又因駐地被毀而大哭，甚至連牛也跟著失散，這種境遇非常兇險。","當你處於顛沛流離的狀態時，仍然需要保持謙遜順從。縱然你相對柔弱，無法做大事，但你本身依然是美好的存在，能夠獲得小小的順通。與他人一起做事情時，就會展現出整體的和諧美好，極具吸引力。","當你遇到比自己更有成就的人時，需要保持順從和謙遜，但並不意味著盲從；你仍要堅持自己的主見。如果對方退卻，你無需顧慮，就會自然發展並跟上對方。這時你要果斷決策，如同武人那般堅定的意志。","當你決定收起原來的成就，以謙虛順從的態度對待即將發生的事情時，就好比把擺放在台子上的珍寶收起來，放到床下，然後請史官或巫婆為你祈福。這種做法是恰當的，不會有問題。","如果你被競爭對手壓制，即便你面露順從之色，卻會因為過分珍惜自己而陷入艱難的局面。","當你選擇合作互助，並保持謙遜順從時，你會左右逢源、收穫眾多，所有的悔恨都會煙消雲散。就像田獵時，你獲得了豐富多彩的獵物，各個品種應有盡有。","當你已有所成就時，仍然要保持順從和正直安定，這樣就能消除所有悔恨，你所做的一切都會無往不利。即便在最初階段，因為多人提建議而陷入選擇困難、決策不順，但慢慢你會習慣這種狀態；在你順從別人並被別人順從的過程中，就會形成良性循環，這是一件好事。","如果你謙虛柔順到了極致，就像將台子上放著的珍寶都藏到床下，這樣你就失去了最基本的價值。雖然你保持了內心的正直安定，但過分壓抑自己卻會帶來兇險。","當你終於獲得成就，大家皆大歡喜，事業亨通時，你仍需要保持內心的正直安定。","當你自身比外部更優秀時，雖比他人更勝一籌，但你要明白紅花綠葉各有千秋；只要你彼此相敬如賓，給予應有的尊重，大家就能和諧共處，最終達成皆大歡喜的結果。","你要相信自己能夠做得更好，這種自信對你是有益的，它可以幫助你調整心態，消除內心的悔恨。","如果你的競爭對手來到身邊，卻曲意逢迎，力圖維持一個皆大歡喜的局面，這種做法往往不太現實，反而隱藏著兇險。","當你與他人合作時，要通過協商或談判來達成一個皆大歡喜的解決方案。在談判過程中，你會經歷波折和漫長的等待，無法保持安寧；但你每解決一個問題、達成一項共識時，就會感到歡喜雀躍。","當你有所成就時，就要以天下同樂為己任。但你要認識到各個階級之間的利益牽扯很難做到一碗水端平；如果你只是取悅某個階級，就會損害對立面階級的利益，導致他們在心理上主動與您疏遠。為了保全這部分被剝離的階級的誠信，你不得不加重自己的負擔，盡量兼顧各方，這是一件非常困難且危險的事情。","當你引導民眾一同歡樂時，就要讓大家感受到參與的樂趣。","即便存在不和諧，只要你能夠把握時機，內外一致，就能亨通。當你處於有利地位時，可以借機建立新的信仰體系，比如代民眾去祖廟祭祀；這樣做有利於你快速推動事情，並保持內心的正直安定。","當外部條件優於自身、人民人心渙散時，你不必勉強那些已經不再忠誠的人；反而要重新培養核心競爭力，挑選那些既有能力又柔順忠誠的人，通過提拔他們來壯大自己。就像用健壯良馬來彌補自己的實力不足一樣，這樣的結果對你有利。","當人心渙散時，正是你進行結構調整的良機。你要抓住這個機會去去污存精，這樣所有的悔恨都會消失。","在面對競爭時，你要在鍛練對手的同時，也借助這種壓力來解構內部不同思想，進行區分。就像用流水來洗滌對手的全身；即使水流四散，你也不必後悔。","當你充分發揮自己的能力，就能讓那些結黨營私的小團體解散，這才是真正的和諧。小團體一旦解散，大融合就會出現，夥伴們會收起私心，團結一致，如同山丘般凝聚在一起，場面壯觀非同尋常。","當你有所成就時，要承擔起對民眾的責任。當天下人心渙散時，你要發佈令令行禁止，重新樹立信任的核心。同時，你還要排除私利，以身作則，將王宮積聚的財富散發出去，這樣就不會有什麼災患。","如果你過分離散，導致無法挽回的傷害，就要洗乾淨傷口流出的血液，將自己遠遠保存起來，這樣就不會招致禍患。","當人心已經渙散時，你可以暫時退而保存自己，保持節制。但你不能因此讓節制成為苦楚，否則心中苦悶無法維持內心的端方正直。","如果你自身優秀，而外部競爭逐漸出現，挑戰你的權威時，你不應該立刻主動出擊，在內部製造更多競爭；你應該先審視自己，確保自身穩定（包括資源、市場、人際），並控制與外部的接觸，以避免不必要的消耗，這樣就能避免問題的發生。","當你的內部穩固，發展成強大的實體後，就不要固步自封；你要趁機進入市場競爭。就像富裕的大戶人家卻閉門不出一樣，這種做法只會招致禍患。","面對競爭，如果你不主動進取，就會退步；如果一直不加節制地等待，等到後來的競爭者趕上你時，你只能徒呼奈何，悲傷嘆息。一旦這種情況發生，你依然可以憑藉自身的能力優勢重新趕上去，不會發生太大的災患。","在合作過程中，你要保持自我節制。不要把節制當作枷鎖，而要意識到這是自然而合理的做法，然後心安理得地去接受，這樣才能內外一致、亨通無礙。","當你已有所成就時，節制就成為成功的代價；如果你將節制推而廣之，被節制者就會愉快地接受，這是一件好事。只要你堅持下去，就會得到眾人的尊崇。","如果你過分節制，甚至影響到正常的生活，陷入痛苦的狀態，此時你會因為過分虛弱，即便內心信念再堅定，也還是會面臨兇險。你要明白，節制是你心中的信念，雖然肉體會受苦，但內心的悔恨卻會慢慢消亡。","你要保持自信，以誠待人，就像魚兒在水裡自由游動，自然就能孕育出良好的生態氛圍。只要你保持內心的正直安定，一切就會順利。","當你與外部客戶或競爭對手打交道時，一定要建立在誠信的基礎上。首先，你要理性地評估對方是否值得信任，這樣才能獲得好的結果。一旦你選擇相信某個人，就要堅持下去；如果你一直心存疑惑，就無法保持內心的安寧。","你要建立誠信的關係，讓彼此溝通無障礙。就像日影下的仙鶴在鳴叫，即使小鶴看不到，也能發聲應和。如果你有好東西，就要與對方分享，同甘共苦；就像你有好酒，就要與朋友一同暢飲，直到喝光它。","當你堅守心中的信仰時，無論成敗，你都要為自己的決定承擔後果。遇到競爭對手時，要麼你敲響戰鼓，積極迎戰，要麼你罷兵退守；結果只有兩種：要麼戰敗而痛哭，要麼凱旋而高歌。","如果你的合作夥伴離開了，你要祝願他們幸福，就像臨近農曆十五，人們都在求取闔家團圓。即便你的馬兒走失，但成雙成對的馬匹總能找到彼此；雖然失去了一對，但只要各自好合好散，就不會有什麼災患。","當你做到內外一體後，就能讓整個市場因誠信而勾連一體、合作無間，遇到損失時大家同感痛苦，獲得利益時大家共享榮光。不論最終結果如何，都是你遵循內心信念而獲得的，不會有什麼災患。","如果你自信到了極致，就會變成自滿，並強行去做超出自己能力範圍的事，最終會傷人害己。就像錦雞聲音嘹亮，卻無法高飛卻要登天。即使你心中有這樣的信念，但能力有限，仍會帶來兇險。","你要明白，自信必須建立在對外界事物的充分了解基礎之上。再優秀的外部資源也不屬於你，你必須從頭開始，一步一個腳印地努力。就像天空中的飛鳥只是留下叫聲，其他什麼痕跡都無法留存。因此，無論你做什麼，都不能好高騖遠，要腳踏實地，才能獲得非常好的結果。","你要提防過度自信和好高騖遠，要參考外部優秀之處，將其學為己用。對你而言，更多的還是要一步一個腳印地前行，不能像飛鳥一樣一飛而過，看得都是表面，卻什麼也沒收穫。","當你出訪探望他人時，這只是手段；你真正的目的是學到有用的東西，切勿本末倒置。如果你拜訪了某位專家，卻只遇到他的老師；又或者沒有見到老闆，卻遇到了他的下屬，但無論如何，你想了解的情況已經了解到了，就沒有問題。","在競爭環境中，如果你不清楚敵我情況，沒有真正出訪溝通，就要保持謹慎戒備，並預先做好應急準備，以防萬一。因為如果你盲目聽從，可能會造成不可挽回的損失，那才是真正的兇險。","如果你與合作夥伴有相同目標，即使缺少專程拜訪，也不會發生大災難；你們會經常相遇交流。然而，長期發展下去，彼此的戰略規劃和處事方式差異會逐漸顯現，內部分歧會越來越嚴重，最終形成很大的阻礙。你必須提前預防此類事情發生，不要太過固執，為了堅持而堅持。","當你有所成就時，就會有人來拜訪你。訪客一路而來，像生成的水汽蒸騰成雲，但如果訪客也遵循「藏於小處」的原則，這朵雲還不會化作雨滴。通過與訪客的溝通，就能足不出戶地獲取他們的經驗，這也是你新的收穫。就像智者射獵時，會在箭杆上綁上細繩，哪怕獵物跑進洞裡，也能將它拖回來。","如果你與對方互不相識，卻貿然前去拜訪，就像飛鳥自投羅網，這是非常兇險的，這就是所謂的「天災人禍」。","當你用水滅火時，如果水勢夠大，就能將火徹底熄滅，使一切亨通，反應也會越來越及時。起初，如果水小火大，反而會助長火勢；但是只要你不斷注入水，最終就能撲滅火勢。你要做到做事適可而止，不要把事情做絕做盡。","當你發現內外出現矛盾時，要先區分彼此力量的對比；當你認識到外部勢力大且不可逆時，就要重新制定方針，必要時徹底放棄已有計劃，反其道而行之。雖然你要付出不小代價，但越早做出反應，就能越早回到正軌。就像行駛中的車子，當你拉住車輪時，車子就無法前行；你如果全身力氣都在拉住車輪，尾巴就會無力下垂並被地面拖溼。如此，你就不會再招致更大的災患。","如果你陷入內外矛盾、無法收穫，也無法展示自己的能力，就像婦女遺失了首飾，無法打扮自己。然而你的能力依然在那裡，只要你處理好內外關係，調整好方向和策略，最終就會有展現才華、獲得收穫的時機。就如七日一個小輪迴，到那時你會再次收穫成果。","當你與對手競爭且勢均力敵時，就像商高宗征伐鬼方，整整用三年才獲得最終勝利。三年的戰鬥讓你的兵丁疲憊不堪，使你無法再輕率用兵；而在兵丁中，若有人有戰功卻無能力，就不能提拔他們，即使重賞也不能重用。","當你與合作夥伴之間在管理思想和企業文化上存在衝突時，就要時時保持警惕，就像在細密的絲織品中混入了舊棉絮一般，一旦鬆懈就會帶來隱患。","你要明白，只有真正能增益自己的事情，才對你有利。就像你舉行隆重的殺牛祭祀，對環境並沒有實際作用；反而簡單而誠心的祭祀，才能真正造福環境。原因就在於實實在在的好處擺在那裡。","當水完全撲滅了火，就變成了完全由水主導的世界；你就無法游動，很容易被水淹沒到頭頂，這是非常危險的情況。","如果你想擺脫「鳥盡弓藏」的局面，就必須孤注一擲，衝出那片天地，這樣才能亨通。就像小狐狸用溼潤的尾巴去救火，這種方式無法滅火，也沒有任何好處。","當你全心抗爭時，就要將內外矛盾視為機會，通過自己的努力來改變外部局勢。如果你有足夠的能力，就要全身心地投入，爭取那一絲希望；要以小我之力與包圍自己的外勢抗爭，不能有任何顧慮，生死成敗在此一舉。就像用尾巴沾溼的一些水珠去滅火是遠遠不夠的，只有把全身都打溼，整個衝入火場，才能有可能衝出限制你的天地。","當你面臨最艱苦的時刻時，要認清自己目前的軟弱無力；即便外部壓迫得厲害，也不能根據本能盲目掙扎、浪費體能，而要克制自己、積聚力量，尋找突破困境的機會。你必須慎重考慮、仔細觀察，不要輕舉妄動，就像行駛中的車子，有時需要在保持動力的時候制動（同時踩住油門和剎車），保持內心的正直安定，才能確保最終獲得好的結果。","在激烈競爭之中，當你能力不足以大獲全勝時，如果你一意孤行地去對抗，那將極其危險。與你其與弱者對抗，不如果斷退讓，到適合自己的地方另闢新戰場。","當你身處「破釜沉舟」的境地，為了追求理想，你毫無退路，背水一戰。只要你保持內心正直安定、決不後悔，就能像你帶兵征伐鬼方一般，即使歷經三年艱苦，也終將勝利，將國家打造成龐然大物。","當你既已破釜沉舟、全力以赴，在大火熊熊之中從容穿行時，你宛如光芒萬丈的存在，讓旁人刮目相看。正是因為你堅守信念，你才能衝破重重封鎖，這就是好樣的你！","當你做該做之事後，便要聽天由命，無論勝敗，都要懷著欣然之心去接受。你要滿懷自信地飲酒作樂，坦然面對成敗。如果你已經作好了充分準備，卻依然敗下陣來，也不要過度悲傷；你要及時調整自己、放下包袱，盡快走出低谷。借酒消愁可以理解，但若過度酗酒，連頭都溼透，那便是失當之舉。"]),li=Object.freeze(["就像你剛出生時，你用雙手觸摸世界，逐漸認識自己，同時也在認清這個陌生的環境。","你需要在內心中打好基礎，通過調整自己的狀態來不斷積累能量，以便隨時準備與外部環境進行互動，並能夠投入到外部競爭中。","當你開始與外部環境接觸時，你會不斷試探、觀察對手，並隨時根據自己與外部競爭者之間的關係來調整策略。","一旦你獲得了外部的認可，你就要從外部合作者的角度對自己的狀態進行客觀評價，並與他們一起探討你應該採取的策略。","當你已經與外部環境深度融合，你就要以主導者的身份審視自己在這個環境中的位置，進而制定對應的行動方案。","走到今天，你發現自己已經接近外部環境所能容納的極限，於是你在困境中思考變革，並從當前狀態向下一個階段邁進。"]);var Ce={};Ge(Ce,{CLASSIC:()=>ui,EXPAND:()=>di,GIST:()=>ci,STAGE:()=>hi});var ui=Object.freeze(["Fundamental, success, favorable, perseverance","First Nine. Hidden drag ou completely eliminate ignorance and break through unknowing, you can consider your next development plans. You don't yet have the ability to occupy new resources or markets, but you have sufficient strength to guard your current enterprise without disaster.","Buried treasures always shine, needing only heavy rain to wash them clean. When water rinses away all the dirt on treasures, they become renewed and brilliant. At this moment, your actions follow the righteous path, and you can confidently venture into broader worlds, bravely exploring.","When you see plants thriving, you must understand how to maintain the current state and prepare in advance for possible storms, turning passive into active and danger into safety.","When conducting basic construction, you're like sand that can only become fertile soil with sufficient rainwater. You must skillfully use water resources to transform weak links. Although initially you might not see obvious effects and may even face criticism, as long as there's abundant rain, sandy soil will eventually become fertile fields - this is good.","In competition, keeping escape routes is crucial. Otherwise, when you're like standing in mud and rain turns mud into swamp, you'll fall into predicament, easily devoured by 'big fish eating small fish' because your weakness invites aggression.","When you've weathered storms and forged a bloody path from competitors, you'll truly break free from small circles and grow comprehensively.","When you've established yourself and continue benefiting, you can relax and wait for new opportunities. As long as you maintain inner righteousness and stability, everything will improve.","When rain falls heavier and you've prepared thoroughly to return home and shelter peacefully, you'll see rain flooding others outside, yet uninvited guests come seeking shelter. You should receive them warmly, learning from visitors' experiences and sharing opportunities. As long as you gain something, this is good.","When bly worse off.","Leading troops in battle. When commanding armies, using steady, experienced generals is safer, bringing higher chances of victory and fewer mistakes.","As your career develops and grows, resource needs increase. Everyone competes for resources, creating intense competition. If you maintain strict self-discipline and unified upper-lower coordination during competition, you can make the best use of everything and develop sustainably. Otherwise, with loose discipline, you might face internal division or resource competition failures that bring danger. Excessive exploitation also invites mass resistance.","As army commander, you should command from the center and use people wisely rather than doing everything personally. Only this way can you avoid disasters while matching your high position.","When competing externally, you must first assess competitors' strength. If you don't understand force comparisons and rashly oppose them, you'll pay huge costs. It's like armies going to war but returning with corpses - such outcomes are extremely dangerous.","When deciding to shift from competition to cooperation, you'll camp to the left, occupying the opponent's advantageous defensive right-wing position. As long as you don't act rashly, you won't face disaster.","In competition, you must balance internal and external factors and embrace all. Like hunting, when you discover prey and the whole team works together, you'll immediately propose and adopt good strategies to quickly subdue the prey without problems. On the other hand, in fierce competition, experienced, capable people should lead. If inexperienced people take charge, costs are often heavy regardless of beliefs - this is due to personal ability limitations and is extremely dangerous.","When you win a war, you'll reward according to merit - perhaps granting fiefs or appointing officials. But if you only reward without employing people, you'll disrupt internal order.","When you maintain lasting perseverance, you're like rushing rivers where rocks are washed by water, turbulent and unstable. If you waver due to turbulence and drift with the current, you'll eventually fall into worse circumstances.","When you have abundant resources, you should stabilize yourself and develop step by step according to plan, not following crowds. You should trust yourself and take one step at a time - like slowly filling a jar with water, you'll eventually reach your goal. This is true good fortune.","When you seek common ground while preserving differences from inside out and maintain inner righteousness and stability, you're in an excellent state that helps you stay clear-minded in complex environments.","Externally, potential competitors are everywhere. You must understand that stabilizing yourself depends on you, not on external hopes, or you might encounter untrustworthy people.","As long as your motives are pure and you maintain inner righteousness and stability, the path ahead will be clear and results will definitely develop in good directions.","When you follow plans step by step to achieve goals, you won't reject newcomers or chase after those who leave. You're magnanimous and selfless, gaining public recognition - they won't even report escaped prey. Such harmony is your ideal situation.","When your plans reach extremes but you suddenly can't see new directions, this causes confusion and is extremely dangerous. You must foresee this trap and adjust in advance.","When environmental moisture rises into clouds but accumulation is insufficient to form rain, you must continue settling and accumulating until conditions mature.","When you reach a goal, you need to stop and rest, summarize and reflect, preparing for the next breakthrough. You should reflect: Where did I do poorly? Where did I make mistakes? Only this way can you continuously improve.","Not only should you reflect, but also guide your team to reflect together. Your proactive guidance brings positive results, making the whole team more united and progressive.","When you decide to regroup but this conflicts with external development needs, recognize that these should complement each other, yet they clash due to different positions, like spouses turning against each other. You need decisive choices, or you'll trap yourself in troubles.","When you've fully summarized and understood gains and losses, you'll be alert to past costs, ensuring you won't repeat the same mistakes.","If you achieve inner-outer unity and support each other with peers through sincere hearts, you'll create a situation of shared loss and shared glory. Remember: your wealth actually comes from others' support and help.","When you reach 'saturation' but no longer act, this is not only useless but wasteful. Like water levels rising without action - when you're too docile without countermeasures, excess rainwater will eventually overflow. Especially when approaching reunion time, leaving home for distant travel is extremely dangerous.","When you confidently execute plans without hesitation, you'll successfully complete tasks without worrying about disasters.","When you've achieved something, you can use remaining time for what you truly want to do. You needn't worry - proceed calmly and composed. With previous achievements supporting you, whatever happens, you won't face disaster.","Because you have considerable accumulation, continuing simple execution makes your path increasingly smooth and broad. You should maintain pure, persistent, low-key attitudes, undisturbed by worldly matters, like 'hermits' maintaining inner righteousness and stability - this is your secret to continued stability.","When you remember your original intention and simply want to do things well, external competitors might eye you hungrily, but you can't force yourself to do things beyond your ability. Like a severely blind person who can only vaguely identify objects, or a lame person who can walk but remains unsteady - if you accidentally sue dreams. Wealth naturally follows success - you needn't deliberately pursue it. Like neighbors who treat each other sincerely and value trust, they naturally get along harmoniously.","When you gain large resources and profits through first-mover advantages, you'll gradually occupy high market positions. Even so, you must guard against pride and complacency. You must discern trends, plan ahead, and maintain good relationships with newcomers while learning and sharing. Like emperors marrying daughters to show favor and blessing, this creates harmonious atmospheres.","When more competitors continuously enter markets, your first-mover advantages gradually disappear, like city walls collapsing into dry moats - you return to the starting point. At this moment, if you actively attack, you'll only achieve pyrrhic victories. Internally, adaptation to later forces' catch-up will be difficult, and many will make various demands due to psychological gaps. While you can maintain inner righteousness and stability, facing dual internal and external pressures still feels overwhelming.","When you create good external environments but face denial, recognize that from input perspective, you give much but receive little. In such situations, you must reassess your deserved returns.","When more people enter emerging markets, originally scattered 'grass' rapidly reproduces into impenetrable 'grass seas' with increasingly developed, interconnected root systems. Trying to pull them becomes increasingly difficult. If you're greedy for more at this point, you'll fail badly. You must recognize your actual strength and control what you can manage, avoiding momentary ambitions that cause overall imbalance. Only this way can this orderly market maintain optimal states with smooth operations.","As a latecomer, you should first position yourself and inherit predecessor resources and experience with tolerance. It's suitable to start small and gradually expand for stability. Due to various restrictions and obstacles, you shouldn't make excessive investments at this time.","When competitors are exceptionally strong and you inevitably face oppression, you must adjust your mindset and face possible humiliation with tolerance, keeping yourself firm as before.","When markets approach saturation, newcomer success mostly depends on timing and opportunities. You should follow timing - this way you won't have problems. As weak groups, only unity and solidarity can bring benefits and harvests.","When you establish yourself, you'll find there are no permanent enemies. When faced with interests, opponents stop excluding you. For the entire market, this is good. You should let go of past pain and humiliation, even convert opponents into friends, like mulberry trees intertwining and growing together.","When market benefits are distributed and people shift from competition to cooperation, closed situations are no longer needed. Next comes mutual exchange and joint development, making everyone happy.","When you unite people from scattered states to unified action, excellent situations emerge. With everyone working together, strength multiplies, enabling ventures into great rivers and fostering cooperative spirits.","When you discover opportunities and prepare implementation, insightful people naturally want to participate. Before starting, you must make detailed plans with clear division of labor. Only this way can you avoid contrary results.","When opportunities become profits, if you try to monopolize all benefits, you'll cause systemic rigidity and lose follow-up development momentum. Once markets hit bottlenecks without breakthroughs, they become disasters.","When you discover you needn't fight directly, you can use deterrent strategies, like secretly setting ambushes in grass and occupying high points for early warning. This way opponents can't discern your true strength and hesitate to launch major attacks, buying you precious time.","When you're strong enough to defend city walls, if opponents want to attack again, they'll retreat due to poor cost-benefit ratios. Then you seek balance and joint development - this is wise.","When you unite with everyone working together, although you'll pay different costs in seeking common ground while preserving differences, the overall strength formed will be extremely powerful, capable of winning greater benefits. Like first bitter then sweet - once barriers are cast aside, you're like two armies sharing camps, invincible.","When your formation gathers to certain scales and strength accumulates to certain levels, you should unite everyone to explore new territories. You must bravely take that step without leaving regrets.","You must take responsibility for blessing and protection, forming a complete closed-loop logic: inner-outer consistency, harmonious prosperity.","When sharing or working with others, you should also silently support and bless them. But in actual operations, you still need to maintain communication. If communication is poor, you'll actually become an obstacle. Regardless of your intentions, you can't take improper actions, or you'll inevitably invite disasters. When facing difficulties, don't be discouraged - this actually makes everyone more united, avoiding disasters.","When you receive blessing, you're like being placed in a great cart for transport - goods won't scatter or be damaged. You can wholeheartedly advance toward set directions without worry about major problems.","When you receive blessing, you'll be invincible. Like nobles traveling anywhere smoothly because you have the Son of Heaven's protection. However, for small people, this blessing is not only unbearable but often used for evil, causing greater destruction.","When you know prosperity leads to decline, you'll stay low-key and continue silently accepting blessing, like suppressing loud drums. Only this way can you avoid inviting disasters.","When you interact sincerely between upper and lower levels, superiors treat subordinates with sincerity, and subordinates respond with sincerity - this interactive mutual trust relationship is very beautiful.","When upper and lower levels are united with sincere interaction, such perfect harmonious relationships let you clearly see prospects of joint achievement. Without accidents, you'll definitely achieve great success, even gaining heaven's blessing and being invincible.","When you maintain a modest attitude, your sincerity and diligence will eventually win support and bring success.","When you remain modest even after achievements, you still have pursuits but are never complacent. Continuing with modest attitudes when venturing out is always a good choice.","When people around you see your modesty, they're naturally influenced and infected, making you more respected.","When you're both modest and hardworking, you'll definitely achieve great careers. This attitude brings good results.","When you fully display modest virtues, you'll win countless people's admiration, making everything invincible.","When you don't rely on wealth yet still gain neighborly help, this shows your ability and modesty have earned trust. If you propose expansion needs, you'll also get broad support because everyone trusts you. Such situations are definitely invincible.","When you develop modesty to extremes, you'll gain worldwide admiration. Then using righteous names for campaigns, others' private territories can be incorporated without opposition. This will be harmonious.","When you're fully prepared and unafraid of external interference, you can boldly open battlefields and build achievements.","If you've never erred, your achievements will definitely be extraordinary, immovable like elephants to anyone. But reaching this peak, you must guard against excessive pride. Like elephants trumpeting proudly in territories, this often harbors future risks.","When you become a giant, choosing new development directions requires more caution because not all environments can bear a 'giant's' basic needs. Due to large size, you might crush roads or get stuck in rocks. But giants are powerful - as long as you invest time and energy, you can escape. You should try multiple approaches while maintaining inner righteousness and stability, eventually succeeding.","When you carefully observe competitors' reactions and discover problems, you must immediately repent. Because you're large and react slowly, if you delay correction, you'll truly regret it.","When you enter markets as a powerful entity, you'll bring huge benefits without question. Simultaneously, you'll attract more partners, further driving market prosperity and creating virtuous cycles.","Even if you need rest due to illness, having rich accumulation still enables gradual recovery, or long-term support prevents extinction.","When you develop to extremes and lose forward momentum, you might become muddle-headed and indulge in pleasures - this is dangerous. But if you temporarily stop due to setbacks, that's not necessarily bad. As long as you adjust timely, you won't face disasters.","When you occupy dominant positions, you must constantly observe external environmental changes and adjust accordingly. Your system forms closed loops, enabling unity of knowledge and action, inner-outer consistency, and harmonious prosperity. You use this to guide behavior, respond quickly, see everything clearly, and decisively cut through confusion. You know what to do and what not to do, acting upright and proper. In this state, regardless of external conditions, no disasters will entangle you.","When you successfully start businesses and want to maintain existing enterprises, you must face various people who attach themselves. They might cause corruption due to private interests and greed. As 'crystal clear water has no fish,' you need to embrace all while maintaining inner righteousness and stability to ensure business continues developing well. How do you embrace all? The answer is going out, communicating with the outside world, breaking private views, and connecting with public interests. Only this way can your business gain long-term support.","When listening to various opinions, you'll discover two most acute ideological conflicts: young people's radicalism and middle-aged/elderly conservatism. You must make choices. In internal construction, you should eliminate dross and improve yourself. After sufficient preparation, take radical decisive measures to quickly handle problems like 'cutting through knots with sharp knives' to break through deadlocks in one stroke.","When internal construction is perfected and external unity achieved, you can proceed steadily, avoiding unnecessary costs from impulsiveness. You should first clarify what you really want, then gradually implement external strategies under guidance from experienced, capable people to gain harvests - this method best suits steady progress.","When you blindly follow others, even if you benefit, you might unknowingly deviate from correct paths, ultimately gaining nothing. Even with inner righteousness and stability, without clear goals or direction discrimination during following, you might be led astray. Conversely, if you maintain goal orientation throughout any following process and act by borrowing momentum, you won't have problems.","When you follow with sincere beliefs and mutual support, you'll create beautiful situations with partners.","When your accommodating nature reaches extremes, interpersonal relationships reach peaks, becoming unbreakable. Like being 'bound' together in mutual entanglement, inner-outer unity. You solidify relationships this way because you've given genuine heart, like people sincerely worshipping heaven at Western Mountains, eventually receiving heavenly blessings. This state enables invincibility.","When you establish complete ecosystems like fertile soil nurturing all worldly things, everything thrives in endless harmony. You can lead brothers out to explore and gain insights, but remember not to destroy ecological balance, which would also harm yourself. You should consciously adjust external factors to make environments work for you.","When you realize your knowledge is limited and your business is large, you should humbly listen to various opinions. During development, you need external help pointing out your 'delusions' and errors. These people can be young people with innovative ideas or experienced elders. Listening to their advice will definitely benefit you. As the saying goes, 'honest advice sounds harsh' - though it sounds unpleasant, it often leads to great achievements.","Like using corporate culture as analogy, internal affairs handling reflects company cultural atmosphere. Subordinates should actively adapt to corporate culture rather than companies passively catering to subordinates. Regardless of right or wrong, subordinates shouldn't make changes because that weakens your control over corporate culture. Like families where women manage internally only need 'mother' status to manage households efficiently rather than depending on others to cater to children's preferences.","In competition, you inevitably make mistakes. Only through actual actions to verify decision correctness and truly bear corresponding consequences can you learn valuable experience from failures. Even with some regrets in the process, as long as you timely 'mend the fold after losing sheep' and learn from mistakes, you won't invite major disasters.","However, in cooperation, if you endlessly tolerate others' mistakes without supervision, over time this will become deeply rooted, causing teams to become passive and unable to break through.","When you appoint those acclaimed capable and virtuous people, they'll use their experience and wisdom to help you correct mistakes, helping you avoid detours.","When mistakes are thoroughly corrected, if you no longer assign these capable people any roles, they might choose to leave, leaving you to face the future alone. What remains are past achievements and good reputations that might be praised or even mythologized, but you'll also lose precious assistance.","When you maintain supervision and examination from top to bottom throughout, you establish complete closed-loop systems. You achieve unity of knowledge and action, inner-outer consistency, making harmonious prosperity possible. You use this to guide your actions, responding sensitively with clear perception, able to quickly cut through confusion, knowing what to do and what not to do, acting upright and proper. If subordinates grow faster than you while you still want to maintain tight control, this creates enormous danger.","When you use subtle influence to educate and transform others, you can better supervise and lead. Correct guidance methods eventually bring obvious gains.","Similarly, in internal construction, you should communicate timely and strengthen unity, making teams become unbreakable wholes. This way, regardless of challenges faced, you can be invincible.","When facing competitors, you must stand firm and take corresponding actions from your own perspective. You can neither be overly self-deprecating to show humility nor overly generous to appear magnanimous. If deviations occur, you must quickly correct them, or you might invite disasters. When necessary during arguments, ask for help rather than fighting alone.","In cooperation, if you entrust supervision rights to the most capable, best-performing people, you can maximize problem prevention.","When you exercise supervision rights with wisdom, your purpose is educating others, not taking everything upon yourself. Mastering supervision ability is precisely what superiors should bear.","When your supervision reaches extremes, subordinates have all grown into independently thinking people. You no longer need to give directions but simply observe with gentle, generous attitudes. They'll naturally handle things well - this is excellent, without disasters. Grassroots organizations and systems have matured and stabilized.","When you keep yourself clean and tidy, you don't need to actively promote yourself. As the saying goes, 'good wine needs no bush' - people will naturally come seeking your help. You only need to maintain objectivity, gentleness, and gratitude to establish faith in people's hearts, earning respect and admiration.","When seeking opportunities, you must take long-term views, not just looking at immediate situations, and not making hasty, childish judgments about circumstances. For ordinary people, this might not bring serious consequences, but for you bearing heavy responsibilities, poor decisions might lead everyone into difficult situations.","In internal construction, you don't need every subordinate to clearly understand the big picture. What's truly important at grassroots levels is doing your own duties well. Like 'women managing internally' in families, grassroots need only focus on their responsibilities, making overall operations smoother.","When you carefully observe, you'll assess your inherent advantages and disadvantages. If opponents retreat due to their own weaknesses, you should promptly follow up and seize opportunities.","When you notice industry power distributions, you can choose suitable camps and contribute your efforts, helping you quickly find footholds.","When you constantly examine yourself, you can continuously correct errors and avoid disasters.","If you push observation to extremes by observing others' experiences and knowledge, you can verify your own choices and prepare preventions, never again inviting disasters.","When you discover your own weak points, you should timely supplement them to achieve unity of knowledge and action, inner-outer consistency. If involving personnel issues requiring 'punishment,' you should act according to law and decisively cut through confusion.","When working with others, if you find someone holding back, you should timely identify problems and use minor punishments as major warnings to remind them. Like putting light offenders in ankle shackles - though limiting their activities, this doesn't cause greater disasters.","When you seize opportunities to strengthen yourself, like eating heartily, even if your eating manner is unrefined, as long as you can digest and utilize these resources, it's acceptable.","When you enter new resource environments facing unprecedented challenges, you might temporarily adapt poorly and encounter setbacks. Like trying to eat heavily fishy preserved meat that's hard to swallow. But as long as you adjust coping methods, you'll gradually adapt and ultimately face no problems.","When you work hard to supply yourself in harsh environments, as long as you maintain inner righteousness and stability, you'll gain unexpected harvests. Like finding a metal arrowhead in bone marrow while gnawing bones - such unexpected joys are delightful.","When you supply yourself, accumulate strength, and perform normally when conditions mature, you'll gain harvests. As long as you maintain inner righteousness and stability and accept tempering, you won't encounter major problems.","However, if you over-supply without timely consumption, you'll inevitably accumulate useless fat that becomes burdens, like bearing heavy shackles that cover your ears, making movement inconvenient and information reception obstructed. This situation is very dangerous.","When you appropriately embellish and beautify based on inner-outer coordination, your career becomes more prosperous. But remember: no amount of decoration can change essential nature - you can only make small-scale adjustments, unable to bear great responsibilities.","When you feel you should display yourself, you should go out and let more people see you. Don't go out just for the sake of going out, but enjoy the process. Like not always needing to ride in vehicles - as long as you wear comfortable shoes, walking can also appreciate roadside scenery. You needn't deliberately suppress your achievements but should treat yourself well and feel comfortable.","In internal construction, leaders' own improvement is equally essential. Like grooming chin whiskers that must move with mouth opening and closing, this symbolizes constantly monitoring 'facade' and 'spokesperson' image and expression.","When you can't demand too much of yourself, you should learn to maintain states to have sufficient energy for handling emergencies. As long as you maintain inner righteousness and stability, you can achieve long-term development.","When you stay low-key and unadorned yet ride white horses with colorful, magnificent decorations showing extraordinary divine horses, you let people see your own extraordinary value. You should emphasize practicality over 'face.' Good steel should be used for blade edges. Competition inevitably involves friction, but you should seek cooperation like marriage rather than suffering defeats.","When you can't excessively pursue external glamour but should put more energy into practical matters, it's like using minimal silk to decorate gardens, indicating completion. What truly needs attention is the garden itself. Though it seems stingy, the wealth you save can be used for more important things - this is correct.","When your temperament and cultivation reach certain heights through long-term nurturing, you need no external decoration - your natural bearing shines through. As long as you maintain this state, regardless of externals, you needn't worry about disasters.","When you don't drift with crowds and clarify your purposes, you can stay clear-minded amid various temptations without wavering.","When you know all things prosper then decline, you'll recognize the importance of foundations and continuously maintain inner righteousness and stability. Like discovering bed legs are peeling - if you don't act promptly, beds will eventually collapse, bringing disasters.","When you discover middle levels are showing problems with insufficient capacity to support development plans, you must pay attention and adjust promptly. Like bed boards peeling - if not immediately repaired, beds become unusable.","When you're in environments where conditions increasingly unfavor your development, you should decisively break away rather than being indecisive. Only this way can you avoid disasters.","When entire environments no longer suit your survival and development, like bed surfaces already falling apart, no matter how hard you try, you can't continue using them. If you still cling desperately at this point, it's too late and extremely dangerous.","When you find environments unsuitable, you need to set goals and make phased plans to gradually improve environments from bottom up. Only this way can you be invincible.","When you've deteriorated to extremes and see only yourself still persisting but feel pressure from assimilation, you should decisively collect horses and return to the starting point to begin anew. Otherwise, you can only wait for resource depletion and ultimate helplessness.","When you're in your home field and can come and go freely like fish in water, you'll attract more partners to fight alongside you, so you won't suffer disasters. Everyone does their division of labor well, forming cyclical virtuous mechanisms.","When you return to development tracks, you should try various approaches in unified environments, but don't go too far with things you don't understand - return promptly to summarize experiences. Even wrong directions don't matter as long as you correct them timely - everything will improve. Multi-faceted attempts broaden horizons and make thinking more comprehensive - this is good.","When you return fully loaded, the entire team gains improvement from your return - this is cause for celebration!","When you frequently engage with competitors and continuously try and correct mistakes in the process, you'll eventually keep returning to righteous paths and tempering yourself, thus avoiding disasters.","When you persist in walking your own path and discover wrong directions ahead, you promptly return alone. Though you can't determine whether retreat is advantageous, you demonstrate firm convictions.","When you dare to try, even if you fail, you'll gain abundant experience. At least you tried when young and won't regret 'not trying.'","When your path ahead falls into extreme confusion and you find you can neither advance nor retreat, if you still insist on moving forward, you'll easily encounter major failures and even complete defeat. Imagine if superiors act willfully - their outcomes are often ruin, causing severe injuries requiring years to recover. Such consequences are very dangerous.","When you carefully guard your own principles and act reasonably and evidentially, you needn't act randomly. You should achieve unity of knowledge and action, keeping heart and actions consistent and harmoniously accessible. Such you respond sensitively with everything becoming clear, able to quickly cut through confusion, distinguishing what's permissible from what's not, acting upright and proper. If you harbor prejudices, it's like having something in your eyes that blocks vision of the whole situation. Therefore, you must abandon prejudices and follow correct guidance.","Before attempting anything, you should think thoroughly and plan carefully rather than acting 'mindlessly.' Only this way will you achieve good harvests.","When you don't have overly high expectations for results, you should practice down-to-earth. Like not plowing yields no harvest, not clearing land yields no measured grain. Rather than fantasizing, start acting now.","Even if you always act properly, you might suffer disasters for no reason. Like someone tying oxen roadside and passersby leading them away, villagers being implicated in compensation demands. In such situations, villagers suffer innocent disasters.","When cooperating externally, as long as you stick to righteous paths, you won't face disasters.","When you act correctly and sit properly, when encountering unexpected disasters, don't panic. Like falling mysteriously ill - don't use medicine randomly but let your body recover naturally to overcome difficulties.","When you're overly cautious about every opportunity, missing timely grasping, you'll appear pedantic. Once you act without precise timing, you'll also add unnecessary obstacles. For example, acting in blind states might yield nothing and ultimately be counterproductive.","When you're in continuous accumulation processes, your reactions will be very sensitive with everything becoming clear. You can quickly cut through confusion, distinguishing permissible from impermissible, acting upright and proper. You don't depend on families but enrich yourself through external conditions. If timing is right, you can 'emerge' to display abilities.","When you determine directions and begin investing, you must first experience accumulation periods without visible results - this is your 'tempering period.' You need to bear pressure, not rushing to expand but stopping to supplement your own strength.","When you stop development to consolidate yourself, even encountering sudden storms, you can withstand them. Like stationary carts having carriages separate from axles - since not in high-speed motion, such sudden accidents won't cause major damage.","When you gradually accumulate resources, you must also cultivate abilities to control resources, like controlling speeding carriages where higher speeds mean more difficult control. You need to train in harsh environments while maintaining inner righteousness and stability, training drivers and guards so everyone's prepared when crucial moments come, making actions smoother.","In cooperation, when you need to constrain others, it's like taming calves by tying horizontal wood to horns. After taming, calves will obediently serve you - this is what you should pursue.","When you castrate wild boars, their tusks degenerate and lose aggression, then they grow fat, becoming strength you accumulate. At this point, degenerated tusks no longer harm people, so you can bring them under your command. This embracing approach is very wise.","When resource accumulation reaches limits, like water overflowing when full, accumulated potential energy will directly break through difficulties and burst forth. Rather than letting this potential energy lack outlets, it's better to open paths, sending it to broader worlds, making you prosperous and smooth.","When you maintain teams and support others, your actions will be highly agile, able to quickly see situations clearly and handle them decisively. You can quickly cut through confusion, distinguishing permissible from impermissible, acting upright and proper. You constantly use others' chin maintenance states as references, but your own care still depends on yourself.","When you have sufficient resources, you should first let yourself digest these resources. Because everyone's situation differs, maintenance methods, effects, and timing also vary. You should design the most suitable maintenance plans for yourself based on understanding your own situation combined with thinking. What others can eat doesn't mean you can copy it. If you blindly imitate, investing heavily without gains, you'll definitely face danger.","You should establish bottom-up pyramid structures - this is the truly stable way to develop yourself. You absolutely can't mistake maintenance priorities, or you'll violate common sense. If grassroots are powerless, forming inverted pyramid structures causes stagnation. You should restructure and temporarily avoid blind expansion, or you'll face serious danger.","When competition is everywhere and continuous, you'll find it very difficult to maintain 'maintenance ways.' Because environments are harsh, even if you maintain inner righteousness and stability, you might encounter unexpected dangers. Competition essentially involves long-term investment processes that make subjects difficult to get sufficient nourishment, thus weakening overall development potential.","When you actively propose letting masses and groups provide support and supply to maintain entire market development, this is acceptable. As long as you maintain dignity and wisdom while adhering to principles, you won't have problems. Because what's taken from people should be used for people.","When reality is that you can only maintain yourself without caring for masses, this violates natural laws. You can't forcibly demand due to urgency. Currently, all you can do is stabilize yourself, settle down, and maintain inner righteousness and stability. After your abilities are sufficient, gradually realize grander goals. You can't be impatient now, or you'll fall into crises.","When supply reaches limits, heroes worldwide depend on your supply to live and work peacefully. This is both pressure and tempering for you. Even so, those supplied benefit. As long as you maintain inner righteousness and stability, this brings good opportunities, favorable for borrowing momentum to advance and open new situations.","When you feel pressure is truly too great, like ridgepoles being bent by pressure, you must work together with teams to resolve crises. Otherwise, you'll be crushed by fighting alone.","When you discover plans alone can't handle sudden changes, you need sufficient resource reserves as confidence to handle competitive pressure and emergencies anytime, reducing error risks.","When you receive sufficient resource injections, you'll radiate new vitality like withered willows sprouting new shoots. Because pressure keeps you low-key and cautious, you better understand team cooperation, and everything you do will achieve good results. Like old men marrying young wives - though violating conventional thinking, if emphasizing spiritual compatibility, there will ultimately be blessings.","When external pressure suddenly increases beyond your own capabilities, like building ridgepoles being bent, the situation is extremely dangerous. Without timely self-examination and adjustment, escape will be impossible.","When you have ridgepole materials but limited capabilities, you're like upward-bending beams that can still support houses but can't resist lateral pressure. Though retaining basic functions, with slightly greater external force, you'll 'break.'","When your capabilities are insufficient, you should more steadily train yourself. Otherwise, even with ample resources, you'll struggle to maintain achievements long-term. Like withered flowers suddenly blooming - though seemingly beautiful, they don't last. Using such beams when building houses makes houses ultimately unstable. Like weak women marrying strong husbands - though there's fate, fundamental contradictions remain and won't earn external praise. Most importantly, you need to maintain mutual recognition between yourself and environments.","When pressure far exceeds your bearing capacity, it's like forcibly crossing water without sufficient ability, ultimately being drowned - this is extremely dangerous. But knowing difficulties yet advancing is still understandable because you're unafraid of challenges.","When you're trapped in numerous snares yet show water-like noble character, you're like water that can both contain all things and move according to will. You should maintain original heart and persist in positions. Water flows from top to bottom - though seemingly casual, it's traceable. This flexible yet powerful quality makes you invincible.","Anytime you encounter difficulties, you should stay calm, carefully analyze current environments, and overcome obstacles step by step. Never blindly force through, or you might sink deeper and even invite irreversible disasters.","When facing dangerous traps, first adjust mindsets. Any small gain should be viewed as victory. Eve
