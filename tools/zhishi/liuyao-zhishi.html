treasure waiting for rain to wash it clean: when the time comes, a wider world opens.","Holding one's ground in a dispute while leaving room; when needed, bringing in someone capable to help.","In leading many, a seasoned and steady commander is the safer choice.","Holding steady amid turbulence; drifting with the current only makes things worse.","Clouds without rain yet: reserves are thin, and settling and building must go on until conditions are ripe.","Though it feels like treading on a tiger's tail, hesitation can be set aside and the plan carried out.","Small effort, large return: work that pays off.","Much given, little returned, effort unrecognized; a time to reassess what is owed.","From scattered to united: together, strength multiplies and ventures open up.","Taking on the duty to shelter others; consistent within and without, in harmony.","Modest, sincere, and diligent: support comes over time.","Everything in place and undisturbed by outside noise: a time to open new ground boldly.","Even in the lead, adjusting to outside change; consistency within and without keeps harm away.","Building an ecosystem that keeps renewing itself, and venturing out without upsetting its balance.","Overseeing from above: holding on tightly after subordinates have outgrown their roles plants serious trouble.","Keeping oneself in good order, with no need for self-promotion: good wine needs no bush.","Shoring up the weak points; handling people matters by clear rules, decisively.","Moderate adornment adds grace but cannot change substance; suited only to small adjustments.","Clear about purpose and not drifting with the tide, staying clear-headed amid temptation.","On home ground and moving freely, drawing in allies and forming a virtuous cycle.","Keeping to principle and not acting rashly; setting prejudice aside to see the whole picture.","Steady accumulation, enriched by outside resources; stepping out when the time is ripe.","Caring for the team and supporting others, while one's own nourishment remains one's own task.","Pressure bending the ridgepole: to be resolved together with the team, not alone.","Deep in danger, supple as water, holding to one's own heart and stance.","Seeking outside help to get free: decisive and upright, gentle and diligent like a cow storing strength.","An instant match and close cooperation; each completes the other, with twice the result for half the effort.","Finding a way of working that can last, and leading others forward together.","When strength no longer suffices to hold the position, withdrawing for now to preserve it.","Stepping back at the right moment and growing in a new setting by riding its momentum.","Making good use of fine stock and improving it steadily; competitiveness keeps coming.","With resources overstretched, staying upright is hard work, yet it is kept up through the hardship.","Decisive in action yet gentle at heart, holding the right course without losing direction to impulse.","Seeking common ground while keeping differences; keeping what is useful, as too much dross costs more than it gives.","Isolated and struggling: capable help is needed quickly to get out of the mire.","Finding one's own outlet within the flow of resources, or stagnating.","When the core is worn down, holding to conviction and working with circumstances to see the hard stretch through.","A season of returns: going out to gain experience and breadth while the tide is favourable.","Declaring that the status quo no longer works and compromising no further; leaving those who care only for short-term gain.","Facing a forceful opponent: overcoming hardness with softness and turning rivals into friends.","Going with the shared will and building cohesion, so that cooperation flows more easily.","When expansion reaches its limit, turning to self-improvement, learning from the capable, rising with the tide.","Risen as far as it can go and hemmed in; inner integrity prevents final defeat.","A resource that seems unc  key point and the fuller retelling."]},{h:"Worth knowing",p:["The passages are quoted as they are; only connecting words are added. The “you” in the retellings is the reteller's voice, not a judgement about you.","Cast by the moment, everyone in the same two-hour period gets the same hexagram: it belongs to the moment, not to the person.","Nothing here is medical, legal, financial or other professional advice. Everything runs on this device; nothing is sent or stored."]}],rulesHead:["Moving lines","What is read"],rulesRows:["The judgement of the original hexagram","The one moving line of the original","The two moving lines of the original, the upper one leading","The judgements of both: the original for the matter itself, the changed one for where it is heading","The two unmoving lines of the changed hexagram, the lower one leading","The one unmoving line of the changed hexagram","The judgement of the changed hexagram"],rulesNote:"These rules come from Zhu Xi's Introduction to the Study of the Changes. When all six lines move, the book reads two special texts for the first two hexagrams; they are not in this tool's sources, so the judgement of the changed hexagram is read instead.",footer:"These are traditional retellings of the Book of Changes, quoted as they are with only connecting words added; the “you” is the reteller's voice. They say what the hexagram is about. They are not a judgement of you, do not predict outcomes, and are not medical, legal, financial or other professional advice."},Pe={"zh-Hans":Bi,en:Pi};function Bt(e,n){let t=o=>typeof o=="string"?n(o):Array.isArray(o)?o.map(t):o!==null&&typeof o=="object"?Object.fromEntries(Object.entries(o).map(([i,a])=>[i,t(a)])):o;return t(e)}var G=(e,n)=>e.replace(/\{(\w+)\}/g,(t,o)=>String(n[o]??`{${o}}`));var Kt=[["Asia/Shanghai",121.47],["Asia/Shanghai",116.41],["Asia/Shanghai",113.26],["Asia/Shanghai",114.06],["Asia/Shanghai",104.07],["Asia/Shanghai",108.95],["Asia/Taipei",121.56],["Asia/Hong_Kong",114.17],["
