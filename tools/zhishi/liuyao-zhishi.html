n tiny victories can build confidence and bring progress.","When environments are harsh like deep trap pits with dangers everywhere, you should try to remain still, avoiding rash actions. Any carelessness will trap you deeper.","When you're trapped in numerous difficulties unable to care about etiquette and appearance, you should work together with partners, not being constrained by formalities. Imagine this scene: several key people trapped together with only one pot of wine and two baskets of food, only able to share using common earthen jars. If someone wants to drink, just call out and wine and food will be passed through windows. Facing predicaments together, you carry each other through, avoiding disasters.","When you're determined to 'move mountains and fill seas' to fill trap pits, sometimes small hills aren't yet leveled when you've already left with shovels. Regardless, this action is your self-rescue attempt. As long as you can protect yourself, there won't be major problems.","When you're trapped in numerous difficulties yet still reach 'peaks,' you're like being firmly bound in thorny bushes, unable to move. If you remain in this state for three full years without escape, that's extremely dangerous.","When you fall into numerous predicaments and want to rely on external forces for escape, you must act decisively and persist in righteous paths, making yourself inner-outer consistent and harmoniously prosperous. Simultaneously maintain inner gentleness and persistent diligence like female cattle, continuously accumulating strength to await good opportunities. Staying constantly alert is both self-protection and brings unexpected gains.","You should remember 'failure is the mother of success,' drawing inspiration from numerous precedents. Regardless of results, maintain respectful, humble analysis. The more you respect historical cases, the fewer same mistakes you'll make, the more you'll move toward success.","When you sit in central locations with inner-outer consistency, you'll create harmonious scenes where entire situations benefit everyone.","When your inner and outer environments are clearly distinct, you can grasp opportunities and discover beauty. Like facing sunsets, you can optimistically sing 'sunsets are infinitely beautiful.' But if immersed in 'candle in wind, self-pity' laments, such mindsets will definitely bring increasing dangers. Your optimism guides you toward brightness while pessimism only traps you in quagmires.","When you consistently resolutely persist in yourself, encountering contradictions might cause conflicts and even destroy entire environments. Like sudden fires coming fiercely and unpredictably, you'll panic and feel anxious yet often be powerless. Once out of control, you'll fall into destructive blows.","When situations fall apart, you'll shed sad tears and sigh sorrowfully. But since things have reached this point, you should accept reality and learn lessons because this is also an opportunity to 'build anew after destruction.' From this perspective, though the process is painful, it's a necessary growth path.","When cooperation completely breaks down, to avoid becoming competitors' targets, you'll actively attack and occupy them, abolishing their decision-makers and incorporating their quality resources. Though decisive, this also prevents future greater disasters, bringing you long-term peace.","When you hit it off with others and cooperate closely, it's like marrying wives. You're inner-outer consistent and unobstructed, acting decisively while always maintaining righteous paths. Only this way can you achieve twice the result with half the effort and reach win-win situations.","When stepping into unknown territories, you should both practice and be carefully cautious. Many problems can't necessarily be predicted with current experience. Like crossing streams, you must first test lake bottoms with toes before deciding whether to step forward or retreat. As long as you proceed step by step and respond carefully, you can safely reach the other shore.","When you feel like calves suddenly stimulated and restless, no matter how anxious you are, you're only wasting energy. You should build solid foundations and stay quiet to accumulate energy. This way, when facing unknown environments, even with insufficient conditions, you won't blindly attack to avoid unpredictable consequences.","When your 'thighs' receive stimulation and movement drives your actions, you should maintain restraint and not blindly follow others. You should adapt according to external environments and steadily advance in directions most suitable for yourself to avoid falling into dangerous situations.","When you sense situations and act, as long as your heart is righteous and stable, you'll be invincible. Even in predicaments, others' pessimistic emotions won't influence you. But if you fall into confusion with wavering actions, you'll drag down cooperation partners, causing everyone to become pessimistic. This is what you must guard against.","When you consistently put masses' interests first and contribute to them without seeking returns, you'll earn their trust and support. However, communication isn't always bidirectional. If you don't actively listen to masses' voices, you can't communicate smoothly and might end up only giving unilaterally without receiving responses.","When your 'sensing' reaches extremes, you'll tend to handle matters that should be expressed verbally through telepathy, complicating simple problems. This isn't beneficial for team cooperation and makes communication convoluted.","When a way of doing things can bring you long-term benefits and no disasters, you can lead everyone to work together and progress jointly.","When your measures have brought continuous benefits, you need to focus on grasping 'degrees.' You must stay synchronized with surrounding reactions, not just taking endlessly. Otherwise, even with correct strategies, you'll destroy environmental balance and be unable to gain lasting benefits.","When you persist in walking your own path, as long as you don't waver, you won't regret.","When you do things, you need persistence rather than fishing for three days and drying nets for two. Even if you maintain inner righteousness and stability, if you're overly conservative due to fear of failure, your career will also fall into stagnation predicaments. Only by persisting to the end can you see harvest fruits.","When you endlessly hunt the same fields regardless of harming sustainable development, you'll eventually exhaust all prey in fields, causing resource depletion. You need appropriate rest or seek new markets to avoid complete decline.","When you persist and persevere, you practice principles that are consistent from beginning to end. For women, this is the way of managing households. For men, you should combine ever-changing environments with maintaining righteousness and stability, flexibly modifying action policies. After completing one goal, advance to higher levels and broader fields. If you remain content with current situations, you'll eventually exhaust resources and face danger.","When you pursue permanence and unchanging states, once reaching extremes, you'll discover the world has no eternally unchanging things. Maintaining constancy requires increasingly greater costs that will eventually exceed your capabilities. In the end, you can only depend on external relief to barely survive - this will be extremely dangerous.","When your abilities are insufficient to maintain current situations, you should temporarily retreat to avoid unnecessary consumption. As long as you can maintain inner-outer prosperity, don't hesitate, stick to inner righteousness and stability, and you can preserve strength in predicaments.","When facing 'indifferent' competition, you can choose to temporarily avoid confrontation rather than fighting hard. You must make decisive decisions. If opponents all leave while you still linger, you might become everyone's target. Therefore, when retreating, you must also have long-term plans.","When retreating, you must ensure your own resources and teams remain stable, like wrapping bones with cowhide so they can't easily separate. This keeps you united during crucial moments.","When you choose to retreat after heavy resource investment, you'll find it very difficult to let go, making progress difficult due to this attachment, like being plagued by illness. You should quickly abandon attachments and continuously improve yourself. For example, you can start raising servants and concubines to prepare for future counterattacks.","When you use appropriate retreat strategies at suitable times, you can retreat without chaos, maintain inner righteousness and stability, and maximally preserve strength without missing opportunities to temper yourself. But for those who retreat unwillingly and rigidly cling to corners, retreat might lead them to decline - this is undesirable.","When you actively retreat while preserving strength, your values and beliefs won't be wasted. As long as you maintain inner righteousness and stability, this is a commendable choice.","When you retreat to the highest realm, you'll assess situations and actively retire at the most suitable times. You can take away great wealth, making everything favorable.","When you 'retreat at the height of success,' you can leverage momentum in new environments to grow and develop. You'll act decisively with firm hearts - this is the best timing, enabling you to reach higher levels.","When actively attacking, you must ensure everyone maintains unified pace with all parties keeping up. If you mistakenly think your footwork is fast and charge alone, you'll definitely fall into isolated fighting dangers - you must firmly remember this.","When you continuously strengthen yourself and maintain inner righteousness and stability, everything will go smoothly - this is the path to success.","In competitive environments, you can't rely on brute force but should withstand pressure, flexibly maneuver, and gradually weaken opponents. Like using nets for hunting, you should maintain firm hearts and use pressure to temper yourself. Like rams using horns to break through fences, you use layered obstacles to constrain opponents, forcing them into passive responses.","When your strength accumulates to extremes, previous efforts finally yield harvests and past regrets disappear. You can strike while the iron's hot and win in one battle, like strong rams scattering fences and freeing horns. Through tempering, you become sufficiently strong with careers advancing steadily, like the connection between great carts and wheels being the most worn part - as long as this link is sufficiently solid, entire carts can carry heavy loads and travel far.","When 'sheep rush out of fences' and disappear, you needn't regret. This means fences you've built can no longer contain stronger opponents. Since it's happened, treat it as a lesson to improve yourself so future 'fences' will be sufficiently solid - this is the wisdom of 'mending the fold after losing sheep.'","In competition, when you continuously strengthen yourself and reach extremes, eventually you'll break free from constraints, like that strong ram that through persistence and tempering finally escapes fence restraints. This breakthrough itself is cause for celebration.","When you skillfully use quality breeding horses, you'll continuously improve entire herds' quality. Excellent breed foals will be born daily, bringing you endless competitiveness.","When opportunities arise, you must seize timing to accelerate development. You must charge forward! But during sprints, always remember your heart's desires and maintain inner righteousness and stability - this way you'll reap rich rewards. Even if outsiders question your aggressiveness, as long as results are abundant enough, questioning voices will be dissolved by your achievements.","During aggressive development, you'll inevitably worry about insufficient stamina for continuation. You should maintain firm hearts - results will prove your choices correct. When you maintain righteous paths during rapid expansion, high-level people will see your sincerity and willingly provide substantial support.","When you strive and treat everyone with integrity, you'll eventually earn competitors' respect, no longer feeling regret about past failures.","However, when aggression becomes excessive and stamina begins depleting, though your heart remains firm, you'll still fall into difficult situations. You must pay special attention not to exhaust all energy due to impatience.","When developing at high speed, you can't have everything perfect. Even without taking detours, you'll still achieve success. You should not dwell on past gains and losses but boldly look forward and follow trends - everything will be favorable.","When your rapid development reaches extremes, you're like standing on animal horn tips with no room for maneuvering. Internal instabilities and resource allocation contradictions will be exposed, forcing you to concentrate on solving internal disputes. Like facing your own people's rebellions requiring military campaigns - though dangerous, as long as you maintain inner righteousness and stability, you'll ultimately overcome dangers. This is internally emerging problems requiring attention not to trap teams in difficulties due to previous aggression.","When you need to pay attention to excessive resource consumption, you'll find yourself often acting decisively, but maintaining righteous paths consistently will be very difficult.","Excessive aggression causes unnecessary losses. Like birds flying high and far but ultimately unable to flap wings due to excessive fatigue, or like rushing during travel for three days without eating, causing physical damage. You should stop to replenish energy, or when you reach destinations, you'll become others' laughingstock instead.","When you develop too fast and your body can't support it, like muscle strains after long journeys, you should learn to promote reliable cadres to share work. Only this way can you continue advancing and achieve greater careers.","When you invest heavily in resources to participate in competition, pushing battlefields to resource-rich areas, you might ultimately capture opponents' leaders and change situations. Taking southern fire zones as examples, as long as you're sufficiently powerful, you'll be like southern battlefields with full firepower. You just need to be careful not to be too hasty and always maintain inner righteousness and stability.","When you maintain inner righteousness and stability and understand ordinary people's perspectives on things, you can clearly see damage from excessive consumption. Then you'll abandon excessive consumption strategies and exit timely to avoid greater losses.","When you're like Jizi sacrificing yourself for others, willing to bear temporary pain to strengthen your heart, as long as this helps you maintain righteousness and stability, this approach is correct.","When you shine and generate heat to extremes, your destructive power also reaches limits, ultimately falling like the sun itself, leaving behind darkness. Like the sun rising to illuminate heaven and earth but ultimately falling into yellow earth, you must guard against excessive energy consumption to avoid self-destruction.","When you can respond quickly and act decisively while always maintaining inner gentleness to preserve righteous paths, such response speed enables you to navigate complex environments with ease, not getting lost due to momentary impulses.","When you're busy outside seeking development, you must prevent 'backyard fires' - family or team internal problems. Whatever you plan to do, you must gain family or team member support. This way, regardless of results, you won't regret because 'home' is always your final fortress.","For family members, they don't need you to venture far - just keeping your duties and caring for family daily needs suffices. Such states bring enough happiness and peace.","When you're too strict in managing families, family members might complain frequently. Though short-term friction occurs, from long-term perspectives, such strict discipline benefits family members' healthy growth. Conversely, if you indulge children and wives, letting them act willfully, this often ultimately causes family loss of control with unsatisfactory results.","When you continue steady progress and forge ahead, you'll achieve fruitful results and improve family environments, letting family members live better lives. This is cause for celebration.","When you treat countries like families with 'all under heaven as one family' mindsets, people will live and work peacefully due to your fairness and integrity, and you needn't worry about social unrest. Such governance is the ideal state.","When you maintain 'family head-like' approaches in family management, you should base yourself on honesty, trustworthiness, and establishing authority. Families you manage will definitely be harmonious and progressive with everything improving.","When you can seek common ground while preserving differences in handling affairs, this brings better results. You should learn to eliminate dross and preserve essence, keeping everything beneficial to you. If there are too many impurities, you'll be counterproductive.","When encountering things contrary to yourself, first distinguish and eliminate dross while preserving essence. Simultaneously accommodate those with different views - don't exclude them due to temporary dislike. Like lost horses not needing urgent pursuit because 'old horses know the way' - they'll eventually return on their own. You should treat different people with open minds to truly embrace all.","When you decide to start anew and pursue dreams alone, you should maintain attitudes of seeking common ground while preserving differences. Even if your former boss becomes a competitor, there won't be major problems. You should speak with actual strength on new stages.","When you start anew but initially struggle, it's like ex-convicts initially only finding cart-pulling jobs but not knowing how to pull carts, always unable to travel smoothly. You must make decisions: either persist in beliefs and continue efforts to see results, or timely abandon and seek new opportunities for possible new turnarounds. Whatever path you choose, you must take action.","When you start anew but face isolation, you should timely seek dependable capable people and establish mutual trust. This way, even with many difficulties, you can mutually support each other through hard times, avoiding disasters.","When you start anew and achieve success, you'll be accepted by industries, and past regrets will disappear. If entire industries benefit from your model, joining is natural without anyone blocking.","When you become stubborn and seriously opposed, you'll be completely isolated, like pigs stuck in mud who get covered in mud trying to climb out. Seeing stranger groups, you might draw bows preparing to resist but hesitate and put them down. You shouldn't continue such useless struggles but actively seek cooperation, turning enemies into friends. After decisively making up your mind and finding and eliminating your own defects, it's like rainwater washing mud off pigs. Only this way can you recover and earn respect.","When you fall into extreme opposition and isolated fighting, your forward path is difficult like walking on thin ice or getting stuck in swamps. You should quickly seek assistance, using mountain stones to fill swamps and balance excess water rather than waiting for swamps to spread and sink deeper. If you can find capable people to help now, you can escape difficulties.","When you encounter insurmountable obstacles during progress, you should use coping methods to overcome difficulties step by step, ultimately reaching endpoints. Though processes are arduous, when you return fully loaded, you'll win huge praise - this is true 'returning with honor.'","When superiors encounter difficulties, those who truly overcome difficulties are their subordinates. You must recognize that much effort and success often comes from subordinates' contributions rather than personal credit.","During intense competition, your accumulated experience becomes practical weapons. Initially opening new paths is full of obstacles, but once roads are smooth, returning becomes easy and efficient.","The world's most beautiful and magnificent scenery is often hidden in distant, rugged places. Your journey's hardships are precisely for reaching those secret realms to reap richer rewards, making you 'return with cartloads.' Simultaneously, this attracts more partners for cooperation, bringing greater opportunities.","When you encounter huge difficulties during development, your cooperation partners won't abandon you - they'll fight alongside you through difficulties together.","When you finally reach endpoints after difficult journeys, you'll reap huge achievements. When all parties gather, you should generously display results, letting visionary superiors and the world witness your brilliance together.","In water flows, mountain stones are needed as embankments to guide water circulation. Without outlets, water just circulates back and forth in lakes, forming closed systems. With outlets, water becomes streams and rivers flowing endlessly. You must find suitable outlets in resource operations, or you'll stagnate.","When you follow natural laws in doing things, many problems will naturally fall into place and be resolved smoothly, thus avoiding disasters.","When you make efforts and gain returns, sometimes you also receive unexpected surprises, like precisely shooting foxes during hunts only to discover metal arrowheads on them - spoils that escaped from elsewhere. You should remain alert, not becoming complacent due to unexpected gains, and not being greedy. Maintaining inner righteousness and stability is key to inevitable good results.","When you're like heavily burdened workers yet riding in great carts, if your abilities are insufficient to control acquired resources, you'll definitely attract fierce competitors' covetousness. Even maintaining inner righteousness and stability makes it hard to avoid disasters.","When everything goes smoothly, you'll naturally attract opportunists to attach themselves. During this process, you must guard against grassroots hidden dangers. As the saying goes, 'thousand-li dikes collapse due to ant holes' - you should timely distinguish good from bad and eliminate dross while preserving essence. Similarly, when choosing cooperation partners, follow this principle.","When you screen others and eliminate dross while preserving essence, you can further influence harmful elements, teaching them integrity and incorporating their strength into your ranks, making them part of you. Only this way can your career advance to higher levels.","When you follow trends to reach development peaks, you'll discover the wonders of leveraging momentum. Like wise people shooting eagles, they first climb high walls to bring more strength, hitting targets with one arrow. If you learn to leverage momentum, you'll be invincible.","When your 'metallic' constitution or core strength suffers damage from various 'rust and corrosion,' you should stick to beliefs and resist external corrosion. Though processes are difficult, as long as you persist, you won't encounter major disasters. Remember: comparing yourself to cauldron bodies requires environmental assistance to function. As long as you maintain beliefs and leverage momentum, you'll always see beneficial results.","When facing urgent affairs, you should first put aside current work to handle emergencies. But you should also consider important work at hand, appropriately reducing according to your abilities rather than completely abandoning. Regardless, the most important work must be prioritized.","When you realize more important things beneficial to overall development appear, you should pause current work and prioritize handling these matters. This not only won't harm you but better promotes overall situations. After ensuring important matters are completed first, then consider handling 'urgent but unimportant' tasks.","In early cooperation, relying on one person's decisions inevitably leads to arbitrariness until suffering head injuries before knowing mistakes. If two people cooperate, they can inspire each other and progress together, negotiating solutions when encountering disagreements. If three people cooperate, disagreements often cause factional divisions, ultimately isolating one person or even mutual destruction. Therefore, you should carefully choose decision-making methods, avoiding low efficiency due to too many people.","When you help others discover and solve problems, you not only make partners quickly happy but also accumulate precious experience and earn true friendships. As long as you persist in helping others, your own career will also grow through accumulation without disasters.","When you've achieved success, you should often feel grateful and send valuable gifts to those who once helped you. This way, your relationships with them become more solid because 'reciprocity' is a good method for maintaining harmonious atmospheres.","When you sacrifice personal interests for overall trends and begin giving back to society, you must always ensure you don't harm masses' interests but let them gain actual benefits through your strength. This way you won't invite any disasters. As long as you maintain inner righteousness and stability, from long-term perspectives, all people under heaven will submit to you. Countries become like big families where everything you do brings good results.","When trends are established and you receive returns, it's harvest time. You can take this opportunity to venture out and train yourself - 'reading ten thousand books is not as good as traveling ten thousand li.' You must dare to advance from small streams to great rivers to gain more precious experience and perspectives.","When you use this opportunity to make things bigger and stronger, this is perfect and complete good fortune without disasters. You should boldly advance, making yourself prominent both within and outside industries.","When you maintain beliefs of 'reciprocity without seeking returns,' as long as you occasionally send valuable gifts, you can maintain close, seamless relationships with others. You should maintain kind thoughts and treat others with courtesy, like monarchs sacrificing to heaven with heaven bestowing blessings - a harmonious scene that's the best state.","When you engage with competitors in actual combat, you should let subordinates and partners benefit from practice. You should maintain integrity, base yourself on facts, and be impartial. When encountering problems, consult wise advisors, using sufficient respect to obtain the best advice. Only this way can you benefit and continuously improve.","When you ask wise advisors for guidance, your actions become impartial and no longer lost. You'll grow rapidly due to their corrections, attracting more cooperation partners. Like prosperous countries attracting talents from everywhere, promoting overall prosperity.","When you harbor benevolent hearts and sincerely seek welfare for all people under heaven, whatever you do requires little worry. Due to your devotion and benevolence, people naturally respond with equal devotion. As long as you maintain kind thoughts, you'll ultimately witness good returns.","When you pursue interests to extremes while ignoring benefiting partners and win-win principles, sometimes even taking by force to satisfy personal interests, you abandon original intentions of self-improvement and reasonable development. This brings extremely dangerous consequences. You must guard against such deviating behaviors and maintain original hearts and righteous paths.","When you clearly announce 'current situations can no longer satisfy needs,' you should tell yourself you can't compromise anymore, or you must take immediate action. For those who only care about interests regardless of long-term considerations, you should decisively leave and not be dragged down by others.","When you discover current conditions can no longer satisfy your development and even begin hindering you, you should decisively leave. If your advancement speed already exceeds most people, you can depart first. But this is based on clear self-ability assessment. If your actual abilities are insufficient and you force advancement, you'll fail midway and miss endpoints.","Strategically, you can despise opponents, but tactically you must take them seriously. Though you can act boldly and decisively, you can't underestimate others mentally and must constantly guard against opponents' sneak attacks when you're complacent. Like preventing enemy night raids during wars - once preparations are sufficient, you naturally have nothing to fear.","When you show clear love and hate on your face with resolute hearts, you'll appear easily ambushed or face deep hatred. You must understand that emotions and determination can't replace strategies and cooperation. If you act arbitrarily, even if partners are willing, they'll be left behind due to inability to synchronize, ultimately leaving you to advance alone. You should remain firm but not provoke storms.","When you've made decisions but lack sufficient abilities, you're like people with weak buttocks unable to move bodies forward. You need to rely on cooperation partners, borrowing their resources and abilities to verify your decisions while firmly maintaining initiative, like leading sheep forward. For any viewpoints that shake your beliefs, you must refuse.","When you've achieved success and occupy high positions, even if your hearts are gentle, you must show resolute attitudes. Like amaranth that appears soft yet can grow against wind. Only by maintaining neutrality and fairness can you ensure you don't encounter disasters.","When you push 'resoluteness' to extremes, once you have thoughts, you no longer discuss with others and immediately invest wholeheartedly. If such styles lack planning and analysis, endings are often unpredictable and extremely dangerous. You must combine 'resoluteness' with 'prudence' to ensure safety.","If you encounter strong opponents, don't fight head-to-head but use softness to overcome hardness, using affinity to dissolve opponents' sharp forces and strive for maximum benefits. Only this way can you turn enemies into friends and gain greater benefits.","When you need to slow development pace, it's like turning off engines and applying solid brakes - this is wise. Under high-speed development, once you can't stop, you'll ignore potential problems, causing serious consequences. Like weak piglets that can't withstand attacks yet still force forward, results only make you sink deeper.","When you push self-reflection to extremes, you can speak meaningfully and benefit greatly without deviations. Like fish needing water, you also need to maintain gentle, environment-adapting qualities. You keep achievements in your heart, temporarily not rushing to share externally because every full harvest needs settling. When timing matures, then go public - this ensures everything is safe.","When you are in fierce competition but your own abilities are insufficient for a long journey, it's like having no flesh on your buttocks - walking becomes difficult. You should guard your duties and use softness to overcome hardness. Even though you have experienced many trials, you can still avoid great disaster because you understand how to preserve strength in confrontation.","When the support you receive is insufficient to launch major action, acting forcefully will bring danger. You must wait patiently, first consolidating existing resources to ensure you have the confidence to take action, then build momentum for a breakthrough.","When you have achieved success but still appear weak, you will act low-key, like hiding the brilliance in your heart without easily revealing it. Although you harbor great ambitions, you may be forced to display your strength due to various unfavorable factors. You must learn to accumulate power while maintaining a low profile.",`When you practice "using softness to overcome hardness" to the extreme, you'll find there's no way back, like a soft creature touching a sharp corner, caught in a dilemma. But if you can actively entangle with your opponent, you can turn danger into safety. This combination of softness and toughness is your greatest survival strategy.`,"When everyone gathers together and follows the will of the masses, affairs will proceed smoothly. Leaders need only use this to build cohesion, like leading people to ancestral temples for worship. External communication also becomes smoother, facilitating cooperation among all parties.","When you speak with integrity but have limited ability to achieve goals alone, you should recruit like-minded people and form a team. With one call, people will respond, and once you have sufficient human and material resources, executing any grand plan won't encounter major problems.","When everyone gathers and pools their wisdom, you will gain lasting rewards. Because you came together through shared beliefs, everything you do is given meaning. Even a simple ritual sacrifice will make the environment abundant due to your sincerity.","When competitors surround you, if partners only add sympathetic sighs without changing the situation, only action can test feasibility. Even if it requires some additional cost, it won't bring major disaster.","When everyone works together in the same boat, you will succeed in everything. You may not be the team leader, but as long as everyone moves forward together, there will be no disaster. Because of mutual trust, cooperation naturally becomes smoother.","When partners gather in sufficient numbers, if you can become the leader, you need not worry about disaster. But if you cannot truly win people's hearts, you must use strength and wisdom to lead them in harmony, keeping yourself invincible. Your regrets will gradually fade.",`When gathering reaches its peak with no more people to gather, naturally some will leave. At this time, you must properly arrange "separation fees" and part gracefully, letting everyone leave reluctantly. Such "amicable separation" scenes won't bring disaster.`,"When you have accumulated sufficient resources and the team can no longer expand, you should turn to self-improvement and establish a system of upward and downward communication. You must seize current opportunities, continuously perfect yourself, and learn from capable external people without fear. Use external resources to further refine your essence so you can rise with the momentum.","When you have resource support, seize every development opportunity. You should follow principles of integrity and fairness, grasping opportunities for promotion and development - what a wonderful thing this is!","When your heart is respectful and devout, even modest sacrifices will move the spirits, and you will surely receive good returns without problems.","When you use resource advantages to pressure enemies, opponents will flee in fear upon hearing the news. If no one guards the distant front, you can take advantage and occupy that area.","When the surging flood cannot be stopped, it's like a king going to Mount Qi for sacrifice - surely auspicious and fortunate with no disasters.","When you achieve success and maintain inner stability, you can continuously reap good results. But you must also proceed step by step steadily, not becoming proud due to temporary achievements.","When you improve to the extreme in a certain field but find no clear goals, you'll fall into a state of confusion about the path ahead. If you blindly pursue improvement at this time, you'll inevitably lose direction. You must constantly correct your thinking during progress and maintain inner stability.","When you flow upward like water but suddenly reach a place where you can rise no further, you'll be trapped in a corner. But your heart remains strong, and even if constrained, there won't be great disaster. Even if surrounded on all sides with no way forward or back, as long as you maintain inner stability, you won't be ultimately defeated.","When resources are exhausted, you'll fall into poverty. It's like not even having a chair, only being able to sit on a rough tree stump for long periods, with backache, cold and hunger. In this situation, you should use time to adjust your mindset, seriously reflect on yourself, no longer be confused by others' words, and not feel sorry for yourself.",'When you have too many resources but cannot use them well, it only leads to waste and earns you the reputation of "wasteful" and "overreaching" due to mismatch with your status. You must clearly recognize that you need to position yourself and not continue being negligent in action. Like a banquet with overly abundant food and wine, it leads to waste. Truly abundant dishes are for sacrifice - only sharing at the right moment can maximize their value.',"When your competitors have gained momentum and seem unbreakable, it's like you're trapped in chaotic rocks, wanting to retreat but finding the way back full of thorns. When you finally return home, you find your wife is gone - such circumstances are truly dangerous.","When you stay in place waiting for rescue, relief supplies are often massive and slow. Initially you may need to wait longer, but if you persist, you'll eventually be saved.","When you have already achieved success, losses during setbacks are often greater. Like holding the position of senior minister but being punished with extreme penalties like nose-cutting due to unclear court orders. You must recognize your predicament, accept losses, then let go of the past and seek opportunities for comeback, like using sacrificial ceremonies to regroup.","When you're in extremely difficult circumstances, you can neither move nor stay still. It's like being entangled in messy vines unable to break free, or standing between rocks that might collapse at any moment, your whole body swaying. Any slight action will put you in danger - you'll regret moving and feel unwilling when not moving. Either way might cause regret, so it's best to take action quickly.","When your resources are limited, although you want to rebuild the city, the original well remains there unmovable. Don't try to change the resource environment. You come and go daily to draw water from the well, but the water doesn't increase or decrease with environmental changes - it always remains unchanged. Until one day, you lower the rope almost to the bottom but still can't reach water, and you angrily smash the water jar. Only then do you discover the resources have been exhausted.","When your resources face various limitations, you need to rationally analyze existing resource conditions, then make decisive choices. You find the well water has become muddy and unclear, unfit for consumption; those abandoned, dried wells don't even attract birds to forage. You must face reality and timely abandon useless water sources.","When your resources are extremely tight, you can only live frugally with a scene of decay at home. The well water has long dried up, with only burping frogs left at the bottom; the water containers at home are also breaking down - some have no lids, some are damaged and leaking, useless to you.","Although the mud in the well has been cleaned, if no one comes to use it, it pains your heart. Only when you personally draw water to enjoy do you understand this is because superiors ordered improvements to water resources. From this you can see that when rulers are wise, everyone can enjoy benefits together.","When you increase investment to prevent problems, like using earth to pile up and bricks to build wells, there will be no disasters.","You should keep well water clear and pure, like sweet, cool spring water for all people to drink.","After completing transformation of resources and environment, you can continuously provide support and achieve win-win results. Once well renovation is complete, you can enable people to draw water continuously; with sufficient resources, there's no need to monopolize or set extra limits on well covers. As long as you sincerely share resources, you can create a harmonious and beautiful situation.","When waiting for the right time to reform, you must clarify the purpose of reform and keenly grasp the timing to act. You must know that virtue brings support - reform requires inner persistence and external environmental support. If you use favorable timing to make the land more fertile, reform can proceed smoothly. This is an internally and externally closed-loop, unobstructed process; once reform succeeds, you'll never regret it.","If you sense the timing isn't ripe, you must steady yourself, force restraint, and accumulate strength. Like using tough ox hide to bind yourself, preventing easy escape.","When you wait until the timing matures, you can begin implementing reform. This opportune moment is often when reform targets shift from prosperity to decline, revealing corruption. Acting decisively at such times achieves good results without problems.","If you rashly promote innovation and participate in competition, you'll face danger. In such situations, you can only maintain inner calm and temper yourself in competition. You must push reform from top to bottom to achieve twice the result with half the effort. After careful and thorough demonstration, the innovative plans you propose must seek approval from higher levels and gain trust and full authorization before launching changes.","During reform, if you can correct mistakes in time, you'll eliminate regret and win more partners' trust. You use their power to change conventional orders, gaining more benefits - this is a good thing.","When you have achievements, you can propose innovative plans from time to time; after evaluation, if plans are excellent enough, you should implement them. First, apply reform to yourself, like a tiger changing its coat in molting season, completely transforming with a fresh appearance. With rich experience, you develop good change response mechanisms; in early reform stages, relying on strong capabilities and leadership position, you can win subordinates' and partners' trust before seeing results.","When your reform reaches its peak, the whole will rise to a new level. Gentlemen are refreshed, and even small people change their appearance. When reform is just completed, you need to consolidate results without being too radical, otherwise it brings danger. You should advance steadily and maintain inner calm - this is the correct path.","You should use existing resources to create buffers and borrow external forces to improve yourself, letting your essence fully manifest.","When you borrow external forces to passively improve yourself, you must prepare thoroughly to prevent being misled by external influences. Like before cooking, you must turn the cauldron upside down to pour out useless residue. A cauldron that borrows fire for cooking teaches you about leveraging momentum. Taking a concubine easily causes family disputes, but if this brings you a son, ensuring succession, then this matter is fine.","When you gain more capabilities through self-improvement, it's like a full cauldron, which attracts competitors' jealousy. But because this is internal development, outsiders cannot interfere or approach to compete, so this state benefits you.","If external fire burns too vigorously, it will cause the cauldron ears to fall off. Your cauldron body becomes too hot to move, very inconvenient for cooking; even the fattest pheasant can only be looked at but not put in the pot. When it's about to rain, the cauldron is too hot to touch, meaning you waste a pot of good soup, causing regret. However, as long as rain will eventually extinguish the remaining fire and cool the cauldron, there will ultimately be good results.","If the cauldron legs break, it's equivalent to spilling everyone's food, making a sticky mess on the ground - this looks very dangerous.","When you equip the cauldron with bronze ears and sturdy gold handles, even the largest fire cannot damage your cauldron, which greatly benefits maintaining inner stability.","When you equip the cauldron with jade handles, you improve your own quality, and everything will go smoothly.",`If you become everyone's "backbone," you must remain calm in the face of change, achieving internal and external harmony. When thunder sounds, everyone is afraid, but you must remain composed and talk and laugh; when thunder spreads far and others are terrified, you still eat calmly without spilling a drop of wine from your hand.`,'You need to continuously train yourself, bear pressure, and overcome your own fears to motivate those around you. Like continuous thunder, initially you too will be afraid, but through conscious training, you can maintain composure and truly become the "backbone" - this is a good thing.',`When thunder and lightning (opportunities) arrive, you should seize opportunities to temper yourself, even if this temporarily costs you peace. Great opportunities often come with great wealth, but don't actively pursue wealth - just grasp opportunities well and wealth will naturally come. In ancient culture, "seven" corresponds to yin-yang and five elements, symbolizing a small cycle, referring to this opportunity. Those who only pursue wealth actually can't get it, while those who practice internal skills have wealth delivered to them.`,"If you have guilt in your heart, you're more easily scared by sudden thunder and lightning. Thunder makes you fearful and uneasy, while lightning illuminates the sky and intimidates petty people. When advancing through thunder and lightning, you needn't worry about not seeing the path ahead or being deceived by small people.","When facing great opportunities and pressure, if you're not strong enough, you're more likely to fall into difficulty. Like being startled by thunder and falling into a swamp.","When thunder comes and goes repeatedly, you should use this opportunity to temper yourself and maintain inner peace and tranquility. The same applies when encountering major accidents.",`If your inner vigilance reaches the extreme, you're not suitable for taking initiative. Like when heavenly thunder shakes, you feel fearful and look around anxiously. If you act rashly when your mind is unsettled, it brings danger. The thunder hasn't reached you yet but has already struck your neighbors; you must learn from this and stay vigilant always, then there will be no disasters. However, even if neighbors suffer while you escape, you'll inevitably be labeled "selfish," and when you want to cooperate with others, you may hear cold remarks.`,"Whether you're in stillness or motion, you should integrate with the environment as one, without distinction. This way you can share various responsibilities with surroundings and enjoy everything together, without disasters occurring.",`If you persist in inner "stillness," you should stick to your good side and recognize your strengths. For good aspects, you should persist; when people want to act, they must first step forward, stand firm, and remain unwavering, then they won't invite disaster. You consistently maintain inner stability - this is a good thing.`,"When you're like a calf building strength, you already have potential ability, but only when the waist and hips drive the calf can you truly move forward; this means although you have strength, it's insufficient for substantial action. Therefore, you should maintain the status quo and postpone expansion; at the same time, you should care for subordinates, letting them see growth opportunities to prevent them from feeling dejected.","When you're in competition, you can't just turtle up and not move, but should assess the situation and strike decisively when opportunities arise. Otherwise, when opponents grow stronger, you'll fall into greater difficulty. Like keeping your waist motionless while the two muscle pieces on your back lose coordination with the waist, your whole person can't exert force, causing burning anxiety.","In cooperation with others, you should maintain self-restraint. At that time, you're like keeping your body still, and there will be no disasters.","When you keep your cheeks serious and unchanging, speaking clearly and in order, you can explain things clearly. Regrets caused by misunderstandings will also disappear.","If you can practice uprightness to the extreme, you'll display qualities of caution and sincerity, which benefits you.","When you infiltrate and transform gradually, it's like falling in love with someone you admire and eventually marrying them - this is a beautiful thing.","When you encounter capable people, you'll be influenced by them toward good development; the opposite is also true. Like waterbirds coming to waterside to learn swimming and catching fish, it's all subtle cultivation and gradual progress. Just as you teach children, scolding them when they do wrong, good habits naturally form over time, so there won't be problems.","When everything falls into place and you catch small fish, you should find a reef to land on and safely enjoy the harvest. This shows gaining beautiful results after good transformation - very delightful.","If you participate in competition but suddenly find the new environment completely unsuitable, it's like waterbirds coming to arid, waterless land. Applied to human affairs, it's like a husband going to war and never returning, or a wife becoming pregnant but unable to raise the child. This is an extremely dangerous situation - not suitable for taking initiative, better to use defensive strategies to resist external enemies.","When you gradually enter the forest, occasionally finding flat branches for you to perch on, in this state there will be no disasters.","Even if you're in an environment you're not used to, you can still achieve success through gradual development and transformation. Like waterbirds finally succeeding in flying to high mountains; in your life, it's like a wife who couldn't conceive for three years finally getting her wish and not being replaced - this is a good thing.","When your infiltrative development reaches its peak and you achieve self-growth, you can quickly adapt to various environments, like coming to the hub of roads leading in all directions. At this time you have strength and need to choose to bear corresponding responsibilities - this is better. Like waterbirds becoming decorations in ceremonies due to their beautiful feathers.","When you gradually infiltrate, passively adapt, and transform passivity into initiative, you should be like grass entwining gold, letting yourself harmonize with the environment without forced cutting; otherwise, forcing action will only backfire.","If you marry off your daughter, you should actively adapt to new environments. Among three travelers, there must be my teacher; when you discover others have strengths or ways of dealing with the world that you lack, you should humbly learn, stay calm, and put yourself in a lower position. Like marrying as a concubine, through learning you complete what you lack, finally transforming what you learned into your own and promoting it widely, like a lame person learning to walk again through recovery and learning, then being able to travel far. This is a good thing.","When you actively adapt to new environments, you should also match your positioning. Even if blind, you can still see things; you needn't feel inferior, should actively adapt with an open mind, not rejoicing in external things or being sad about yourself, using a hermit's stability to guide your thinking.","When you marry off your daughter as everyone's main wife, but due to her comprehensive capabilities and character, she can only marry as a concubine in the end.","If you persist in yourself and don't easily follow blindly, like an unmarried girl refusing to marry easily, causing delays in marriage. But you needn't worry - postponing is just to wait for better timing; even if delayed, you'll eventually marry.","When Emperor Yi marries off the girl, from clothing perspective, the main wife's clothing isn't as bright and beautiful as the concubine's. This is because by the 15th of the lunar month, as the main wife of the family, you only seek family happiness and reunion - this is a good thing.","When your adaptation reaches its peak, you've learned everything learnable with nothing left to adapt to; like a woman's basket being empty with all fruits eaten; or like a man slaughtering livestock but seeing no blood (the livestock is already dead), continuing in this situation has no meaning or benefit.","If you want to strengthen yourself, you should be like using dry grass to start fire - under proper operation and environment, you can ignite a big fire and achieve smooth progress. Superiors can use this to strengthen themselves, like a country flourishing. Once the fire grows large, vegetation is immediately burned out, but you can also use vegetation to preserve the fire; when using vegetation to preserve fire, though the flame is weak, it's not easily extinguished, which is reassuring. When you need to ignite the fire, you can also rely on favorable timing, like at noon when it's hot, lighting fire becomes easier.","When you have resources suitable for rapid development, naturally you should seize opportunities, but also pay attention to whether subsequent resources can keep up to meet continuing development needs. Otherwise, original resources will quickly be consumed, and grand scenes will only be brief. You need to find resources matching development, so even with long-term development, there won't be major problems. As long as you continue developing with greater achievements, you'll gain everyone's respect.","During rapid development, unknowable problems will also emerge. Like in broad daylight, sunlight being blocked layer by layer by clouds or eclipse, even being able to see the Big Dipper in daytime - this isn't a good omen. Such situations easily bring suspicious voices to your decision-making. Actually, this is just a common phenomenon - as long as you respond calmly and solve problems one by one, there will be good results; you should be confident and believe your decision-making and goal-setting are correct.","When competitors surround you heavily from all directions, banners block out the sun like a canopy, and you can barely see sunlight. If you grasp the flagpole but let competitors break your right arm, you'll lose control of the flagpole, like being deprived of sunlight. At this time, you should strive to regain initiative and let sunlight shine on you again - this is a good thing.","During rapid development, if you encounter floating clouds blocking the sun with everyone in panic, you should realize your partners' superiors may face the same problems. You should seriously listen to their opinions, and everyone working together can overcome difficulties and achieve good results.","When you achieve success, talented people will come to seek your patronage, meaning you have the support of capable generals and wise ministers, which also brings celebration and good reputation - this is a good thing.","If you're overly aggressive, causing excessive resource consumption until even basic supply becomes problematic, you'll fall into isolation. Like building tall houses but blocking windows, only able to peek outside through cracks, with no visitors for long periods; three whole years without seeing people - such self-imposed isolation is very dangerous.","When you over-consume resources causing resource tension, you should adjust development strategies and seek new directions; meanwhile maintain inner stability without blind impulsiveness.","You should adjust your development direction according to resource conditions. When external resources don't match development policies, you must be flexible and adjust strategies to ensure efficient resource utilization. At this time you must note that you should make changes matching resource conditions, not just make insignificant small changes to stick to your ways, otherwise it often causes greater costs and may miss good opportunities, thus inviting disasters.","When the environment changes, you should adjust yourself in time. Because of your previous accumulation, you already have basic conditions for making a living, so there's no need to worry even when traveling outside. Like when tired during travel, you have inns to stay in; your travel funds are sufficient and subordinates unanimously support you.","If your lodging catches fire during travel and you lose your accompanying servants, you should maintain inner stability and endure the tempering.","When you're in a foreign land, although you find stable lodging and earn daily travel expenses and supplies, your mood still isn't pleasant because this is just temporary rest during the journey.","If you go out hunting pheasants and kill with one arrow, this shows that after going through hardships and practicing skills, you finally succeed and win praise with perfect accuracy.","When you're displaced and finally achieve something, even if your temporary station isn't really home, you should understand this is like a bird's nest catching fire and burning down; you first laugh from success, then cry loudly because your station is destroyed, even losing cattle - such circumstances are very dangerous.","When you're in a displaced state, you still need to maintain humility and compliance. Even though you're relatively weak and can't do great things, you yourself are still a beautiful existence, able to achieve small smooth progress. When working with others, you'll show overall harmony and beauty, extremely attractive.","When you encounter people more accomplished than yourself, you need to maintain compliance and humility, but this doesn't mean blind following; you should still stick to your own opinions. If the other party retreats, you needn't worry - you'll naturally develop and keep up. At this time you should make decisive decisions with the firm will of a warrior.","When you decide to put away previous achievements and treat upcoming events with humble compliance, it's like putting treasures displayed on a table away under the bed, then asking historians or sorceresses to pray for you. This approach is appropriate and won't cause problems.","If you're suppressed by competitors, even though you show compliance, you'll fall into difficult situations due to over-cherishing yourself.","When you choose cooperation and mutual aid while maintaining humble compliance, you'll be successful everywhere and gain abundantly, with all regrets disappearing. Like during hunting, you obtain rich and diverse prey of all varieties.","When you already have achievements but still maintain compliance and stability, you can eliminate all regrets, and everything you do will go smoothly. Even if initially you fall into choice difficulties and poor decisions due to many people offering suggestions, gradually you'll get used to this state; in the process of complying with others and being complied with by others, you'll form a virtuous cycle - this is a good thing.","If you're humble and compliant to the extreme, like hiding all treasures from the table under the bed, you lose the most basic value. Although you maintain inner stability, over-suppressing yourself brings danger.","When you finally achieve success with everyone happy and business thriving, you still need to maintain inner stability.","When you're superior to the external, though better than others, you should understand that red flowers and green leaves each have their merits; as long as you respect each other and give due respect, everyone can coexist harmoniously and ultimately achieve a happy result for all.","You should believe you can do better - this confidence benefits you and can help adjust your mindset and eliminate inner regrets.","If your competitors come to your side but try to please and maintain a situation where everyone is happy, this approach is often unrealistic and hides danger.","When you cooperate with others, you should reach solutions that make everyone happy through consultation or negotiation. During negotiations, you'll experience setbacks and long waits, unable to maintain peace; but each time you solve a problem and reach consensus, you'll feel joyful.","When you achieve success, you should take making the world happy together as your responsibility. But you must recognize that the benefit entanglements between different classes are hard to balance fairly; if you only please one class, you'll harm opposing class interests, causing them to psychologically distance themselves from you. To preserve the integrity of this separated class, you have to increase your own burden and try to balance all sides - this is very difficult and dangerous.","When you lead people to enjoy together, you should let everyone feel the joy of participation.","Even if disharmony exists, as long as you can grasp timing and achieve internal-external consistency, you can succeed. When you're in an advantageous position, you can take the opportunity to establish new belief systems, like representing people in ancestral temple sacrifices; this helps you quickly promote things and maintain inner stability.","When external conditions are superior to yourself and people's hearts are scattered, you needn't force those who are no longer loyal; instead you should re-cultivate core competitiveness, selecting those who are both capable and compliant-loyal, strengthening yourself by promoting them. Like using strong good horses to compensate for your insufficient strength - such results benefit you.","When people's hearts are scattered, it's a good opportunity for you to make structural adjustments. You should seize this chance to remove impurities and preserve essence, making all regrets disappear.","When facing competition, you should temper opponents while also using this pressure to deconstruct internal different thoughts and make distinctions. Like using flowing water to wash opponents' whole bodies; even if water scatters everywhere, you needn't regret.","When you fully display your abilities, you can make those factional small groups dissolve - this is true harmony. Once small groups dissolve, great integration appears, and partners put away selfishness to unite as one, gathering like hills in a spectacular scene.","When you achieve success, you should take responsibility for the people. When people's hearts are scattered, you should issue orders that are carried out, re-establishing the core of trust. Meanwhile, you should eliminate private interests, lead by example, and distribute wealth accumulated in palaces - this way there will be no disasters.","If you scatter excessively, causing irreparable damage, you should wash clean the blood flowing from wounds and preserve yourself far away - this way you won't invite disasters.","When people's hearts have scattered, you can temporarily retreat and preserve yourself, maintaining restraint. But you can't let restraint become suffering, otherwise inner distress cannot maintain inner uprightness.","If you're excellent while external competition gradually appears, challenging your authority, you shouldn't immediately take initiative to create more internal competition; you should first examine yourself, ensure your own stability (including resources, market, relationships), and control contact with the outside to avoid unnecessary consumption - this way you can avoid problems.","When your interior is solid and develops into a strong entity, don't be self-enclosed; you should take the opportunity to enter market competition. Like wealthy families staying behind closed doors - this approach only invites disaster.","Facing competition, if you don't actively advance, you'll regress; if you keep waiting without restraint, when later competitors catch up to you, you can only sigh helplessly in grief. Once this happens, you can still rely on your ability advantages to catch up again without major disasters.","In cooperation, you should maintain self-restraint. Don't treat restraint as shackles, but realize this is natural and reasonable, then peacefully accept it - this way you can achieve internal-external consistency and smooth progress.","When you already have achievements, restraint becomes the price of success; if you extend restraint broadly, those being restrained will happily accept it - this is a good thing. As long as you persist, you'll gain everyone's respect.","If you restrain excessively, even affecting normal life and falling into painful states, at this time you'll face danger due to excessive weakness, even if your inner faith remains firm. You should understand that restraint is the faith in your heart - though the body suffers, inner regrets will gradually disappear.","You should maintain confidence and treat others sincerely, like fish swimming freely in water, naturally nurturing a good ecological atmosphere. As long as you maintain inner stability, everything will go smoothly.","When dealing with external clients or competitors, you must build on a foundation of integrity. First, you should rationally evaluate whether the other party is trustworthy - this way you can get good results. Once you choose to trust someone, you should persist; if you always harbor doubts, you cannot maintain inner peace.","You should establish trustworthy relationships with barrier-free communication. Like cranes calling under tree shadows - even if young cranes can't see, they can respond with calls. If you have good things, you should share with the other party, sharing joys and sorrows; like having good wine, you should drink together with friends until it's finished.","When you hold fast to the faith in your heart, regardless of success or failure, you should take responsibility for your decisions. When encountering competitors, either you beat war drums and actively engage, or you cease fighting and retreat; there are only two results: either you're defeated and cry, or you return victorious singing.","If your cooperation partners leave, you should wish them happiness, like approaching the 15th lunar day when people seek family reunion. Even if your horses are lost, paired horses can always find each other; though you lose a pair, as long as each parts amicably, there will be no disasters.","When you achieve internal-external unity, you can make the entire market connect as one through integrity with seamless cooperation - when facing losses everyone feels pain together, when gaining benefits everyone shares glory together. Regardless of final results, they are what you obtained by following inner faith, without disasters.","If you're confident to the extreme, you become arrogant and force yourself to do things beyond your ability, ultimately harming others and yourself. Like a golden pheasant with a loud voice that cannot fly high but wants to reach heaven. Even if you have such faith in your heart, limited ability still brings danger.","You should understand that confidence must be built on sufficient understanding of external things. Even the best external resources don't belong to you - you must start from scratch, working steadily step by step. Like birds in the sky only leaving calls, no other traces can remain. Therefore, whatever you do, you cannot aim too high but must be down-to-earth to achieve very good results.","You should guard against over-confidence and unrealistic goals, referring to external excellences to learn and apply them. For you, more importantly you should advance step by step, not like flying birds that fly past, seeing only surfaces without gaining anything.","When you visit others, this is just a means; your real purpose is to learn useful things - don't put the cart before the horse. If you visit an expert but only meet his teacher, or don't see the boss but meet his subordinate, as long as you understand what you wanted to know, there's no problem.","In competitive environments, if you don't understand enemy-ally situations and haven't really visited and communicated, you should remain cautiously alert and prepare emergency responses just in case. Because if you follow blindly, you might cause irreparable losses - that would be truly dangerous.","If you and cooperation partners have the same goals, even lacking special visits, no major disasters will occur; you'll often meet and communicate. However, developing long-term, differences in strategic planning and handling methods will gradually show, internal disagreements will become increasingly serious, ultimately forming great obstacles. You must prevent such things from happening in advance, not being too stubborn or persisting for the sake of persisting.",`When you achieve success, people will come visit you. Visitors come from afar like generated water vapor rising into clouds, but if visitors also follow the principle of "hiding in small places," this cloud won't yet turn into raindrops. Through communicating with visitors, you can gain their experience without leaving home - this is also your new harvest. Like wise hunters who tie thin ropes to arrow shafts, even if prey runs into holes, they can drag it back.`,`If you and the other party don't know each other but rashly go visiting, it's like birds flying into nets - this is very dangerous, so-called "natural and human disasters."`,"When you use water to extinguish fire, if water momentum is strong enough, you can completely extinguish the fire, making everything smooth with increasingly timely responses. Initially, if water is small and fire large, it will instead fuel the fire; but as long as you continuously add water, you can eventually extinguish the fire. You should know when to stop and not do things absolutely or completely.","When you discover internal-external contradictions, first distinguish the comparison of forces; when you recognize external forces are large and irreversible, you should re-formulate policies, completely abandoning existing plans when necessary and doing the opposite. Though you must pay considerable costs, the earlier you respond, the sooner you can return to the right track. Like a moving cart, when you pull the wheels, the cart cannot move forward; if you use all your strength pulling the wheels, your tail will droop powerlessly and get wet from dragging on the ground. Thus, you won't invite greater disasters.","When you fall into internal-external contradictions unable to harvest or display abilities, it's like women losing jewelry and being unable to dress up. However, your abilities are still there. As long as you handle internal-external relationships and adjust directions and strategies, you'll eventually have opportunities to display talents and gain harvests. Like seven-day small cycles - you'll harvest results again then.","When you compete with evenly matched opponents, it's like Shang King Gaozong conquering Gui Fang, taking exactly three years to achieve final victory. Three years of battle exhausted your soldiers, preventing casual use of force. Among soldiers, those with achievements but no ability can't be promoted despite heavy rewards.","When you and cooperation partners have conflicts in management thinking and corporate culture, you must constantly remain vigilant. Like fine silk mixed with old cotton - once relaxed, hidden dangers emerge.","You must understand that only things that truly benefit you are favorable. Like holding grand ox-killing sacrifices that don't actually benefit environments, simple but sincere sacrifices can truly benefit environments. The reason lies in practical benefits being right there.","When water completely extinguishes fire, it becomes a completely water-dominated world where you can't swim and easily drown to your head - this is very dangerous.","If you want to escape 'when birds are gone, bows are stored' situations, you must stake everything and break out of those territories to achieve prosperity. Like small foxes using wet tails to save fires - such methods can't extinguish fires and bring no benefits.","When you fight wholeheartedly, you should view internal-external contradictions as opportunities and use your efforts to change external situations. If you have sufficient abilities, you should invest wholeheartedly and strive for that glimmer of hope, using small self-strength to fight surrounding external forces without any concerns - life and death, success and failure depend on this one action. Like using tail-dampened water drops to extinguish fires is far from enough - only soaking your entire body and rushing into fire scenes might possibly break through limitations.","When facing the most difficult moments, you should recognize your current weakness and powerlessness. Even if external oppression is severe, you can't blindly struggle according to instinct and waste energy. Instead, you should restrain yourself, accumulate strength, and seek breakthrough opportunities. You must consider carefully, observe meticulously, and not act rashly. Like driving cars that sometimes need to brake while maintaining power (simultaneously stepping on gas and brake pedals), maintaining inner righteousness and stability ensures ultimately good results.","In intense competition, when your abilities are insufficient for great victories, if you stubbornly oppose, that's extremely dangerous. Rather than fighting weak opponents, it's better to decisively yield and seek suitable places to open new battlefields.","When you're in 'burn boats and break cauldrons' situations, pursuing ideals with no retreat and fighting with backs against walls. As long as you maintain inner righteousness and stability without regret, you can be like leading troops to conquer Gui Fang - even after three years of hardship, you'll ultimately win and build countries into giants.","When you've already burned boats and bridges while going all-out, calmly walking through raging fires, you're like brilliant existences that make others look with new eyes. Precisely because you stick to beliefs, you can break through layers of blockades - this is admirable!","When you've done what should be done, you should leave things to fate and accept victory or defeat with pleasant hearts. You should confidently drink and make merry while calmly facing success and failure. If you've made full preparations yet still fail, don't be overly sad. You should timely adjust yourself, put down burdens, and quickly emerge from valleys. Using alcohol to drown sorrows is understandable, but excessive drinking until even your head is wet is inappropriate."]),hi=Object.freeze(["Like when you were just born, you touched the world with both hands, gradually recognizing yourself while also understanding this strange environment.","You need to build a solid foundation internally, adjusting your state to continuously accumulate energy, ready to interact with the external environment and engage in external competition.","When you begin to interact with the external environment, you constantly probe and observe opponents, adjusting strategies based on your relationship with external competitors.","Once you gain external recognition, you must objectively evaluate your own state from the perspective of external collaborators and explore strategies together.","When you have deeply integrated with the external environment, you must examine your position as a leader and formulate corresponding action plans.","Having reached this point, you find yourself approaching the limits of what the external environment can accommodate, so you contemplate transformation amid difficulties and advance to the next stage."]);var gi=["知行合一，内外通达，行事果断而端方正直","像大地般包容承载，温顺而坚韧；起初迷茫，渐渐形成主见","扎根为先，不随大流；目标未明时，先在已有领域耕耘","启蒙待人来求，教导要有分寸，灌输过多反而有害","如土中珍宝待雨冲刷，时机一到，便可走向更大的天地","争论中坚持己见，但要留有余地，必要时请有能力的人相助","统领众人，任用老成持重之人更为稳妥","动荡之中守住坚贞，随波逐流只会更加被动","积蓄尚浅，如密云未雨，继续沉淀到条件成熟","看似如履虎尾，放下犹豫执行计划，不必过虑","小有付出，大有回报，努力得到报偿","付出多而回报少，努力不被认可，需要重新评估得失","聚散为同，齐心协力，可以一同闯荡","承担起庇护众人的责任，内外一致，和谐亨通","谦和真诚、勤奋踏实，日久自会赢得支持","万事俱备，不惧外界干扰，可以大胆开拓","身居主导，仍随外部变化调整，内外一致而无灾祸","建立生生不息的生态，向外闯荡时不破坏平衡","居上监督考察，下属成长后仍紧抓不放，便埋下隐患","打理好自己，不必推销，酒香不怕巷子深","补足薄弱环节，处理人事有法可依、果断利落","适度修饰可锦上添花，但改变不了本质，只宜小处调整","明确目的，不随波逐流，在诱惑中保持清醒","在自己的主场来去自如，引来同伴，形成良性循环","谨守原则，不妄动；放下偏见，才看得清全局","持续积累，借外部条件充实自己，时机成熟再出山","照顾团队、支持他人之余，自己的养护还得靠自己","压力过大如栋梁压弯，要与团队合力化解，不可单打独斗","身陷重险，像水一样柔韧，守住本心与立场","想借外力脱困，要果断守正，像母牛般柔顺勤勉、积蓄力气","与人一拍即合、配合默契，彼此成全，事半功倍","找到能长久的做事方式，带领众人协同前进","力不足以维持现状时，暂时隐退，保全实力","适时急流勇退，到新环境里借势成长，更上一层楼","善用良种，不断繁育提升，竞争力源源不断","资源消耗过度，守正格外吃力，仍要在艰难中坚持","行事果断而内心柔和，守住正道，不因冲动迷失方向","求同存异，去芜存精，杂质太多反而得不偿失","孤军奋战、举步维艰，要尽快找有能力的人协助脱困","在资源运转中找到自己的出路，否则就会停滞不前","根基受损时坚守信念，借势而行，挺过艰难","收获之时，趁势出去闯荡，开阔经验与格局","表明现状难以为继，不再妥协；远离只顾眼前利益的人","遇到强势对手，以柔克刚，用亲和化敌为友","顺应众意，凝聚向心力，众人协作更顺畅","扩张到头时转向提升自己，向能者学习，乘势而上","升到尽头被困住，进退两难，守住内心便不至被击垮","资源看似恒常不变，日日取用，终有耗尽的一天","变革要明确目的、把握时机，内有坚持，外有支持","以已有资源为缓冲，借外部之力提升，让精华尽数展现","身为主心骨，惊雷当前也处变不惊、从容自若","动静之间与环境融为一体，共担共享，便无灾祸","循序渐进、逐步渗透，好事水到渠成","处境被动，先顺应环境、与之契合，硬来只会适得其反","壮大如引火燃薪，既懂保存火种，也懂借天时燃旺","资源吃紧时调整策略、另寻方向，不盲目冲动","颠沛中保持谦逊柔顺，小事顺通，与人合作更显和谐","皆大欢喜之时，仍要保持内心的正直安定","人心不和之时，借有利地位建立共同信念，推动事情","暂时退守、保持节制，但节制不可过苦，过苦难以持久","自信而以诚待人，如鱼得水，自然形成良好氛围","外部资源再好也不属于自己，脚踏实地，不好高
